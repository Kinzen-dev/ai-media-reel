</style></head><body><main><nav><span class="nav-brand">a little sorbet</span><span class="nav-note">Good taste. Small portions. Great company.</span></nav><section class="tasting-stage"><h1>A small taste<br>of <em>wonderful.</em></h1><div class="dish asset-wrap"><div class="asset-fallback" aria-hidden="true"></div><img src="../assets/astra/sorbet-dish.webp" width="1280" height="1280" alt="A raspberry sorbet scoop in a pistachio ceramic dish"></div><article class="recipe"><div class="recipe-eyebrow"><span class="dot"></span><span id="recipe-course">The bright beginning</span></div><h2 id="recipe-title"></h2><p id="recipe-ingredients"></p><div class="recipe-meta"><span id="recipe-time"></span><span>Serves 4</span></div></article><div class="course-status"><b class="dynamic" data-testid="counter">5</b><span>little courses.<br>one lovely evening.</span></div><div class="chat dynamic"><div class="chat-head"><span>Your menu, coming together</span><span>↗</span></div><p class="chat-text"><span data-testid="typing"></span><span class="cursor"></span></p></div></section><div class="flight" aria-label="Explore the tasting flight"><div class="flight-line dynamic" aria-hidden="true"></div><button class="course" data-course="0" aria-pressed="true"><span>TO BEGIN</span><strong>Tomato &amp; peach</strong></button><button class="course" data-course="1" aria-pressed="false"><span>SOMETHING GREEN</span><strong>Peas &amp; soft herbs</strong></button><button class="course" data-course="2" aria-pressed="false"><span>A LITTLE WARMTH</span><strong>Lemon butter beans</strong></button><button class="course" data-course="3" aria-pressed="false"><span>THE HAPPY ENDING</span><strong>Raspberry sorbet</strong></button><button class="course" data-course="4" aria-pressed="false"><span>ONE LAST BITE</span><strong>Pistachio shortbread</strong></button></div><div class="wordmark" aria-label="Sorbet">sorbet.</div><footer class="bottom-row"><div class="progress-row dynamic"><div class="progress-track"><div class="progress-fill" data-testid="progress" role="progressbar" aria-label="Tasting menu progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"></div></div><span class="percent">100%</span></div><span class="demo-note">An illustrative tasting-flight planner. Pick a course to explore its recipe.</span><div class="controls"><button id="pause">Pause</button><button id="replay">Replay ↗</button></div></footer></main><script src="../assets/vendor/gsap.min.js"></script><script>const DATA=[{target:5,title:'Tomato & peach',course:'The bright beginning',ingredients:'Ripe tomatoes, a blushing peach, torn basil. Dress with olive oil and a little flaky salt.',time:'10 minutes · no cooking',message:'Five little courses, a lovely rhythm. Start bright with tomato and peach, then follow the ribbon through to something sweet.'},{target:5,title:'Peas & soft herbs',course:'Something green',ingredients:'Sweet peas, mint, dill, and a spoonful of creamy ricotta. Finish with lemon zest and good olive oil.',time:'15 minutes · gently warm',message:'Keep the second course light: sweet peas, soft herbs, and ricotta. Your five-course flight has a fresh green moment.'},{target:5,title:'Lemon butter beans',course:'A little warmth',ingredients:'Butter beans folded through warm olive oil, garlic, lemon zest, and parsley. Serve with crisp sourdough.',time:'20 minutes · one pan',message:'A warm little middle: lemony butter beans and crisp sourdough. All five courses now flow from fresh to comforting to sweet.'},{target:5,title:'Raspberry sorbet',course:'The happy ending',ingredients:'Raspberries, a simple sugar syrup, and a squeeze of lemon. Blend, strain, then churn until softly frozen.',time:'20 minutes + freezing',message:'The fourth course is a bright raspberry reset. Chill your bowls ahead and your five-course evening ends on a lovely note.'},{target:5,title:'Pistachio shortbread',course:'One last bite',ingredients:'Butter, flour, icing sugar, and chopped pistachios. Press into small rounds and bake until the edges turn gold.',time:'30 minutes · oven baked',message:'One last buttery bite: pistachio shortbread, ready before guests arrive. Your five-course flight is planned from first taste to last.'}];function updateProduct(d){document.querySelector('#recipe-title').textContent=d.title;document.querySelector('#recipe-course').textContent=d.course;document.querySelector('#recipe-ingredients').textContent=d.ingredients;document.querySelector('#recipe-time').textContent=d.time;document.querySelectorAll('[data-course]').forEach((e,i)=>e.setAttribute('aria-pressed',i===active));}document.querySelectorAll('[data-course]').forEach(e=>e.addEventListener('click',()=>{active=Number(e.dataset.course);build()}));const motion=matchMedia('(prefers-reduced-motion: reduce)');let paused=false;let active=0;let model={amount:0,letters:0};const counter=document.querySelector('[data-testid="counter"]'),typing=document.querySelector('[data-testid="typing"]'),bar=document.querySelector('[data-testid="progress"]'),pause=document.querySelector('#pause');function render(){const d=DATA[active];counter.textContent=Math.round(model.amount);typing.textContent=d.message.slice(0,Math.round(model.letters));const p=Math.min(100,Math.round(model.amount/d.target*100));bar.style.transform='scaleX('+p/100+')';bar.setAttribute('aria-valuenow',p);document.querySelector('.percent').textContent=p+'%';if(document.querySelector('.flight-line'))document.querySelector('.flight-line').style.transform='scaleX('+p/100+')';}function build(){if(window.demoTimeline)window.demoTimeline.kill();window.demoTimeline=null;const d=DATA[active];updateProduct(d);if(!window.gsap||motion.matches){model.amount=d.target;model.letters=d.message.length;render();document.querySelectorAll('.dynamic').forEach(e=>{e.style.opacity=1;e.style.transform='none'});pause.disabled=true;pause.textContent=motion.matches?'Motion off':'Pause';return}pause.disabled=false;pause.textContent=paused?'Resume':'Pause';model.amount=0;model.letters=0;render();const tl=gsap.timeline({repeat:-1,paused,onUpdate:render});window.demoTimeline=tl;tl.set('.dynamic',{opacity:0,y:10}).set(model,{amount:0,letters:0}).to('.dynamic',{opacity:1,y:0,duration:.65,stagger:.08,ease:'power2.out'},.1).to(model,{letters:d.message.length,duration:2.3,ease:'none'},.65).to(model,{amount:d.target,duration:2.5,ease:'power2.out'},1.65).addLabel('complete').to({}, {duration:2.8}).addLabel('reset').to('.dynamic',{opacity:0,y:-6,duration:.5}).to({}, {duration:.1});}pause.addEventListener('click',()=>{if(motion.matches||!window.demoTimeline)return;paused=!paused;window.demoTimeline.paused(paused);pause.textContent=paused?'Resume':'Pause'});document.querySelector('#replay').addEventListener('click',()=>{paused=false;build()});motion.addEventListener('change',build);document.querySelectorAll('.asset-wrap img').forEach(img=>{img.addEventListener('error',()=>img.hidden=true);if(img.complete&&!img.naturalWidth)img.hidden=true});build();</script></body></html>
