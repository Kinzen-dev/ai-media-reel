>Pause</button><button id="replay">Replay ↻</button></div></footer></main><script src="../assets/vendor/gsap.min.js"></script><script>
const COLLECTIONS={short:{prompt:'Make a small shelf for a summer of curious reading. Keep the books short.',books:[['The Quiet Atlas','Mara Vale','A mapmaker begins recording the places that disappear when nobody is looking. Her smallest discoveries slowly redraw the way home.','#30589c',345],['Peach Weather','Jonah Reed','Three neighbors trade weather reports from their windows. A summer of small observations becomes an unlikely friendship.','#dfa58d',308],['A Borrowed Moon','Iris Hale','An observatory caretaker lends a telescope to a restless child, and finds her own curiosity returning one clear evening at a time.','#ede0bd',360],['Pocket Rivers','Theo Moss','A collection of miniature journeys follows the hidden streams beneath an ordinary city and the people who remember them.','#687d6e',292],['The Last Window','Ada Finch','Before a tiny cinema closes, its projectionist hosts one final screening for a single, very unexpected guest.','#d1bd8d',327],['Blue Hour Club','Nico Lake','Strangers meet at the same park bench just before dawn. Their quiet ritual changes when one of them brings a question.','#344959',353],['Field Notes','Wren Cole','A botanist returns to the garden she abandoned and discovers that someone has been keeping careful notes in her absence.','#d8aa91',314],['Almost Home','Sana Bell','A missed train leaves two siblings walking across their childhood town, finding familiar places slightly rearranged.','#a7b3a0',335]]},slow:{prompt:'Make a shelf for slow, absorbing reading. Give each of these five worlds a little room.',books:[['The Long Orchard','Elia North','Across four seasons, a family restores an abandoned orchard. Their different memories of the place prove harder to tend than its trees.','#536c54',359],['Rooms for Rain','Milo Ash','An architect designs houses around the weather their owners miss. A commission without a location draws him into an unfinished story.','#344d8a',342],['The Tidal House','Rosa Wynn','A house on the edge of a changing coast gathers a century of letters, each addressed to a resident who has not yet arrived.','#d7a391',368],['Letters to Winter','Eden Shaw','Two distant correspondents exchange accounts of their ordinary days. Years later, an unanswered letter sends one of them across the country.','#ddd0b0',328],['A Wider Silence','Oren West','A sound archivist sets out to preserve the quietest places he can find, learning how much a silence can hold.','#52616a',350]]}};let currentCollection='short',selectedBook=0;const DATA={prompt:COLLECTIONS.short.prompt,total:8};
function bookInk(color){return ['#30589c','#344959','#344d8a','#536c54','#52616a','#687d6e'].includes(color)?'#faf4dd':'#374334'}
function pageMarkup(book){return '<h2>'+book[0]+'</h2><p class="byline">'+book[1]+' · Fictional book</p><p class="synopsis">'+book[2]+'</p>'}
function updateSelection(focus=false){const books=COLLECTIONS[currentCollection].books;document.querySelectorAll('.book-item').forEach((item,i)=>{item.classList.toggle('selected',i===selectedBook);const button=item.querySelector('button');button.setAttribute('aria-pressed',String(i===selectedBook));button.tabIndex=i===selectedBook?0:-1;});document.querySelector('#mobile-reading').innerHTML=pageMarkup(books[selectedBook]);document.querySelector('#browse-label').textContent=(selectedBook+1)+' of '+books.length;if(focus)document.querySelector('[data-book-index="'+selectedBook+'"]').focus();window.selectedBookData={title:books[selectedBook][0],author:books[selectedBook][1],synopsis:books[selectedBook][2]};}
function renderBooks(){const collection=COLLECTIONS[currentCollection];DATA.prompt=collection.prompt;DATA.total=collection.books.length;const shelf=document.querySelector('#books');shelf.dataset.count=collection.books.length;shelf.innerHTML=collection.books.map((book,i)=>'<div class="book-item" style="--height:'+book[4]+'px;--book-color:'+book[3]+';--book-ink:'+bookInk(book[3])+'"><div class="book-shell step dynamic"><button class="spine" data-book-index="'+i+'" aria-label="Read synopsis of '+book[0]+'" aria-pressed="false"><img class="book-material" src="../assets/astra/spines-book.webp" alt="" hidden onload="this.hidden=false"><span class="spine-title">'+book[0]+'</span><span class="spine-author">'+book[1]+'</span><span class="spine-dot" aria-hidden="true"></span></button><div class="open-page"><span class="page-category">A LITTLE WINDOW INTO THE BOOK</span>'+pageMarkup(book)+'<span class="page-foot">An original sample synopsis.</span></div></div></div>').join('');document.querySelectorAll('[data-book-index]').forEach(button=>button.addEventListener('click',()=>{finishForInspection();selectedBook=Number(button.dataset.bookIndex);updateSelection()}));document.querySelectorAll('[data-collection]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.collection===currentCollection)));updateSelection();}

const typed=document.querySelector('[data-testid="typing"]'),counter=document.querySelector('[data-testid="counter"]'),fill=document.querySelector('[data-testid="progress"]'),percent=document.querySelector('[data-testid="percent"]'),pause=document.querySelector('#pause'),replay=document.querySelector('#replay'),media=matchMedia('(prefers-reduced-motion: reduce)');const state={characters:DATA.prompt.length,count:DATA.total,progress:100};
function paint(){typed.textContent=DATA.prompt.slice(0,Math.round(state.characters));counter.textContent=Math.round(state.count);fill.style.width=state.progress+'%';fill.setAttribute('aria-valuenow',Math.round(state.progress));percent.textContent=Math.round(state.progress)+'%';const perimeter=document.querySelector('.perimeter-fill');if(perimeter)perimeter.style.strokeDashoffset=100-state.progress;}
function stable(){Object.assign(state,{characters:DATA.prompt.length,count:DATA.total,progress:100});paint();if(window.gsap)gsap.set('.dynamic',{clearProps:'opacity,transform'});pause.disabled=true;replay.disabled=true;pause.textContent='Pause';pause.setAttribute('aria-pressed','false');}
function init(){if(window.demoTimeline)window.demoTimeline.kill();if(!window.gsap||media.matches){window.demoTimeline=null;stable();return;}pause.disabled=false;replay.disabled=false;pause.textContent='Pause';pause.setAttribute('aria-pressed','false');Object.assign(state,{characters:0,count:0,progress:0});paint();gsap.set('.dynamic',{opacity:0,y:10});const tl=gsap.timeline({repeat:-1});window.demoTimeline=tl;tl.set('.dynamic',{opacity:0,y:10}).set(state,{characters:0,count:0,progress:0,onUpdate:paint}).to('.chat',{opacity:1,y:0,duration:.6},.2).to(state,{characters:DATA.prompt.length,duration:2.3,ease:'none',onUpdate:paint},.85).to('.step',{opacity:1,y:0,duration:.65,stagger:.15,ease:'power3.out'},3.3).to('.result',{opacity:1,y:0,duration:.5},3.5).to(state,{count:DATA.total,progress:100,duration:2.5,ease:'power2.out',onUpdate:paint},3.5).to('.finish',{opacity:1,y:0,duration:.4},6.1).addLabel('complete',6.6).to({}, {duration:3.3}).addLabel('reset',9.9).to('.dynamic',{opacity:0,y:-8,duration:.65,stagger:.015},9.9).set('.dynamic',{y:10});}
function finishForInspection(){if(window.demoTimeline){window.demoTimeline.pause().seek('complete',false);pause.textContent='Resume';pause.setAttribute('aria-pressed','true');}}
pause.addEventListener('click',()=>{const t=window.demoTimeline;if(!t)return;t.paused(!t.paused());pause.textContent=t.paused()?'Resume':'Pause';pause.setAttribute('aria-pressed',String(t.paused()));});replay.addEventListener('click',()=>{if(window.demoTimeline){window.demoTimeline.restart();pause.textContent='Pause';pause.setAttribute('aria-pressed','false');}});media.addEventListener('change',init);

renderBooks();paint();init();document.querySelectorAll('[data-collection]').forEach(b=>b.addEventListener('click',()=>{currentCollection=b.dataset.collection;selectedBook=0;renderBooks();init();}));function moveBook(delta,focus=false){finishForInspection();const count=COLLECTIONS[currentCollection].books.length;selectedBook=(selectedBook+delta+count)%count;updateSelection(focus)}document.querySelector('#previous').addEventListener('click',()=>moveBook(-1));document.querySelector('#next').addEventListener('click',()=>moveBook(1));document.querySelector('#books').addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();moveBook(e.key==='ArrowRight'?1:-1,true)}});
