<!-- TEMPLATE: Lock House | ARCHETYPE: The painted cottage door (a pen-drawn Georgian door on an almost empty warm page, the season's gouache fruit painted across its upper panels under signwritten lettering, the day's hours pinned to the lower panel as a paper notice, menus as a stack of typeset sheets) | REF: cafececilia.com, chezpanisse.com, Union Boulangerie, Rochelle Canteen | WHEN TO USE: an illustration-led cafe, bakery or restaurant whose own building or object can carry the identity, with one hand-painted mark that changes with the season | SWAP: edit the DATA object at top of the script -->
<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lock House</title>
<meta name="description" content="Lock House, a cafe and bakery in the lock-keeper’s cottage at Lock 7: breakfast, lunch, bread and cakes to take away, and supper on Fridays.">
<meta name="theme-color" content="#FDFAF6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;1,400&family=Jost:wght@500&display=swap" rel="stylesheet">
<script>
  /* runs before first paint: arm the entrance only when motion is welcome */
  (function () {
    var d = document.documentElement;
    d.classList.add('js');
    try { if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) d.classList.add('intro'); } catch (e) {}
  })();
</script>
<style>
  :root {
    --paper: #FDFAF6;
    --ink: #111111;
    --panel: #EEEEEC;
    --fruit: #5E2A82;      /* season deep: caret, set live from DATA */
    --fruit-tint: #F0C3D8; /* season pale: text selection, set live from DATA */
    --g: 50px;             /* page margin */
    --col: 34%;            /* the reading axis below the fold */
    --fs: 24px;
    --lh: 1.3;
    --fs-s: 13px;
    /* the door is drawn in a 440 x 760 viewBox; --u is one drawing unit in px */
    --hero-h: max(100vh, 640px);
    --dh: min(760px, calc(var(--hero-h) - 130px), calc((100vw - 560px) * 2.04));
    --u: calc(var(--dh) / 760);
    --door-top: calc((var(--hero-h) - var(--dh)) / 2);
    --shift: clamp(0px, calc((100vw - 1000px) * 0.1), 48px); /* the door stands a little right of centre, the list beside it */
    --beside: calc(50% + var(--u) * 186 + 48px); /* the casing edge plus a gap, from the centre line */
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  @supports (height: 100svh) { :root { --hero-h: max(100svh, 640px); } }
  *, *::before, *::after { box-sizing: border-box; }
  html {
    background: var(--paper);
    color: var(--ink);
    scrollbar-width: thin;
    scrollbar-color: rgba(17, 17, 17, 0.42) var(--paper);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
  body {
    margin: 0;
    background: var(--paper);
    font-family: 'Cardo', 'Iowan Old Style', Georgia, serif;
    font-size: var(--fs);
    line-height: var(--lh);
    font-variant-numeric: oldstyle-nums proportional-nums;
    font-kerning: normal;
    -webkit-font-smoothing: antialiased;
    caret-color: var(--fruit);
  }
  ::selection { background: var(--fruit-tint); color: var(--ink); }
  p, h1, h2, figure, ul, ol { margin: 0; }
  a {
    color: inherit;
    text-decoration-line: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
    text-decoration-color: rgba(17, 17, 17, 0.4);
    transition: text-decoration-color 0.2s;
  }
  a:hover { text-decoration-color: var(--ink); }
  :focus-visible { outline: 1.5px solid var(--ink); outline-offset: 4px; border-radius: 1px; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
  .sr {
    position: absolute !important; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
  }
  .skip { position: fixed; left: var(--g); top: 12px; z-index: 50; font-size: var(--fs-s); font-style: italic; background: var(--paper); padding: 4px 8px; transform: translateY(-200%); }
  .skip:focus { transform: none; }

  /* ---------- the nav list: beside the door, then fixed at the top left ---------- */
  .nav ul { list-style: none; padding: 0; }
  .nav a { text-decoration: none; display: inline-block; }
  .nav a:hover, .nav a[aria-current="true"] { font-style: italic; }
  .nav .subs { display: none; padding-left: 0.6em; }
  .nav li.on > .subs { display: block; animation: subs-in 0.24s var(--ease); }
  .nav .subs a { font-style: normal; }
  .nav .subs a:hover, .nav .subs a[aria-current="true"] { font-style: italic; }
  @keyframes subs-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes nav-in { from { opacity: 0; } to { opacity: 1; } }
  @media (min-width: 861px) {
    /* on the first screen the list stands beside the door, flush to the casing, level with the top of the leaf */
    .nav { position: absolute; z-index: 20; right: calc(var(--beside) - var(--shift)); top: calc(var(--door-top) + var(--u) * 154 - 6px); text-align: right; }
    .past .nav { position: fixed; right: auto; left: var(--g); top: 175px; text-align: left; animation: nav-in 0.34s ease-out both; }
  }

  /* the monogram: four dry-brush strokes, drawn on in hand order (never L11 midway) */
  .mono {
    position: fixed; z-index: 21; left: calc(var(--g) - 6px); top: 34px;
    width: 120px; height: 80px; display: block;
    opacity: 0; visibility: hidden; transition: opacity 0.18s, visibility 0s 0.18s;
  }
  .mono svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .past .mono { opacity: 1; visibility: visible; transition: opacity 0.2s, visibility 0s; }
  .mk { stroke-dasharray: 1 2; stroke-dashoffset: 0; }
  .past .mono .mk { animation: pen 0.44s cubic-bezier(0.45, 0.05, 0.3, 1) both; }
  /* the H is one quick gesture: its three strokes overlap, so no half-letter (L11, Lt) ever holds on screen */
  .past .mono .mk2 { animation-delay: 0.34s; animation-duration: 0.3s; }
  .past .mono .mk3 { animation-delay: 0.41s; animation-duration: 0.3s; }
  .past .mono .mk4 { animation-delay: 0.44s; animation-duration: 0.3s; }
  @keyframes pen { from { stroke-dashoffset: 1.001; } to { stroke-dashoffset: 0; } }

  .menu-btn, .bar { display: none; }

  /* ---------- the first screen: the cottage door ---------- */
  .hero { position: relative; height: var(--hero-h); }
  .stage { position: absolute; inset: 0; background: var(--paper); isolation: isolate; overflow: hidden; }
  .door { position: absolute; left: calc(50% + var(--shift) - var(--u) * 220); top: var(--door-top); width: calc(var(--u) * 440); height: var(--dh); }
  /* three plates, all multiplied onto the paper so the painting's white ground disappears:
     the paint (on its own layer, so its drift never redraws the pen), the pen drawing, the signwriting */
  .door-paint, .door-pen, .door-sign { position: absolute; inset: 0; display: block; width: 100%; height: 100%; overflow: visible; mix-blend-mode: multiply; }
  .door-paint { will-change: transform; }
  .paint-ns { position: absolute; left: -1.55%; top: 12.83%; width: 96.8%; height: auto; mix-blend-mode: multiply; }
  .sign-t { font-family: 'Jost', 'Futura', sans-serif; font-weight: 500; font-size: 60px; font-variant-numeric: normal; }
  .no7 { font-family: 'Cardo', Georgia, serif; font-size: 23px; font-variant-numeric: lining-nums; }

  /* entrance: the paint goes down along three loose brush strokes, the signwriting prints over it, the notice is pinned */
  .bs { stroke-dasharray: 1 3; stroke-dashoffset: 1.001; }
  .bfill { opacity: 0; }
  html.intro .paint-img { mask: url(#brush); }
  html.intro.go .bs1 { animation: brush 0.4s cubic-bezier(0.3, 0.7, 0.25, 1) 0s forwards; }
  html.intro.go .bs2 { animation: brush 0.4s cubic-bezier(0.3, 0.7, 0.25, 1) 0.24s forwards; }
  html.intro.go .bs3 { animation: brush 0.42s cubic-bezier(0.3, 0.7, 0.25, 1) 0.48s forwards; }
  html.intro.go .bfill { animation: soak 0.26s ease-out 0.74s forwards; }
  @keyframes brush { to { stroke-dashoffset: 0; } }
  @keyframes soak { to { opacity: 1; } }
  html.intro .sign { opacity: 0; }
  html.intro.go .sign { animation: print 0.3s ease-out 0.82s forwards; }
  @keyframes print { from { opacity: 0; transform: translate(1.5px, -1px); } to { opacity: 1; transform: none; } }
  html.intro .notice { opacity: 0; }
  html.intro.go .notice { animation: pin 0.38s cubic-bezier(0.2, 0.75, 0.3, 1) 1.08s forwards; }
  @keyframes pin { from { opacity: 0; transform: translateY(-10px) rotate(-6deg); } to { opacity: 1; transform: rotate(-1.6deg); } }

  /* the day's hours on a slip torn from a pad, inked round and pinned to the lower panels */
  .notice {
    --nw: min(max(calc(var(--u) * 180), 192px), calc(var(--u) * 300));
    position: absolute; z-index: 2;
    left: calc(var(--u) * 214 - var(--nw) / 2); top: calc(var(--u) * 504);
    width: var(--nw); aspect-ratio: 200 / 78;
    display: grid; place-items: center; padding: 9px 15px 5px;
    font-size: max(13px, calc(var(--u) * 14.5)); font-style: italic; line-height: 1.35;
    text-align: center; text-wrap: balance;
    transform: rotate(-1.6deg);
  }
  /* the slip is drawn in a 216 x 100 box around a 200 x 78 sheet, so it scales without distortion */
  .slip { position: absolute; left: -4%; top: -15.385%; width: 108%; height: 128.205%; display: block; overflow: visible; pointer-events: none; }
  .notice > span { position: relative; }

  /* the year in six marks, beside the credit for this season's painting */
  /* no z-index here: a stacking context would isolate the marks' multiply and show their white ground */
  .caption { position: absolute; left: calc(var(--beside) + var(--shift)); right: 24px; max-width: 300px; bottom: calc(var(--hero-h) - var(--door-top) - var(--u) * 750 - 3px); }
  .marks { list-style: none; padding: 0; margin: 0 0 9px; display: flex; gap: 4px; }
  .marks li { position: relative; width: 30px; height: 30px; background-repeat: no-repeat; mix-blend-mode: multiply; opacity: 0.2; }
  .marks li.now { opacity: 1; }
  .line { font-size: var(--fs-s); font-style: italic; line-height: 1.35; letter-spacing: 0.01em; text-wrap: balance; }

  /* ---------- below the fold ---------- */
  main { position: relative; }
  .sec { padding: 150px var(--g) 0 var(--col); scroll-margin-top: 0; }
  .h { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .prose { max-width: 30em; text-wrap: pretty; }
  .prose p + p { margin-top: 1.3em; }
  .note { font-style: italic; }

  /* menus: the grey paper panel and a stack of typeset sheets */
  .band { background: var(--panel); padding-top: 120px; padding-bottom: 116px; overflow-x: clip; }
  .stack { display: grid; width: min(660px, 100%); }
  .sheet {
    grid-area: 1 / 1; background: var(--paper);
    padding: 58px 56px 50px; text-align: center; transform-origin: 50% 42%;
    box-shadow: 0 0 0 1px rgba(17, 17, 17, 0.07), 0 1px 3px rgba(17, 17, 17, 0.05);
  }
  .sheet-mono { display: block; width: 66px; height: 44px; margin: 0 auto 22px; }
  .page-t { font-style: italic; }
  .page-d { font-size: var(--fs-s); font-style: italic; line-height: 1.35; margin-top: 3px; }
  .dishes { margin-top: 32px; }
  .grp + .grp { margin-top: 1.05em; }
  .dish { text-wrap: balance; }
  .dish .p { margin-left: 0.42em; white-space: nowrap; }
  .dish .n { display: block; font-style: italic; }
  .page-f { margin: 34px auto 0; max-width: 31em; font-size: var(--fs-s); font-style: italic; line-height: 1.4; text-wrap: balance; }
  .pager { width: min(660px, 100%); display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 18px; font-size: 17px; } /* a caption under the sheets, not a carousel control */
  .pg { padding: 2px 4px; min-width: 5.2em; }
  #pgPrev { text-align: right; }
  #pgNext { text-align: left; }
  .pg:hover { font-style: italic; }
  .dots { display: flex; }
  .dot { width: 26px; height: 26px; display: grid; place-items: center; }
  .dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--ink); transition: background-color 0.2s; }
  .dot[aria-current="true"]::before { background: var(--ink); }

  /* bread */
  .bake { border-collapse: collapse; margin-top: 1.3em; width: 100%; max-width: 23em; }
  .bake td { padding: 0 0 0.14em; vertical-align: baseline; }
  .bake .t { width: 3.6em; font-variant-numeric: oldstyle-nums tabular-nums; }
  .bake .pr { width: 2.4em; text-align: right; font-variant-numeric: oldstyle-nums tabular-nums; }
  .bake tr.later { font-style: italic; }
  .bread-note { margin-top: 1.3em; }

  /* cakes */
  /* the order slip: label and rule share a baseline, like a printed form */
  .order { margin-top: 1.6em; max-width: 26em; display: grid; gap: 14px; }
  .order .row { display: grid; grid-template-columns: 8.6em minmax(0, 1fr); column-gap: 0.6em; align-items: baseline; }
  .order label { font-style: italic; }
  .order input {
    width: 100%; min-width: 0; font: inherit; color: inherit; background: transparent;
    border: 0; border-bottom: 1px solid var(--ink); border-radius: 0; padding: 0 0 3px; margin: 0;
  }
  .order input:focus-visible { outline: none; border-bottom-width: 2px; padding-bottom: 2px; }
  .order input[aria-invalid="true"] { border-bottom-style: dotted; }
  .send { justify-self: start; margin-top: 14px; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.2em; }
  .send:hover { font-style: italic; }
  .thanks { margin-top: 1.5em; font-style: italic; max-width: 30em; }

  .linkish { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.2em; text-decoration-color: rgba(17, 17, 17, 0.4); }
  .linkish:hover { font-style: italic; text-decoration-color: var(--ink); }

  /* find us */
  .find .block + .block { margin-top: 1.3em; }
  .find em { font-style: italic; }

  /* about: the year in fruit */
  .year-wrap { margin-top: 2.4em; max-width: 900px; background: var(--paper); isolation: isolate; }
  .year { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
  .year li { min-width: 0; }
  .year img { display: block; width: 100%; height: auto; aspect-ratio: 1; mix-blend-mode: multiply; }
  .year .cap { font-size: var(--fs-s); font-style: italic; line-height: 1.35; text-align: center; margin-top: -10px; text-wrap: balance; }
  .year-note { margin-top: 18px; font-size: var(--fs-s); font-style: italic; line-height: 1.4; }

  /* hire, shop, press */
  .list { list-style: none; padding: 0; margin-top: 1.3em; max-width: 30em; }
  .list li + li { margin-top: 0.85em; }
  .list .p { margin-left: 0.42em; white-space: nowrap; }
  .list .d { display: block; font-style: italic; }
  .press li { display: grid; grid-template-columns: 8.6em minmax(0, 1fr); column-gap: 0.8em; }
  .press li + li { margin-top: 0.2em; }
  .press .when { font-style: italic; }
  .ig { margin-top: 1.3em; }

  .foot { padding: 160px var(--g) 46px var(--col); font-size: var(--fs-s); font-style: italic; line-height: 1.4; display: flex; justify-content: space-between; gap: 24px; }

  /* ---------- 860 and below: the phone composition ---------- */
  @media (max-width: 860px) {
    :root {
      --g: 20px; --col: 20px; --fs: 20px; --lh: 1.36;
      --dh: min(calc((100vw - 28px) * 1.881), calc(var(--hero-h) - 214px));
      --door-top: calc(72px + (var(--hero-h) - 200px - var(--dh)) / 2);
    }
    .bar { display: block; position: fixed; z-index: 30; top: 0; left: 0; right: 0; height: 62px; background: var(--paper); transition: background-color 0.25s; }
    .in-menus .bar { background: var(--panel); }
    .menu-btn { display: block; position: fixed; z-index: 32; left: 14px; top: 10px; padding: 8px 6px; font-size: 22px; }
    .menu-btn:hover { font-style: italic; }
    .nav {
      display: none; position: fixed; inset: 0; z-index: 31; padding: 78px 20px 40px;
      background: var(--paper); font-size: 28px; line-height: 1.38; overflow-y: auto;
    }
    .nav.open { display: block; animation: subs-in 0.2s ease-out; }
    .nav .subs { padding-left: 0.7em; font-size: 22px; }
    .mono { left: auto; right: 14px; top: 9px; width: 66px; height: 44px; z-index: 32; }
    .nav.open ~ .mono { opacity: 0; visibility: hidden; }

    .caption { left: 20px; right: 20px; max-width: none; bottom: auto; top: calc(var(--door-top) + var(--u) * 750 + 20px); text-align: center; }
    .marks { justify-content: center; margin-bottom: 8px; }
    .marks li { width: 28px; height: 28px; }

    .h { position: static; width: auto; height: auto; overflow: visible; clip-path: none; white-space: normal; font-weight: 400; font-style: italic; font-size: var(--fs); margin: 0 0 0.85em; }
    .sec { padding-top: 92px; scroll-margin-top: 40px; }
    .band { padding: 84px 12px 64px; }
    .band .h { padding-left: 8px; }
    .sheet { padding: 38px 18px 34px; }
    .sheet-mono { width: 56px; height: 38px; margin-bottom: 16px; }
    .page-t, .dishes { font-size: 18px; line-height: 1.34; }
    .dishes { margin-top: 24px; }
    .dish + .dish { margin-top: 0.42em; }
    .pager { gap: 10px; }
    .bake .t { width: 3.3em; }
    .order .row { grid-template-columns: minmax(0, 1fr); }
    .order label { font-size: var(--fs-s); line-height: 1.35; }
    .order input { padding-top: 2px; }
    .year { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 14px; }
    .press li { grid-template-columns: minmax(0, 1fr); }
    .press li + li { margin-top: 0.6em; }
    .foot { padding-top: 110px; flex-direction: column; gap: 6px; }
  }
  @media (max-width: 360px) {
    .bake .t { width: 3.6em; }
  }

  @media (prefers-reduced-motion: reduce) {
    .mono { transition: none; }
    .past .mono .mk, .past .nav { animation: none; }
    .nav li.on > .subs, .nav.open { animation: none; }
  }
</style>
</head>

        [{ transform: depthT(k), opacity: 1, offset: 0 }, { opacity: 0.94, offset: 0.34 }, { transform: AWAY, opacity: 0, offset: 1 }],
        { duration: 460, easing: 'cubic-bezier(0.4, 0, 0.5, 1)', fill: 'forwards' }));
      anims.push(inkOf(p).animate([{ opacity: 1 }, { opacity: 0, offset: 0.3 }, { opacity: 0 }], { duration: 460, fill: 'forwards' }));
    });
    staying.forEach((p, k) => anims.push(sheets[p].animate(
      [{ transform: depthT(k + steps) }, { transform: depthT(k) }],
      { duration: 460, easing: EASE_OUT, fill: 'forwards' })));
    anims[0].onfinish = () => {
      order = staying.concat(leaving);
      layout();
      anims.forEach((a) => a.cancel());
      leaving.forEach((p) => sheets[p].animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, easing: 'ease-out' }));
      busy = false;
    };
  }
  /* Previous: the bottom sheet slides back in from the left over the stack, blank paper first, then its ink */
  function slideBack() {
    const p = order[N - 1], rest = order.slice(0, N - 1);
    sheets[p].style.zIndex = String(N + 1);
    const anims = [
      sheets[p].animate([{ transform: AWAY, opacity: 0, offset: 0 }, { opacity: 0.94, offset: 0.4 }, { transform: depthT(0), opacity: 1, offset: 1 }], { duration: 460, easing: EASE_OUT, fill: 'forwards' }),
      inkOf(p).animate([{ opacity: 0 }, { opacity: 0, offset: 0.45 }, { opacity: 1 }], { duration: 460, fill: 'forwards' })
    ];
    rest.forEach((r, k) => anims.push(sheets[r].animate([{ transform: depthT(k) }, { transform: depthT(k + 1) }], { duration: 460, easing: EASE_OUT, fill: 'forwards' })));
    anims[0].onfinish = () => {
      order = [p].concat(rest);
      layout();
      anims.forEach((a) => a.cancel());
      busy = false;
    };
  }
  function show(i) {
    i = ((i % N) + N) % N;
    if (i === page || busy) return;
    const depth = order.indexOf(i);
    sync(i);
    if (reduce || !sheets[0].animate) {
      order = order.slice(depth).concat(order.slice(0, depth));
      layout();
      return;
    }
    busy = true;
    if (depth === N - 1 && N > 2) slideBack(); else slideAway(depth);
  }
  $('#pgPrev').addEventListener('click', () => show(page - 1));
  $('#pgNext').addEventListener('click', () => show(page + 1));
  dots.forEach((d) => d.addEventListener('click', () => show(+d.dataset.i)));
  subs.forEach((a) => a.addEventListener('click', () => show(+a.dataset.page)));
  $('#toSupper').addEventListener('click', () => {
    show(2);
    $('#menus').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' });
  });

  /* ---------- cake order ---------- */
  $('#order').addEventListener('submit', (e) => {
    e.preventDefault();
    const f = e.currentTarget;
    const empty = [...f.querySelectorAll('input')].find((i) => !i.value.trim());
    if (empty) { empty.focus(); empty.setAttribute('aria-invalid', 'true'); return; }
    const first = f.querySelector('#c-name').value.trim().split(/\s+/)[0];
    const p = document.createElement('p');
    p.className = 'thanks';
    p.setAttribute('role', 'status');
    p.textContent = 'Thank you, ' + first + '. Ruth will ring or write within a day to confirm the cake, the size and the price.';
    f.replaceWith(p);
  });

  /* ---------- scroll state: monogram, active item ---------- */
  const secs = navIds.map((id) => document.getElementById(id));
  const navItems = [...document.querySelectorAll('#navList > li')];
  const listH = $('#navList').offsetHeight;
  const wide = matchMedia('(min-width: 861px)');
  let current = null, ticking = false, pastAt = innerHeight * 0.55;
  /* the list leaves the door and pins to the top left only once it has scrolled out of sight */
  function measure() {
    const d = $('#door').getBoundingClientRect();
    pastAt = wide.matches ? Math.max(innerHeight * 0.4, d.top + scrollY + 154 * d.height / 760 + listH + 12) : innerHeight * 0.55;
  }
  function update() {
    ticking = false;
    const vh = innerHeight;
    root.classList.toggle('past', scrollY > pastAt);
    let act = null;
    for (const s of secs) if (s.getBoundingClientRect().top <= vh * 0.38) act = s.id;
    if (act !== current) {
      current = act;
      navItems.forEach((li) => {
        const on = li.dataset.id === act;
        li.classList.toggle('on', on);
        const a = li.querySelector('a');
        if (on) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current');
      });
    }
    const mb = $('#menus').getBoundingClientRect();
    root.classList.toggle('in-menus', mb.top < 62 && mb.bottom > 62);
  }
  measure();
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } }, { passive: true });
  addEventListener('resize', () => { measure(); update(); }, { passive: true });
  update();

  /* ---------- the phone list ---------- */
  const nav = $('#nav'), btn = $('#menuBtn');
  function setOpen(open) {
    nav.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', String(open));
    btn.textContent = open ? 'Close' : 'Menu';
    document.body.style.overflow = open ? 'hidden' : '';
    if (open) nav.querySelector('a').focus();
  }
  btn.addEventListener('click', () => setOpen(!nav.classList.contains('open')));
  nav.addEventListener('click', (e) => { if (e.target.closest('a') && nav.classList.contains('open')) setOpen(false); });
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && nav.classList.contains('open')) { setOpen(false); btn.focus(); } });
})();
</script>
</body>
</html>
