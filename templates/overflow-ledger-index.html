<!-- TEMPLATE: Overflow Ledger Index | ARCHETYPE: Found-objects intake ledger (an archive and shop as one register of display-size rows that run off the right edge, the object waiting at the end of each row; the find of the week set into the wall as its anchor) | REF: Visual (Archives) Society, MSCHF, LAMENT.TV, Roma Publications | WHEN TO USE: a collection, archive, gallery or small shop whose catalogue IS the site: registers, inventories, back catalogues, editions, programmes | SWAP: edit the DATA object at top of the script -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office of Found Objects: intake register</title>
<meta name="description" content="The intake register of the Office of Found Objects, Rotterdam: every object we take in, every text, talk, exhibition and edition, one sentence per entry.">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500&display=swap">
<style>
/* Palette: white, black, one office green. 40 percent black only for what can no longer be had. */
:root{
  --paper:#FFFFFF;
  --ink:#000000;
  --green:#00A651;
  --spent:rgba(0,0,0,.4);
  --fs:6.6vw;                 /* register size: 95px at 1440 */
  --lh:.83;
  --row:calc(var(--fs) * var(--lh));
  --g:24px;                   /* page gutter, and the moat between the wall and the find of the week */
  --lead:200px;               /* the office name and the reading position share this measure */
  --recw:216px;               /* every end record has this one width, so every object's right edge falls on one line */
  --rec-gap:16px;             /* object to its record */
  --rec-mb:calc(var(--fs) * .062 - 3px);   /* lifts a record so its last baseline sits on the sentence baseline */
  /* the find of the week is set into the wall from the cap line of its own row to the baseline of the
     second row beneath (Switzer 500: cap .68em, baseline .768em down an .83em line box) */
  --a-top:calc(var(--fs) * .088);
  --a-size:calc(var(--row) * 2 + var(--fs) * .68);
  --zone:calc(var(--g) * 2 + var(--recw) + var(--rec-gap) + var(--a-size));
  --desk-h:44px;
  --filt-h:36px;
  color-scheme:light;
}
@media (max-width:1180px) and (min-width:761px){
  :root{ --lead:180px; --recw:184px; }
}
@media (max-width:760px){
  :root{ --fs:clamp(34px, 9.5vw, 46px); --g:16px; --desk-h:52px; --filt-h:38px; }
}

*,*::before,*::after{ box-sizing:border-box; }
html{
  background:var(--paper); color:var(--ink);
  scrollbar-color:var(--ink) var(--paper); scrollbar-width:thin;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:400 12px/15px "Switzer","Inter Tight",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;
  font-kerning:normal;
  caret-color:var(--green);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}
::selection{ background:var(--green); color:var(--ink); }
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-track{ background:var(--paper); }
::-webkit-scrollbar-thumb{ background:var(--ink); }
:focus-visible{ outline:2px solid var(--green); outline-offset:2px; }
a{ color:inherit; text-decoration-thickness:1px; text-underline-offset:.2em; }
p{ margin:0; }
button{ font:inherit; color:inherit; letter-spacing:inherit; }
.vh{ position:absolute !important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; }
.skip{ position:absolute; left:-9999px; top:8px; z-index:40; background:var(--ink); color:var(--paper); padding:6px 8px; text-decoration:none; }
.skip:focus{ left:var(--g); }

/* a value on an intake record: the heavier of the two weights, never bracketed */
.v{ font-weight:500; }
.f{ white-space:nowrap; }

/* ---------- the intake counter ---------- */
.desk{
  position:sticky; top:0; z-index:20;
  height:var(--desk-h);
  background:var(--paper); color:var(--ink);
  padding:0 var(--g);
}
.desk-in{
  height:100%;
  display:grid; grid-template-columns:var(--lead) minmax(0,1fr);
  column-gap:var(--g); align-items:center;
}
.desk-name{ margin:0; font:inherit; font-weight:500; white-space:nowrap; }
/* the desk's live state. Only whole fields are ever shown: a field that does not fit wraps onto a
   second line that the counter never shows. */
.desk-state{
  min-width:0;
  display:flex; flex-wrap:wrap; column-gap:28px;
  height:15px; overflow:hidden;
}
/* the live values: black on a short strip of office green, the hover band at the counter's size */
.live{ display:inline-block; padding:0 3px; background:var(--green); color:var(--ink); font-weight:500; line-height:15px; }

/* ---------- the filter line: views, shelves, availability ---------- */
.filters{
  position:sticky; top:var(--desk-h); z-index:19;
  height:var(--filt-h);
  background:var(--paper);
  display:grid; grid-template-columns:var(--lead) minmax(0,1fr);
  column-gap:var(--g); align-items:center;
  padding-left:var(--g);
}
.fcount{ white-space:nowrap; overflow:hidden; }
.fclear{
  appearance:none; background:none; border:0; padding:6px 0; margin:-6px 12px -6px 0;
  cursor:pointer; text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:.2em;
  text-decoration-color:var(--green); font-weight:500;
}
.lane{
  display:flex; align-items:center; gap:clamp(20px, 2.4vw, 34px); min-width:0;
  overflow-x:auto; scrollbar-width:none; white-space:nowrap;
  padding:0 var(--g) 0 3px; margin-left:-3px;
}
.lane::-webkit-scrollbar{ display:none; }
.grp{ display:flex; flex:none; gap:clamp(10px, 1.1vw, 16px); }
.opt, .views a{
  appearance:none; background:none; border:0; margin:0; padding:10px 0;
  font:inherit; color:inherit; text-decoration:none; cursor:pointer; white-space:nowrap; user-select:none;
}
.opt > *, .views a > *{ pointer-events:none; }
.lane .lbl{ text-decoration:underline; text-decoration-color:transparent; text-decoration-thickness:2px; text-underline-offset:4px; }
.opt:hover .lbl, .views a:hover .lbl{ text-decoration-color:var(--ink); text-decoration-thickness:1px; }
/* the one marker for what is chosen: an office-green underline */
.opt[aria-pressed="true"] .lbl, .views a[aria-current="page"] .lbl{ text-decoration-color:var(--green); text-decoration-thickness:2px; }
.opt.is-nil{ color:var(--spent); }

/* ---------- the register ---------- */
main{ overflow-x:clip; isolation:isolate; }   /* own stacking context: the hover band sits under every line of type, never over a neighbour */
.register{ list-style:none; margin:0; padding:14px 0 0; }
.entry{
  display:grid; grid-template-rows:1fr; grid-template-columns:minmax(0,1fr);
  transition:grid-template-rows 120ms linear;
  scroll-margin-top:calc(var(--desk-h) + var(--filt-h) + 6px);
}
.entry-in{ min-height:0; min-width:0; }
.entry.is-out{ grid-template-rows:0fr; }
.entry.is-out > .entry-in, .entry.is-in > .entry-in{ overflow:clip; }
.entry.is-out > .entry-in{ visibility:hidden; transition:visibility 0s linear 120ms; }

/* one entry = one strip across the full width: the sentence, then the object, then its intake record.
   The strip is clipped at the screen edges, so a row read to its end runs off the left edge as it
   ran off the right. */
.row{ position:relative; cursor:pointer; }
/* the hover band: from the line top to just under the descenders. It is painted beneath all type,
   so the neighbouring lines' descenders and cap tops cross it in black instead of being cut off. */
.row::before{
  content:""; position:absolute; left:0; right:0; top:0;
  bottom:calc(var(--fs) * -.21);
  background:var(--green); opacity:0; pointer-events:none; z-index:-1;
}
.row.is-hot::before, .row:has(.sent:focus-visible)::before{ opacity:1; }
.row.is-hot .sent, .row:has(.sent:focus-visible) .sent{ color:var(--paper); }
.row.is-hot .xref, .row:has(.sent:focus-visible) .xref{ text-decoration-color:var(--paper); }

.strip{ display:flex; align-items:flex-start; min-width:0; }
.clip{ flex:1 1 0%; min-width:0; overflow-x:clip; overflow-y:visible; }   /* clip sideways only: descenders hang into the next line */
.track{
  display:flex; align-items:flex-start;
  width:max-content; height:var(--row);
  padding-left:var(--g);
}
.line{
  position:relative; z-index:2;   /* type over the photograph: a descender from the row above may cross its top edge, as it crosses a cap line */
  flex:none; margin:0;
  font:500 var(--fs)/var(--lh) "Switzer","Inter Tight",system-ui,sans-serif;
  letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.sent{
  appearance:none; background:none; border:0; padding:0; margin:0;
  display:block;
  font:inherit; line-height:inherit; letter-spacing:inherit; color:inherit;
  text-align:left; cursor:pointer; white-space:inherit;
}
.sent:focus-visible{ outline:none; }
/* hit-test the button's line box, not the glyph box: at .83 leading the glyph box of the next row
   reaches 20px up into this one, so the lower part of these letters would light the row below */
.sent .txt{ pointer-events:none; }
.is-spent .txt{ color:var(--spent); }
.row.is-hot .txt, .row:has(.sent:focus-visible) .txt{ color:inherit; }
.end{
  display:block; flex:none;
  width:var(--row); height:var(--row);
  margin-left:calc(var(--fs) * .3); object-fit:cover;
}
/* the intake record, beside its object: one fixed width, bottom line on the sentence baseline */
.rec{
  flex:none; align-self:flex-end;
  width:var(--recw);
  margin:0 0 var(--rec-mb) var(--rec-gap);
  text-align:left;
}
.rl{ display:flex; flex-wrap:wrap; column-gap:12px; }
.rl-find{ font-weight:500; }
.rail-m, .thumb, .anchor{ display:none; }
.xref{ text-decoration:underline; text-decoration-color:var(--green); text-decoration-thickness:1px; text-underline-offset:2px; }

/* ---------- the find of the week, set into the wall ----------
   Its photograph stays in place three rows tall at the right; its own sentence is read along until it
   stops against it, and the two rows beneath are cut a gutter short of it. */
@media (min-width:761px){
  .entry.is-anchor .anchor{
    display:flex; align-items:stretch; gap:var(--rec-gap);
    position:absolute; z-index:1; top:var(--a-top); right:var(--g);
  }
  .anchor img{ display:block; flex:none; width:var(--a-size); height:var(--a-size); object-fit:cover; background:#ECECEA; }
  /* the label: heading on the photograph's top edge, the note's last line on its bottom edge */
  .arec{
    flex:none; width:var(--recw);
    display:flex; flex-direction:column; justify-content:space-between;
    margin:-4px 0 -3px;
  }
  .arec-note{ display:block; text-wrap:pretty; }
  .entry.is-anchor .clip{ margin-right:var(--zone); }
  .entry.is-anchor .track > .end, .entry.is-anchor .track > .rec{ display:none; }
  .entry.is-anchor .row::before{ right:var(--zone); }
  .entry.is-under .row{ margin-right:var(--zone); }
}

/* entrance: the register is set line by line, the records a beat later */
@keyframes set{ from{ visibility:hidden; } to{ visibility:visible; } }
.js .row{ animation:set 1ms steps(1,end) both; animation-delay:calc(var(--i) * 40ms); }
.js .rec, .js .rail-m, .js .arec{ animation:set 1ms steps(1,end) both; animation-delay:calc(440ms + var(--i) * 40ms); }

/* one entry left by the filters: its sentence is shown whole, wrapped, with its object and record at the end */
.entry.is-lone:not(.is-open) .track{
  display:grid; grid-template-columns:minmax(0,1fr) auto auto; align-items:end;
  width:auto; height:auto; padding-right:var(--g);
  transform:none !important; transition:none !important;
}
.entry.is-lone:not(.is-open) .line{ white-space:normal; text-wrap:pretty; min-width:0; }
.entry.is-lone:not(.is-open) .end{ width:var(--a-size); height:var(--a-size); margin:0 0 calc(var(--fs) * .062) var(--g); }

/* expanded entry: the sentence wraps, its record stays at the right on the last baseline,
   and the object moves into the photographs below */
.entry.is-open .track, .empty .track{
  display:grid; grid-template-columns:minmax(0,1fr) auto; column-gap:var(--g);
  width:auto; height:auto; padding-right:var(--g);
  transform:none !important; transition:none !important;
}
.entry.is-open .line, .empty .line{ white-space:normal; text-wrap:pretty; min-width:0; }
.entry.is-open .end{ display:none; }
.entry.is-open .rec, .empty .rec{ grid-column:2; align-self:end; margin-left:0; }

.panel{
  display:grid; grid-template-rows:0fr;
  transition:grid-template-rows 160ms cubic-bezier(.4,0,1,1);
}
.entry.is-open .panel{ grid-template-rows:1fr; transition:grid-template-rows 300ms cubic-bezier(.16,1,.3,1); }
.panel-in{ min-height:0; overflow:hidden; }
/* photographs, then the story, then the rest of the record under the row's own record */
.pgrid{
  display:grid;
  grid-template-columns:minmax(0,22vw) minmax(0,22vw) minmax(0,60ch) minmax(0,1fr);
  column-gap:var(--g); align-items:start;
  padding:calc(var(--fs) * .3) var(--g) calc(var(--row) * .8);
}
.prec{ justify-self:end; width:var(--recw); line-height:15px; }
.prec .f{ white-space:normal; }
.ph{ margin:0; min-width:0; }
.ph img, .ph .crop{ display:block; width:100%; aspect-ratio:1; object-fit:cover; }
.ph .crop{ background-repeat:no-repeat; background-size:280%; }
.ph figcaption{ margin-top:6px; }
.ptext{ max-width:60ch; line-height:1.45; }
.ptext p{ text-wrap:pretty; }
.ptext p + p{ margin-top:.9em; }
.act{ margin-top:1.4em !important; line-height:15px; }
.actb, .ebtn{
  appearance:none; background:none; border:0; padding:6px 0; margin:-6px 0;
  cursor:pointer; font-weight:500;
  text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:.2em; text-decoration-color:var(--green);
}
.actb > *, .ebtn > *{ pointer-events:none; }
.actb:hover, .ebtn:hover{ text-decoration-color:var(--ink); }
.act .spent{ color:var(--spent); }

/* empty state */
.empty{ padding-top:0; }
.empty[hidden]{ display:none; }
.empty .row{ cursor:default; }

/* ---------- colophon, in the register's own format ---------- */
.colophon{ padding:calc(var(--row) * 1.6) 0 calc(var(--row) * 1.2); scroll-margin-top:calc(var(--desk-h) + var(--filt-h)); }
.crow + .crow{ margin-top:calc(var(--row) * .9); }
.chead{ display:flex; align-items:flex-start; height:var(--row); padding-left:var(--g); overflow-x:clip; overflow-y:visible; }
.ctitle{
  flex:none; margin:0;
  font:500 var(--fs)/var(--lh) "Switzer","Inter Tight",system-ui,sans-serif;
  letter-spacing:-.03em; white-space:nowrap;
}
.cbody{ max-width:calc(62ch + 2 * var(--g)); padding:calc(var(--fs) * .3) var(--g) 0; line-height:1.45; }
.cbody p{ text-wrap:pretty; }
.cbody p + p{ margin-top:.9em; }
.hours{ display:grid; grid-template-columns:12ch auto; column-gap:12px; line-height:15px; }
.hours .is-today{ font-weight:500; }
.stock{ line-height:15px; }

/* ---------- 761 to 1180 ---------- */
@media (max-width:1180px) and (min-width:761px){
  .desk-state{ column-gap:20px; }
  .pgrid{ grid-template-columns:minmax(0,24vw) minmax(0,24vw) minmax(0,1fr); grid-template-rows:auto 1fr; }
  .ph{ grid-row:1 / span 2; }
  .ptext{ grid-column:3; grid-row:1; }
  .prec{ grid-column:3; grid-row:2; justify-self:start; width:auto; margin-top:1.4em; }
}

/* ---------- phone ---------- */
@media (max-width:760px){
  .desk{ padding:8px var(--g); }
  /* the name and the live fields share two lines; the office's own state comes first after the name */
  .desk-in{
    display:flex; flex-wrap:wrap; align-content:flex-start;
    column-gap:16px; row-gap:6px;
    height:36px; overflow:hidden;
  }
  .desk-state{ display:contents; }
  .desk-name{ order:0; line-height:15px; }
  .f-office{ order:1; } .f-recv{ order:2; } .f-claim{ order:3; } .f-sale{ order:4; }
  .filters{ grid-template-columns:auto minmax(0,1fr); column-gap:0; }
  .fcount .fc-text{ display:none; }
  .lane{ gap:22px; }
  .grp{ gap:12px; }
  .register{ padding-top:4px; }
  /* the record moves above its sentence as one line of whole fields; rows still run off the right edge */
  .row{ padding:7px 0 0 var(--g); }
  .rail-m{
    display:flex; flex-wrap:wrap; column-gap:10px;
    height:15px; overflow:hidden;
    margin:0 var(--g) 3px 0;
  }
  .entry.is-open .rail-m{ height:auto; }
  .thumb{
    display:block; flex:none;
    width:var(--row); height:var(--row);
    margin-right:8px; object-fit:cover;
  }
  .track{ padding-left:0; }
  .end, .rec{ display:none; }
  /* the find of the week keeps its object at the END of its sentence, as on the desktop */
  .is-find .thumb{ display:none; }
  .is-find .end{ display:block; }
  .entry.is-open .end{ display:none; }
  .entry.is-lone:not(.is-open) .track{ display:block; width:auto; height:auto; padding-right:var(--g); }
  .entry.is-lone .row.is-find .thumb{ display:block; }
  .entry.is-lone .row.is-find .end{ display:none; }
  .entry.is-open .track, .empty .track{ grid-template-columns:minmax(0,1fr); }
  .pgrid{ grid-template-columns:1fr 1fr; gap:12px; padding:16px var(--g) calc(var(--row) * 1.1); }
  .ptext, .prec{ grid-column:1 / -1; }
  .prec{ justify-self:start; width:auto; margin-top:14px; }
  .crow{ padding:0 var(--g); }
  .crow .rail-m{ margin:0 0 3px; }
  .chead{ display:block; height:auto; padding:0; }
  .ctitle{ white-space:normal; text-wrap:balance; }   /* no hover to read a colophon title to its end on a phone */
  .cbody{ padding:12px 0 0; }
}

/* ---------- reduced motion: no stagger, no slide; focus wraps the sentence instead ---------- */
@media (prefers-reduced-motion:reduce){
  .js .row, .js .rec, .js .rail-m, .js .arec{ animation:none; }
  .track{ transition:none !important; }
  .panel, .entry.is-open .panel, .entry{ transition:none; }
  .entry:not(.is-open) .row:has(.sent:focus-visible) .track{
    display:grid; grid-template-columns:minmax(0,1fr) auto auto; column-gap:0;
    width:auto; height:auto; padding-right:var(--g);
    transform:none !important;
  }
  .entry:not(.is-open) .row:has(.sent:focus-visible) .line{ white-space:normal; text-wrap:pretty; min-width:0; }
  .entry:not(.is-open) .row:has(.sent:focus-visible) .end{ align-self:end; }
  .entry:not(.is-open) .row:has(.sent:focus-visible) .rec{ align-self:end; }
}
</style>
</head>
<body>
<a class="skip" href="#register">Skip to the register</a>

<header class="desk">
  <div class="desk-in">
    <h1 class="desk-name">Office of Found Objects</h1>
    <p class="desk-state" id="deskState">
      <span class="f f-recv">Received today <span class="live">3</span></span>
      <span class="f f-claim">Claimed this week <span class="live">11</span></span>
      <span class="f f-sale">Next sale <span class="live">Saturday 10:00</span></span>
      <span class="f f-office">Office <span class="live">Open Wednesday to Saturday</span></span>
    </p>
  </div>
</header>

<div class="filters" role="region" aria-label="Views and filters">
  <p class="fcount" id="fcount"><span class="fc-text"></span></p>
  <div class="lane" id="lane"></div>
</div>

<main id="register" tabindex="-1">
  <ol class="register" id="list" aria-label="Intake register"></ol>
  <div class="empty" id="empty" hidden>
    <div class="row">
      <p class="rail-m"><span class="f"><button class="ebtn" type="button" data-clear>Clear all filters</button></span></p>
      <div class="strip"><div class="clip"><div class="track">
        <p class="line"><span class="sent" style="cursor:default">Nothing in the register matches all of these at once</span></p>
        <div class="rec"><p class="rl"><span class="f"><button class="ebtn" type="button" data-clear>Clear all filters</button></span></p></div>
      </div></div></div>
    </div>
  </div>
  <section class="colophon" id="about" aria-label="Colophon"></section>
  <noscript><p style="padding:24px">The register lists its entries with JavaScript. Write to desk@officeoffoundobjects.nl for a printed copy.</p></noscript>
</main>

<script>
/* =====================================================================
   DATA: everything on the page comes from here. Swap freely.
   kinds: object | text | exhibition | talk | edition
   obj:   photograph id (file obj-<id>.webp); for non-objects, the object it belongs with
   find:  true on the one object shown as the find of the week (its second story paragraph is its label note)
   dates: YYYY-MM-DD, talks: YYYY-MM-DDTHH:MM (visitor's clock decides Upcoming or Past)
   ===================================================================== */
const DATA = {
  office: {
    name: 'Office of Found Objects',
    address: 'Mathenesserdijk 214, 3026 GE Rotterdam',
    email: 'desk@officeoffoundobjects.nl',
    kvk: '88412206'
  },
  desk: {
    receivedToday: 3,
    claimedThisWeek: 11,
    timeZone: 'Europe/Amsterdam',
    hours: { 3: ['11:00', '17:00'], 4: ['11:00', '17:00'], 5: ['11:00', '17:00'], 6: ['10:00', '17:00'] }, /* 0 = Sunday */
    sale: { day: 6, time: '10:00' }
  },
  views: [
    { id: 'register', label: 'Register' },
    { id: 'exhibitions', label: 'Exhibitions', kinds: ['exhibition', 'talk'] },
    { id: 'texts', label: 'Texts', kinds: ['text'] },
    { id: 'shop', label: 'Shop', kinds: ['object', 'edition'] },
    { id: 'about', label: 'About', anchor: 'about' }
  ],
  categories: ['Furniture', 'Tools', 'Paper', 'Glass', 'Textile', 'Sound', 'Kitchen'],
  statuses: ['Available', 'Sold', 'On loan'],
  imgBase: '../assets/wc/overflow-ledger-index/obj-',
  entries: [
    { no: '0454', kind: 'exhibition', date: '2026-10-02', obj: '11', cat: 'Kitchen',
      text: 'One drawer each: eleven households in Hillesluis empty a kitchen drawer onto our long table, and we register every thing that falls out',

  const priceOf = e => e.status === 'Sold' ? 'Sold' : e.status === 'On loan' ? 'On loan' : `EUR ${e.price}`;
  const wordsOf = e => `${Number(e.words).toLocaleString('en-GB')} words`;
  const refNo = e => { const o = OBJ[e.obj]; return o && o.no !== e.no ? o.no : null; };
  /* a link inside a row's record sits off-screen until the entry opens, so it joins the tab order only then */
  const xref = (no, inRow) => `<a class="xref" href="#open=${no}" data-open="${no}"${inRow ? ' tabindex="-1" data-rowlink' : ''}>${no}</a>`;
  const facet = {
    cat: e => { const c = catOf(e); return c ? [slug(c)] : []; },
    status: e => (e.kind === 'object' || e.kind === 'edition') && e.status ? [slug(e.status)] : []
  };

  /* ---------- the intake counter ---------- */
  function deskNow() {
    try {
      const f = new Intl.DateTimeFormat('en-GB', { timeZone: DATA.desk.timeZone, weekday: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
      const p = Object.fromEntries(f.formatToParts(new Date()).map(x => [x.type, x.value]));
      return { wd: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday), mins: (+p.hour % 24) * 60 + (+p.minute) };
    } catch (_) { const d = new Date(); return { wd: d.getDay(), mins: d.getHours() * 60 + d.getMinutes() }; }
  }
  function officeLine() {
    const { wd, mins } = deskNow(); const H = DATA.desk.hours; const t = H[wd];
    if (t && mins >= toMin(t[0]) && mins < toMin(t[1])) return `Open until ${t[1]}`;
    if (t && mins < toMin(t[0])) return `Opens today at ${t[0]}`;
    for (let k = 1; k <= 7; k++) { const d = (wd + k) % 7; if (H[d]) return `Closed until ${k === 1 ? 'tomorrow' : DAYS[d]} ${H[d][0]}`; }
    return 'Closed';
  }
  function saleLine() {
    const { wd, mins } = deskNow(); const s = DATA.desk.sale; const close = (DATA.desk.hours[s.day] || [s.time, '17:00'])[1];
    if (wd === s.day && mins < toMin(s.time)) return `Today ${s.time}`;
    if (wd === s.day && mins < toMin(close)) return `On now until ${close}`;
    return `${DAYS[s.day]} ${s.time}`;
  }
  function renderDesk() {
    const live = (cls, k, v, id) => `<span class="f ${cls}"${id ? ` id="${id}"` : ''}>${k} <span class="live">${v}</span></span>`;
    $('#deskState').innerHTML =
      live('f-recv', 'Received today', DATA.desk.receivedToday) +
      live('f-claim', 'Claimed this week', DATA.desk.claimedThisWeek) +
      live('f-sale', 'Next sale', saleLine()) +
      live('f-office', 'Office', officeLine(), 'deskOffice');
  }

  /* ---------- register rows ---------- */
  /* the row's own record: what the intake card says first. The expanded entry adds only what is not here. */
  function recFields(e) {
    const r = refNo(e);
    const price = e.kind === 'edition' ? (e.status === 'Sold' ? 'Sold out' : `EUR ${e.price}`) : priceOf(e);
    switch (e.kind) {
      case 'object': return [[['No.', e.no], ['Received', fmtDate(e.date)]], [['From', esc(e.from)], ['Price', price]]];
      case 'text': return [[['No.', e.no], ['Length', wordsOf(e)]], [['By', esc(e.by)], ...(r ? [['Object', xref(r, true)]] : [])]];
      case 'exhibition': return [[['No.', e.no], ['Status', statusOf(e)]], [['Dates', fmtRange(e.opens, e.closes)]]];
      case 'talk': return [[['No.', e.no], ['On', fmtWhen(e.when)]], [['With', esc(e.with)], ['Status', statusOf(e)]]];
      case 'edition': return [[['No.', e.no], ['Printed', e.printed]], [['Run', e.run], ['Price', price]]];
    }
    return [];
  }
  const recLine = f => `<p class="rl">${f.map(([k, v]) => fld(k, v)).join('')}</p>`;
  /* desktop: a small card after the object, two lines (three for the find of the week) */
  function recLines(e) {
    const L = recFields(e).map(recLine);
    if (e.find) L.unshift('<p class="rl rl-find">Find of the week</p>');
    return L.join('');
  }
  /* phone: the same fields as one line above the sentence, most telling first; whole fields only */
  const PHONE_ORDER = { object: ['No.', 'Price', 'From', 'Received'], text: ['No.', 'By', 'Length', 'Object'], exhibition: ['No.', 'Status', 'Dates'], talk: ['No.', 'Status', 'On', 'With'], edition: ['No.', 'Price', 'Run', 'Printed'] };
  function railFlat(e) {
    const all = recFields(e).flat();
    const out = (PHONE_ORDER[e.kind] || []).map(k => all.find(f => f[0] === k)).filter(Boolean).map(([k, v]) => fld(k, v));
    if (e.find) out.unshift('<span class="f rl-find">Find of the week</span>');
    return out.join('');
  }
  /* the find of the week as it is set into the wall: the photograph, and its label beside it */
  function anchorHTML(e, src, alt) {
    const note = (e.story && e.story[1]) || '';
    return `<div class="anchor"><img src="${src}" alt="${alt}" width="480" height="480" decoding="async" fetchpriority="high"><div class="arec"><div><p class="rl rl-find">Find of the week</p>${recFields(e).map(recLine).join('')}${e.foundBy ? recLine([['Found by', esc(e.foundBy)]]) : ''}</div>${note ? `<p class="arec-note">${esc(note)}</p>` : ''}</div></div>`;
  }
  function rowHTML(e, i) {
    const own = e.kind === 'object';
    const alt = own ? esc(e.alt) : '';

<div class="entry-in">
<div class="row${e.find ? ' is-find' : ''}${spent ? ' is-spent' : ''}">
<p class="rail-m">${railFlat(e)}</p>
<div class="strip">${own ? `<img class="thumb" src="${src}" alt="${alt}" width="96" height="96" decoding="async">` : ''}<div class="clip"><div class="track">
<h2 class="line"><button class="sent" type="button" id="b-${e.no}" aria-expanded="false" aria-controls="p-${e.no}"><span class="txt">${esc(e.text)}</span></button></h2>
<img class="end" src="${src}" alt="${alt}" width="160" height="160" decoding="async">
<div class="rec">${recLines(e)}</div>
</div></div></div>
${e.find && own ? anchorHTML(e, src, alt) : ''}
</div>
<div class="panel" id="p-${e.no}" role="region" aria-labelledby="b-${e.no}"><div class="panel-in"></div></div>
</div>
</li>`;
  }

  /* ---------- expanded entry ---------- */
  const reserved = new Set();
  /* the rest of the intake record: only fields the row's own record does not already show

  function recordLines(e) {
    const R = [];

        if (e.status === 'Sold') R.push(['Sold for', `EUR ${e.price}`]);

        : `<button class="actb" type="button" data-act="${e.no}">Reserve for EUR ${e.price}</button>`;

    const o = OBJ[e.obj] || e;

      : `<figure class="ph"><img src="${src}" alt="${esc(o.alt || '')}" loading="lazy" decoding="async"><figcaption>${o.no && o.no !== e.no ? `Object ${xref(o.no)}` : 'From the register'}</figcaption></figure>
         <figure class="ph"><div class="crop" role="img" aria-label="Detail: ${esc(o.detail || '')}" style="background-image:url('${src}');background-position:${cropPos(o.focus || [50, 50])}"></div><figcaption>Detail: ${esc(o.detail || '')}</figcaption></figure>`;

  }

  /* ---------- colophon ---------- */
  function renderColophon() {
    const { wd } = deskNow();
    const H = DATA.desk.hours;
    const order = [1, 2, 3, 4, 5, 6, 0];
    const hours = order.map(d => {
      const t = H[d];
      const v = t ? `${t[0]} to ${t[1]}${d === DATA.desk.sale.day ? ', sale from ' + DATA.desk.sale.time : ''}` : 'Closed';
      return `<span class="${d === wd ? 'is-today' : ''}">${DAYS[d]}</span><span class="${d === wd ? 'is-today' : ''}">${v}${d === wd ? ', today' : ''}</span>`;
    }).join('');
    const C = DATA.colophon;
    /* each colophon entry is written like a register row: the title, then its record on the baseline */
    const crow = (k, v, title, body) => `<div class="crow"><p class="rail-m">${fld(k, v)}</p><div class="chead"><h2 class="ctitle">${title}</h2><div class="rec"><p class="rl">${fld(k, v)}</p></div></div><div class="cbody">${body}</div></div>`;
    $('#about').innerHTML =
      crow('Desk', esc(DATA.office.address.split(',')[0]), 'How to bring us an object', C.bring.map(s => `<p>${esc(s)}</p>`).join('')) +
      crow('Today', officeLine(), 'Opening hours', `<div class="hours">${hours}</div>`) +
      crow('Editions', ENTRIES.filter(e => e.kind === 'edition').length, 'Stockists', `<div class="stock">${C.stockists.map(([n, w]) => `<p>${esc(n)}: ${esc(w)}</p>`).join('')}</div>`) +
      crow('KvK', DATA.office.kvk, 'Imprint', `<p>${esc(DATA.office.name)}, ${esc(DATA.office.address)}. Write to <a href="mailto:${DATA.office.email}">${DATA.office.email}</a>.</p>${C.imprint.map(s => `<p>${esc(s)}</p>`).join('')}`);
  }

  /* ---------- the filter line: views, then shelves, then availability ---------- */
  const GROUPS = [
    { key: 'cat', label: 'Shelf', opts: DATA.categories.map(c => ({ id: slug(c), label: c })) },
    { key: 'status', label: 'Availability', opts: DATA.statuses.map(s => ({ id: slug(s), label: s })) }
  ];
  const state = { view: 'register', cat: new Set(), status: new Set(), open: null };
  function renderLane() {
    const views = `<nav class="grp views" aria-label="Views">${DATA.views.map(v =>
      `<a href="#${v.anchor || 'view=' + v.id}" data-view="${v.id}"><span class="lbl">${v.label}</span>${v.anchor ? '' : ' <span class="n"></span>'}</a>`).join('')}</nav>`;
    const groups = GROUPS.map(g => `<div class="grp" role="group" aria-label="${g.label}">${g.opts.map(o =>
      `<button class="opt" type="button" data-g="${g.key}" data-o="${o.id}" aria-pressed="false"><span class="lbl">${o.label}</span> <span class="n"></span></button>`).join('')}</div>`).join('');
    $('#lane').innerHTML = views + groups;
  }
  const viewOK = (e, v) => { const V = DATA.views.find(x => x.id === v); return !V || !V.kinds || V.kinds.includes(e.kind); };
  const groupOK = (e, key, set) => set.size === 0 || facet[key](e).some(x => set.has(x));
  const visible = e => viewOK(e, state.view) && GROUPS.every(g => groupOK(e, g.key, state[g.key]));
  const filtered = () => state.view !== 'register' || GROUPS.some(g => state[g.key].size);

  /* ---------- hash state ---------- */
  function readHash() {
    const h = location.hash.replace(/^#/, '');
    const p = {};
    h.split('&').forEach(kv => { const [k, v] = kv.split('='); if (k) p[decodeURIComponent(k)] = decodeURIComponent(v || ''); });
    state.view = DATA.views.some(v => v.id === p.view && !v.anchor) ? p.view : 'register';
    GROUPS.forEach(g => { const ok = new Set(g.opts.map(o => o.id)); state[g.key] = new Set((p[g.key] || '').split(',').filter(x => ok.has(x))); });
    state.open = p.open && ROWS[p.open] ? p.open : null;

  }
  function writeHash() {
    const parts = [];
    if (state.view !== 'register') parts.push('view=' + state.view);
    GROUPS.forEach(g => { if (state[g.key].size) parts.push(g.key + '=' + [...state[g.key]].join(',')); });
    if (state.open) parts.push('open=' + state.open);
    const url = location.pathname + location.search + (parts.length ? '#' + parts.join('&') : '');
    try { history.replaceState(null, '', url); } catch (_) {}
  }

  /* ---------- build ---------- */
  renderDesk();
  renderLane();
  const list = $('#list');
  list.innerHTML = ENTRIES.map(rowHTML).join('');
  const ROWS = {};
  const ORDER = [];
  list.querySelectorAll('.entry').forEach(li => {
    const no = li.dataset.no;
    const r = { no, li, e: ENTRIES.find(x => x.no === no), row: $('.row', li), btn: $('.sent', li), txt: $('.txt', li), clip: $('.clip', li), track: $('.track', li), rec: $('.rec', li), panel: $('.panel-in', li) };
    r.panel.parentElement.inert = true;
    ROWS[no] = r; ORDER.push(r);
  });
  renderColophon();
  const FIND = ORDER.find(r => r.e.find && r.e.kind === 'object') || null;

  /* ---------- the find of the week in the wall ---------- */
  /* on a desktop, the find's photograph is set into the wall when two rows follow it on screen and
     none of the three is open; those two rows are then cut a gutter short of it */
  function layoutAnchor() {
    if (!FIND) return;
    const vis = ORDER.filter(r => !r.li.classList.contains('is-out'));
    const i = vis.indexOf(FIND);
    const under = i >= 0 ? vis.slice(i + 1, i + 3) : [];
    const on = !PHONE.matches && i >= 0 && under.length === 2 && state.open !== FIND.no && !under.some(r => r.no === state.open);
    ORDER.forEach(r => r.li.classList.remove('is-under'));

  }
  const isAnchor = r => r.li.classList.contains('is-anchor');
  const isLone = r => r.li.classList.contains('is-lone');

  /* ---------- measuring the overflow ---------- */
  const cssNum = (k, d) => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(k)) || d;
  const gutter = () => cssNum('--g', 24);
  /* the offset that brings the end of the strip (sentence, object, record) to the right gutter */
  function endX(r) { return Math.min(0, Math.round(r.clip.clientWidth - gutter() - r.track.offsetWidth)); }
  /* the find of the week sits at its end. Set into the wall, its sentence stops exactly at the moat
     before its photograph. On a phone, where the strip is clipped at the gutter, the visible part
     also starts on a whole word: the first word start that still lets the end fit. */
  function findX(r) {
    if (isLone(r)) return 0;
    if (isAnchor(r)) return Math.min(0, Math.floor(r.clip.clientWidth - r.track.offsetWidth));
    const x = endX(r);
    if (!PHONE.matches || x === 0) return x;
    const node = r.txt.firstChild; const t = node.textContent;
    const base = r.track.getBoundingClientRect().left;
    const range = document.createRange();
    for (let i = 1; i < t.length; i++) {
      if (t[i - 1] !== ' ' || t[i] === ' ') continue;
      range.setStart(node, i); range.setEnd(node, i + 1);
      const p = range.getBoundingClientRect().left - base;
      if (p >= -x - 0.5) return -Math.round(p);

    const t1 = (D - land) / v, t2 = 3 * land / v;

    for (let k = 1; k <= 10; k++) {
      const u = k / 10;
      pts.push(`${((D - land + land * (1 - Math.pow(1 - u, 3))) / D).toFixed(4)} ${((t1 + u * t2) / T * 100).toFixed(2)}%`);
    }

  }
  /* entrance: the find's sentence is read along to its photograph, landing inside the 1.5s entrance */
  function placeFind(animate) {
    if (!FIND || state.open === FIND.no) return;
    const x = findX(FIND);
    if (!animate || RM.matches || x === 0) { setX(FIND, x, 0); return; }
    setX(FIND, 0, 0);
    void FIND.track.offsetWidth;
    const wait = Math.max(0, 300 - (performance.now() - T0));
    setTimeout(() => {
      const left = 1450 - (performance.now() - T0);

    }, wait);
  }
  const homeX = r => (r === FIND ? findX(r) : 0);
  const reFind = () => { if (FIND && state.open !== FIND.no) setX(FIND, findX(FIND), 0); };

  /* ---------- hover: the band, and the sentence read to its end ---------- */
  ORDER.forEach(r => {
    r.row.addEventListener('pointerenter', ev => {
      if (ev.pointerType !== 'mouse' || !HOVER.matches) return;
      r.row.classList.add('is-hot');
      if (RM.matches || state.open === r.no || isLone(r)) return;
      slideTo(r, r === FIND ? findX(r) : endX(r));
    });
    r.row.addEventListener('pointerleave', ev => {
      if (ev.pointerType !== 'mouse') return;
      r.row.classList.remove('is-hot');
      if (RM.matches || state.open === r.no) return;
      const x = homeX(r);
      if (Math.abs((r.x || 0) - x) < 1) return;
      setX(r, x, 320, 'cubic-bezier(.16,1,.3,1)');
    });
  });

  /* ---------- open / close ---------- */
  function openEntry(no, { scroll = false, focus = false } = {}) {
    const r = ROWS[no]; if (!r) return;
    if (state.open && state.open !== no) closeEntry(state.open, { quiet: true });
    if (r.li.classList.contains('is-out')) { resetFilters(); }
    if (!r.panel.firstChild) r.panel.innerHTML = panelHTML(r.e);
    r.li.classList.add('is-open');
    r.panel.parentElement.inert = false;
    r.btn.setAttribute('aria-expanded', 'true');
    r.li.querySelectorAll('[data-rowlink]').forEach(a => a.removeAttribute('tabindex'));
    r.x = 0;
    state.open = no;

    if (focus) r.btn.focus({ preventScroll: true });
  }
  function closeEntry(no, { quiet = false, focus = false } = {}) {
    const r = ROWS[no]; if (!r) return;
    r.li.classList.remove('is-open');

  }

  list.addEventListener('click', ev => {
    const a = ev.target.closest('a[data-open]');
    if (a) { ev.preventDefault(); ev.stopPropagation(); openEntry(a.dataset.open, { scroll: true, focus: true }); return; }
    const act = ev.target.closest('[data-act]');
    if (act) {
      const no = act.dataset.act; const r = ROWS[no];
      reserved.has(no) ? reserved.delete(no) : reserved.add(no);
      const holder = act.closest('.act');
      if (holder) { holder.innerHTML = actionHTML(r.e); const b = holder.querySelector('.actb'); if (b) b.focus(); }
      return;
    }
    if (ev.target.closest('.panel')) return;
    const row = ev.target.closest('.row');
    const li = row && row.closest('.entry');
    if (!li) return;
    const no = li.dataset.no;
    state.open === no ? closeEntry(no) : openEntry(no);
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape' && state.open) { ev.preventDefault(); closeEntry(state.open, { focus: true }); }
  });

  /* ---------- filtering ---------- */
  const lane = $('#lane');
  const fcount = $('#fcount');
  const empty = $('#empty');
  const countWith = (e, g, o) => viewOK(e, state.view) && GROUPS.every(G => G.key === g ? facet[g](e).includes(o) : groupOK(e, G.key, state[G.key]));
  function apply({ first = false } = {}) {
    let n = 0;
    ORDER.forEach(r => {
      const vis = visible(r.e);
      const was = !r.li.classList.contains('is-out');
      if (vis && !was && !first) { r.li.classList.add('is-in'); setTimeout(() => r.li.classList.remove('is-in'), 140); }
      r.li.classList.toggle('is-out', !vis);
      r.li.inert = !vis;
      if (vis) n++;
      if (!vis && state.open === r.no) closeEntry(r.no, { quiet: true });
    });
    lane.querySelectorAll('.opt').forEach(b => {
      const g = b.dataset.g, o = b.dataset.o;
      const c = ENTRIES.filter(e => countWith(e, g, o)).length;
      const on = state[g].has(o);
      b.querySelector('.n').textContent = c;
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.classList.toggle('is-nil', c === 0 && !on);
    });
    lane.querySelectorAll('.views a').forEach(a => {
      const v = a.dataset.view;
      const n = a.querySelector('.n');
      if (n) n.textContent = ENTRIES.filter(e => viewOK(e, v) && GROUPS.every(G => groupOK(e, G.key, state[G.key]))).length;
      if (v === state.view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    ORDER.forEach(r => r.li.classList.toggle('is-lone', n === 1 && !r.li.classList.contains('is-out')));
    empty.hidden = n !== 0;
    counts.n = n;
    renderCount();
    writeHash();
    layoutAnchor();
    if (FIND && !first) reFind();
    setTimeout(updateAt, first ? 0 : 140);
  }
  const counts = { n: ENTRIES.length, at: ENTRIES[0].no };
  function renderCount() {
    const total = ENTRIES.length;
    const at = `at No. <span class="v" id="atNo">${counts.at}</span>`;
    fcount.innerHTML = filtered()
      ? `<button class="fclear" type="button" data-clear>Clear</button><span class="fc-text">${counts.n} of ${total}${counts.n ? ', ' + at : ''}</span>`
      : `<span class="fc-text">Reading ${at}</span>`;
  }
  function resetFilters() {
    state.view = 'register'; GROUPS.forEach(g => state[g.key].clear());
    apply();
  }
  lane.addEventListener('click', ev => {
    const b = ev.target.closest('.opt');
    if (!b) return;
    const set = state[b.dataset.g];
    set.has(b.dataset.o) ? set.delete(b.dataset.o) : set.add(b.dataset.o);
    apply();
  });
  document.addEventListener('click', ev => {
    if (ev.target.closest('[data-clear]')) { ev.preventDefault(); resetFilters(); return; }
    const v = ev.target.closest('.views a');
    if (v) {
      ev.preventDefault();
      const V = DATA.views.find(x => x.id === v.dataset.view);
      if (V.anchor) { document.getElementById(V.anchor).scrollIntoView({ behavior: RM.matches ? 'auto' : 'smooth' }); return; }
      state.view = V.id; apply(); scrollTo({ top: 0, behavior: 'auto' });
    }
  });

  /* ---------- scroll: the filter line keeps the register number in view ---------- */
  let ticking = false;
  function updateAt() {
    ticking = false;
    const top = $('.filters').getBoundingClientRect().bottom + 4;
    let at = null;
    for (const r of ORDER) {
      if (r.li.classList.contains('is-out')) continue;
      if (r.li.getBoundingClientRect().bottom > top + 10) { at = r.no; break; }
    }
    if (!at) { const last = ORDER.filter(r => !r.li.classList.contains('is-out')).pop(); at = last ? last.no : counts.at; }
    if (at !== counts.at) { counts.at = at; const v = $('#atNo'); if (v) v.textContent = at; }
  }
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(updateAt); } }, { passive: true });

  /* ---------- start ---------- */
  const goAbout = readHash();
  apply({ first: true });
  if (state.open) openEntry(state.open, { scroll: true });
  if (goAbout) requestAnimationFrame(() => document.getElementById('about').scrollIntoView());

  let fontsDone = false;
  const afterFonts = () => {
    if (fontsDone) return; fontsDone = true;
    placeFind(performance.now() - T0 < 1050);   /* late fonts: place instantly, so the frame is settled by 2.4s */
  };
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(afterFonts);
    document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', () => { if (fontsDone) reFind(); });
    setTimeout(afterFonts, 2000);
  } else { afterFonts(); }

  let rz;
  addEventListener('resize', () => {
    clearTimeout(rz);
    rz = setTimeout(() => {
      ORDER.forEach(r => { r.row.classList.remove('is-hot'); if (r !== FIND && state.open !== r.no) setX(r, 0, 0); });
      layoutAnchor();
      reFind();
      updateAt();
    }, 120);
  });
  RM.addEventListener && RM.addEventListener('change', reFind);
  setInterval(() => { const o = $('#deskOffice .live'); if (o) o.textContent = officeLine(); }, 60000);
})();
</script>
</body>
</html>
