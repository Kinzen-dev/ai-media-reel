<!-- TEMPLATE: Sticky Megatype Dossier | ARCHETYPE: Sticky megatype navigation with a dashed dossier | REF: ballet-de-marseille.com, PIN-UP Magazine, Centre de la photographie Geneve, Fondazione Prada | WHEN TO USE: culture institutions (cinematheques, theatres, archives, museums) whose live programme is the content and whose navigation can be the whole composition | SWAP: edit the DATA object at top of the script -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kino Sirene: the municipal cinematheque in the old fire station</title>
<meta name="description" content="Kino Sirene screens every night in two rooms of a former fire station, keeps 4,200 film prints and runs a small restoration lab. The siren sounds at 20:28.">
<meta name="theme-color" content="#E3DCF6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;1,400&family=Inter+Tight:wght@500&display=swap" rel="stylesheet">
<script>
/* Entrance gate: only when motion is welcome. Without this script everything is simply visible. */
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('boot');
</script>
<style>
:root{
  --paper:#E3DCF6;            /* the one flat paper colour */
  --ink:#000;                 /* megatype, mono, dashed borders */
  --live:#FF2A00;             /* live status only: on now, next countdown, the siren */
  --ghost:#AAA5B8;            /* 25 percent black on the paper, premixed so collided glyphs do not double up */
  --swap:#fff;                /* text of an inverted link */
  --display:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --m:16px; --gut:16px; --pad:12px; --gap:18px;
  --mega:min(11.389vw, calc((100vh - 96px) / 4), 220px);   /* 164px at 1440 wide */
  --track:-.09em;
  --stop:cubic-bezier(.2,.9,.2,1);
  --lead:440ms; --step:90ms;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--paper);-webkit-text-size-adjust:100%;text-size-adjust:100%;scrollbar-color:#000 var(--paper);scrollbar-width:thin}
html.smooth{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 11px/1.5 var(--mono);font-variant-numeric:tabular-nums;font-kerning:normal;caret-color:#000}
::selection{background:#000;color:var(--paper)}
:focus-visible{outline:1px dashed #000;outline-offset:3px;border-radius:3px}
a{color:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2.5px;text-decoration-skip-ink:none}
i,em{font-style:italic}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.skip{position:fixed;left:var(--m);top:var(--m);z-index:30;padding:6px 8px;background:#000;color:var(--swap);text-decoration:none;transform:translateY(-300%)}
.skip:focus{transform:none}

/* ---------- the split ---------- */
.page{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:var(--gut);padding:0 var(--m);align-items:start}
.rail{position:sticky;top:0;height:100vh;height:100svh;min-width:0;overflow-x:clip}
.dossier{display:flex;flex-direction:column;gap:var(--gap);min-width:0;padding:54px 0 var(--m)}

/* ---------- the mark: one scribbled siren horn, a single nervous stroke that never closes ---------- */
.mark{position:absolute;left:0;top:8px;z-index:4;display:block;width:86px;height:55px}
.mark svg{display:block;width:100%;height:100%;overflow:visible;transform:rotate(-4deg);transform-origin:30% 60%}
.mark path{fill:none;stroke:#000;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
html.siren .mark path{stroke:var(--live)}

/* ---------- megatype: one setting, used by the navigation and by every heading ---------- */
.mega-nav,.mega,.q{font-family:var(--display);font-weight:500;font-size:var(--mega);letter-spacing:var(--track);line-height:.76;line-height:round(.76em,1px)}
.mega-nav{display:flex;flex-direction:column;align-items:flex-start;padding-top:67px;margin-left:-.04em}
.mega-nav a{position:relative;display:block;width:max-content;margin-top:var(--dy,0em);padding-right:.07em;color:#000;text-decoration:none;white-space:nowrap;transition:transform 180ms var(--stop),letter-spacing 160ms var(--stop)}
.mega-nav a::after{content:"";position:absolute;inset:-10px 0;display:none}
.mega-nav a:hover::after{display:block}
.mega-nav a:focus-visible{outline-offset:.05em;border-radius:6px}
.mega-nav.is-index a{color:var(--ghost)}
.mega-nav.is-index a.is-on{color:#000;letter-spacing:calc(var(--track) - .02em);z-index:2}
.mega-nav.is-index a:hover{color:#000;z-index:3}
@media (hover:hover){
  .mega-nav a:is(:hover,:focus-visible) ~ a{transform:translateY(10px)}
  .mega-nav a:has(~ a:is(:hover,:focus-visible)){transform:translateY(-10px)}
}
/* --tune opens or closes the line gap of one heading (DATA tune.h); the half margins keep line one hard against
   the box top and the last descender exactly as far from the mono below, so only the gap between lines moves */
.mega{margin:calc(var(--tune,0em) / -2) 0 calc(.22em - var(--tune,0em) / 2) -.04em;line-height:calc(.76em + var(--tune,0em));line-height:round(calc(.76em + var(--tune,0em)),1px);overflow:visible;text-wrap:balance;hyphens:none}
.k1{margin:0 -.06em 0 -.03em}   /* the figure one carries too much air to collide: kerned by hand */
.kt{letter-spacing:calc(var(--track) + var(--o,.05em))}   /* a capital before an i, opened by hand (OPEN in the script) so the dot clears its bar, arm or corner; spacing, not margin, so an underline runs on unbroken */

/* ---------- language: a code in a 34px circle ---------- */
.lang{position:absolute;top:var(--m);right:var(--m);z-index:5;display:grid;place-items:center;width:34px;height:34px;padding:0;border:1px solid #000;border-radius:50%;background:var(--paper);color:#000;font:400 11px/1 var(--mono);cursor:pointer}
.lang::before{content:"";position:absolute;inset:-6px}
.lang:hover{background:#000;color:var(--swap)}

/* ---------- the dossier box ---------- */
.box{position:relative;min-width:0;padding:calc(var(--pad) + 1px);border-radius:6px;scroll-margin-top:var(--m)}
.edge{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.edge rect{x:.5px;y:.5px;width:calc(100% - 1px);height:calc(100% - 1px);rx:6px;fill:none}
.edge .dash{stroke:#000;stroke-width:1;stroke-dasharray:3 3}
.edge .draw{stroke:#fff;stroke-width:3;stroke-dasharray:1.01 1;stroke-dashoffset:0}

.mono p{margin:0 0 1.5em;max-width:104ch;text-wrap:pretty}   /* the sheet is read to the dashed edge, as on the printed programme */
.mono>*:last-child{margin-bottom:0}
.mono a:hover,.strip a:hover{background:#000;color:var(--swap);text-decoration-color:transparent;box-shadow:-.35ch 0 #000,.35ch 0 #000;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.film{font-style:italic}
.links{margin:0 0 1.5em;padding:0;list-style:none}
.plain{margin:0 0 1.5em;padding:0;list-style:none;max-width:104ch}
.live{background:var(--live);color:#000;padding:0 .5ch;white-space:nowrap}

/* tonight */
.now-list{display:grid;row-gap:6px;margin:0 0 1.5em;padding:0;list-style:none}
.now-list li{display:grid;grid-template-columns:6ch 12ch minmax(0,1fr) auto;column-gap:1ch;align-items:start}
.now-list .day{display:block;padding-top:5px;border-top:1px dashed #000}
.now-list .tm{justify-self:start}
.now-list .meta{grid-column:3 / -1}
.now-list .rm-m{display:none}
.is-on .tm,.is-next .tm{background:var(--live);padding:0 .5ch;margin-left:-.5ch}

/* mono tables */
.tb{display:block;width:100%;margin:0 0 1.5em;border-collapse:collapse}
.tb thead,.tb tbody{display:block}
.tb tr{display:grid;column-gap:2ch;align-items:start}   /* two clear characters between columns, never a run-on header */
.tb th,.tb td{display:block;min-width:0;padding:0;font-weight:400;text-align:left}
.tb thead tr{margin-bottom:5px;padding-bottom:4px;border-bottom:1px dashed #000}
.tb .n{text-align:right}
.tb .sub{display:none}
.t-season tr{grid-template-columns:5ch minmax(0,1.3fr) minmax(0,1fr) 7ch 5ch}
.t-hold tr{grid-template-columns:17ch 6ch minmax(0,1fr)}
.t-agenda tr{grid-template-columns:10ch 6ch 12ch minmax(0,1fr) 5ch 8ch}
.t-agenda tbody tr.d1{margin-top:5px;padding-top:5px;border-top:1px dashed #000}
.t-agenda tbody tr:first-child{margin-top:0;padding-top:0;border-top:0}
.t-agenda .tm{justify-self:start}
.t-agenda .is-past td{text-decoration:line-through}
.t-agenda .is-past a{text-decoration:line-through}

/* search: the input is the heading */
.q{display:block;width:calc(100% + .04em);height:1.21em;margin:-.225em 0 0 -.04em;padding:0;border:0;border-radius:0;background:none;color:#000;line-height:normal;outline:none;appearance:none;-webkit-appearance:none}
.q::-webkit-search-cancel-button{display:none}
/* the hint under the empty field is set like every other heading (kerned T and all), which a native placeholder cannot be */
.qf{display:grid}
.qf>.q{grid-area:1 / 1}
.q.qph{overflow:hidden;white-space:nowrap;color:var(--ghost);pointer-events:none;user-select:none;-webkit-user-select:none}
.qf.has-q .qph{visibility:hidden}
.results{margin:0;padding:0;list-style:none}
.results li{max-width:104ch;margin:0 0 1.5em}

/* ---------- compact strip (phone only) ---------- */
.strip{display:none}

/* ---------- motion: layout and state ---------- */
@keyframes drop{0%{opacity:0;transform:translateY(-.62em)}1%{opacity:1}100%{opacity:1;transform:none}}
@keyframes lap{from{stroke-dashoffset:1.01}to{stroke-dashoffset:0}}
@keyframes settle{from{stroke-dashoffset:54}to{stroke-dashoffset:0}}
@keyframes march{from{stroke-dashoffset:6}to{stroke-dashoffset:0}}
@keyframes sound{0%,100%{transform:none}50%{transform:translateX(2px)}}
html.boot:not(.go) .mega-nav a{visibility:hidden}
html.boot:not(.go) .edge .draw{stroke-dashoffset:1.01}
html.go .mega-nav a{animation:drop 220ms var(--stop) backwards;animation-delay:calc(var(--i) * 50ms)}
html.go .edge .draw{animation:lap 720ms var(--stop) backwards;animation-delay:calc(var(--lead) + var(--b) * var(--step))}
html.go .edge .dash{animation:settle 900ms var(--stop) backwards;animation-delay:calc(var(--lead) + var(--b) * var(--step))}
html.go .box:is(:hover,:focus-within) .edge .dash,html.go .box.is-called .edge .dash{animation:march 420ms linear infinite}
html.done{--lead:0ms;--step:0ms}
html.siren.go .mark path{animation:sound 240ms linear infinite}

@media (prefers-reduced-motion: reduce){
  .mega-nav a{transition:none;transform:none !important}
  .mega-nav.is-index a,.mega-nav.is-index a.is-on{color:#000;letter-spacing:var(--track)}
  /* the active word's underline is one drawn bar (baseline + .03em, .05em thick): a text underline seams where a hand-kerned capital (.kt) begins */
  .mega-nav.is-index a.is-on::before{content:"";position:absolute;left:0;right:.07em;top:calc(100% + .012em);height:.05em;background:currentColor;pointer-events:none}
  .mega-nav a,.edge .draw,.edge .dash,.mark path{animation:none !important}
  .strip{transition:none !important}
}

/* ---------- 390: the words stack above the first box, then hand over to the strip ---------- */
@media (max-width:899px){
  :root{--mega:min(22.6vw,164px)}
  .page{display:block}
  .rail{position:static;height:auto}
  .mega-nav{padding-top:66px}
  .dossier{padding-top:calc(var(--mega) * .27)}
  .strip{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;justify-content:space-between;padding:0 calc(var(--m) - 6px);background:var(--paper);border-bottom:1px dashed #000;transform:translateY(-102%);visibility:hidden;transition:transform 160ms var(--stop),visibility 0s 160ms}
  .strip.is-shown{transform:none;visibility:visible;transition:transform 160ms var(--stop),visibility 0s}
  .strip a{padding:10px 6px;text-decoration:none}
  .strip a.is-on{background:#000;color:var(--swap)}
  .box{scroll-margin-top:48px}
  .now-list li{grid-template-columns:6ch minmax(0,1fr)}
  .now-list .rm{display:none}
  .now-list .rm-m{display:inline}
  .now-list .meta{grid-column:2;order:2}
  .now-list .st{grid-column:2;justify-self:start;order:3}
  .tb .sub{display:block}
  .tb .x{display:none}
  .t-season tr{grid-template-columns:5ch minmax(0,1fr)}
  .t-hold tr{grid-template-columns:15ch 6ch minmax(0,1fr)}
  .t-agenda tr{grid-template-columns:10ch 6ch minmax(0,1fr) auto;column-gap:1.5ch}
  .t-agenda .tk{align-self:end}
}
</style>
</head>

<script>
(() => {
'use strict';

/* =====================================================================
   DATA: everything the page says. Swap this object to re-skin the template.
   - films: the catalogue the season, the agenda and the search read from.
     s is the short title the first box sets at display size ("Sunrise at
     18:00"); without one it uses t. Keep commas out of it (see tune).
   - agenda: [day, time, room, film]. day 0 is the Monday of the visitor's
     current week, so the demo is always live. For a real programme replace
     the day number with an ISO date string ('2026-10-02').
   - copy: every sentence, per language. {curly} words are filled in live;
     [[id]] becomes the linked, italic title of films[id].
   - copy.*.tune: collision marks, per language, in em. On a stacked line an
     i-dot hangs just under the line above and reads as an accent there.
     tune.nav moves one navigation word, tune.h opens or closes a heading's
     line gap: +.09 sets the dot midway between the line above and its own
     stem (a heading that sets on one line is unaffected); a negative value
     fuses it into solid ink directly above. The first box names a different
     film every few hours, so its
     gap is measured live instead (DOT, fitNow). A capital whose bar, arm
     or corner meets an i-dot (Titles, Kino, Night) is opened by hand
     (OPEN, .kt) so the dot clears it. Keep commas out of display
     headings: stacked, a comma's tail drops between the letters below and
     reads as an apostrophe. Retune whenever the words change.
   Preview any moment with ?at=2026-10-02T20:28 in the address bar.
   ===================================================================== */
const DATA = {
  siren: '20:28',
  sheet: 19,
  mail: { box: 'kasse@kinosirene.example', archive: 'archiv@kinosirene.example', lab: 'labor@kinosirene.example', friends: 'freunde@kinosirene.example' },
  rooms: { hall: { en: 'Engine hall', de: 'Wagenhalle' }, watch: { en: 'Watch room', de: 'Wachstube' } },

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
/* a capital whose bar, arm or corner meets the dot of the i after it is opened by hand so the dot reads as a dot:
   em per capital, measured for Inter Tight 500 at -.09em so every dot clears by about .02em (the span ends the font's
   own pair kerning, which is why K, kerned open by the font, still needs its full value; retune with the font) */
const OPEN = { T: .05, K: .07, E: .025, F: .04, N: .015, M: .015, H: .015, I: .015, P: .035, R: .03, Z: .03, V: .07, W: .07, Y: .07 };
const megaText = s => esc(s).replace(/1/g, '<span class="k1">1</span>').replace(/[TKEFNMHIPRZVWY](?=[ij])/g, c => `<span class="kt" style="--o:${OPEN[c]}em">${c}</span>`);
const fill = (s, o) => s.replace(/\{(\w+)\}/g, (m, k) => (k in o ? o[k] : m));
const pad2 = n => String(n).padStart(2, '0');
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const root = document.documentElement;
const RM = matchMedia('(prefers-reduced-motion: reduce)');
const WIDE = matchMedia('(min-width: 900px)');
let lang = 'en';
const T = () => DATA.copy[lang];

/* the visitor's clock (or ?at=2026-10-02T20:28 to preview a moment) */
const skew = (() => {
  const at = new URLSearchParams(location.search).get('at');
  const t = at ? Date.parse(at) : NaN;
  return Number.isNaN(t) ? 0 : t - Date.now();
})();
const now = () => new Date(Date.now() + skew);
const dayStart = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const weekStart = d => { const x = dayStart(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const fmt = (d, opt) => new Intl.DateTimeFormat(T().locale, opt).format(d).replace(/\.$/, '');
const hm = d => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
const dShort = d => lang === 'de'
  ? `${fmt(d, { weekday: 'short' })} ${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.`
  : `${fmt(d, { weekday: 'short' })} ${d.getDate()} ${fmt(d, { month: 'short' }).slice(0, 3)}`;
const dLong = d => lang === 'de'
  ? `${fmt(d, { weekday: 'long' })}, ${d.getDate()}. ${fmt(d, { month: 'long' })}`
  : `${fmt(d, { weekday: 'long' })} ${d.getDate()} ${fmt(d, { month: 'long' })}`;

/* ---------- the programme, resolved against the clock ---------- */
function buildShows(n) {
  const w = weekStart(n);
  return DATA.agenda.map(([day, time, room, id]) => {
    const [h, m] = time.split(':').map(Number);
    const base = typeof day === 'string' ? new Date(day + 'T00:00') : new Date(w.getFullYear(), w.getMonth(), w.getDate() + day);
    const start = new Date(base.getFullYear(), base.getMonth(), base.getDate(), h, m);
    const f = DATA.films[id];
    const mins = f.m + (f.plus ? DATA.films[f.plus].m : 0);
    return { id, f, room, time, start, end: new Date(start.getTime() + mins * 60000) };
  }).sort((a, b) => a.start - b.start);
}
const stateOf = (s, n, next) => (s.end <= n ? 'past' : s.start <= n ? 'on' : s === next ? 'next' : 'later');

function span(ms) {
  const u = T().u;
  if (ms < 60000) return `${Math.max(1, Math.ceil(ms / 1000))} ${u.s}`;
  const total = Math.ceil(ms / 60000), h = Math.floor(total / 60), m = total % 60;
  return h ? `${h} ${u.h} ${pad2(m)} ${u.min}` : `${m} ${u.min}`;
}

/* ---------- fragments ---------- */
const filmLink = id => { const f = DATA.films[id]; return `<a class="film" href="#titles" data-q="${esc(f.t)}">${esc(f.t)}</a>`; };
const rich = s => s.replace(/\[\[(\w+)\]\]/g, (m, id) => filmLink(id));
const href = h => (h.startsWith('mailto:') ? `mailto:${DATA.mail[h.slice(7)]}` : h);
const links = arr => `<ul class="links">${arr.map(([h, label]) => `<li><a href="${esc(href(h))}">${esc(label)}</a></li>`).join('')}</ul>`;
const td = (c, cls) => `<td role="cell"${cls ? ` class="${cls}"` : ''}>${c}</td>`;
const table = (cls, heads, hcls, rows, liveId) =>
  `<table class="tb ${cls}" role="table"><thead role="rowgroup"><tr role="row">${heads.map((h, i) => `<th role="columnheader" scope="col"${hcls[i] ? ` class="${hcls[i]}"` : ''}>${esc(h)}</th>`).join('')}</tr></thead><tbody role="rowgroup"${liveId ? ` data-live="${liveId}"` : ''}>${rows}</tbody></table>`;

function metaOf(f) {
  const t = T(), [kind, y] = f.src.split(':'), unit = t.u.min;
  let out = `${f.g}, ${f.m} ${unit}${unit.endsWith('.') ? '' : '.'} ${fill(t.src[kind], { y })}`;
  if (f.plus) { const p = DATA.films[f.plus]; out += ' ' + fill(t.withShort, { title: `<i>${esc(p.t)}</i>`, y: p.y, g: p.g, m: p.m }); }
  return out;
}
const ticket = s => {
  const t = T(), room = DATA.rooms[s.room][lang];
  const subject = fill(t.agenda.subject, { title: s.f.t, date: dShort(s.start), time: s.time, room });
  return `<a href="mailto:${DATA.mail.box}?subject=${encodeURIComponent(subject)}">${esc(t.agenda.ticket)}</a>`;
};

/* ---------- elements ---------- */
const nav = $('#nav'), strip = $('#strip'), dossier = $('#dossier'), qEl = $('#q'), qf = $('#qf'), qph = $('#qph'), langBtn = $('#lang'), hNow = $('#h-now');
const words = $$('a', nav), stripWords = $$('a', strip), boxes = $$('.box', dossier);
const body = {}; $$('[data-body]').forEach(el => { body[el.dataset.body] = el; });
let shows = [], nextStart = null, cache = {}, timer = 0, snapQ = 0, smoothT = 0;

/* each box gets its dashed edge as an SVG rect, so the dashes can march */
boxes.forEach((b, i) => {
  b.style.setProperty('--b', i);
  b.insertAdjacentHTML('afterbegin',
    `<svg class="edge" aria-hidden="true" focusable="false"><mask id="edge-${b.id}"><rect class="draw" x="0.5" y="0.5" width="100%" height="100%" rx="6" pathLength="1"/></mask><rect class="dash" x="0.5" y="0.5" width="100%" height="100%" rx="6" mask="url(#edge-${b.id})"/></svg>`);
});

/* the first box names whichever film is next, so its heading is measured, not tuned by hand (see DATA, tune) */
const DOT = .09;   /* em: opens the line gap so a stacked dot sits midway between the line above and its own stem */
const dotted = c => /[ij\u0300-\u036f]/.test(c.normalize('NFD'));
function fitNow() {
  if (!hNow.clientWidth) return;
  /* a word wider than the column steps the heading down from display size instead of poking out of the box */
  hNow.style.fontSize = '';
  if (hNow.scrollWidth > hNow.clientWidth + 1) hNow.style.fontSize = `calc(var(--mega) * ${(Math.floor(hNow.clientWidth / hNow.scrollWidth * 990) / 1000)})`;
  /* a dotted letter on a stacked line opens the gap; otherwise the lines stay collided */
  const r = document.createRange(), walk = document.createTreeWalker(hNow, NodeFilter.SHOW_TEXT);
  let top = null, stacked = false;
  for (let n = walk.nextNode(); n && !stacked; n = walk.nextNode()) {
    for (let i = 0; i < n.data.length && !stacked; i++) {
      if (!n.data[i].trim()) continue;
      r.setStart(n, i); r.setEnd(n, i + 1);
      const y = r.getBoundingClientRect().top;
      if (top === null) top = y;
      else if (y - top > 8 && dotted(n.data[i])) stacked = true;
    }
  }
  hNow.style.setProperty('--tune', (stacked ? DOT : 0) + 'em');
}

/* box heights snap to whole pixels so the 1px dashes stay crisp */
function snap() {
  snapQ = 0;
  fitNow();
  boxes.forEach(b => { b.style.minHeight = ''; });
  const hs = boxes.map(b => b.getBoundingClientRect().height);
  boxes.forEach((b, i) => { b.style.minHeight = Math.ceil(hs[i] - .01) + 'px'; });
}
const queueSnap = () => { if (!snapQ) snapQ = requestAnimationFrame(snap); };
const put = (key, el, htmlStr) => { if (el && cache[key] !== htmlStr) { cache[key] = htmlStr; el.innerHTML = htmlStr; queueSnap(); } };

/* ---------- render: everything that depends on the language ---------- */
function render() {
  const t = T();
  root.lang = lang;
  cache = {};
  words.forEach(a => { a.innerHTML = megaText(t.nav[a.dataset.key]); });
  stripWords.forEach(a => { a.textContent = t.nav[a.dataset.key]; });
  ['season', 'prints', 'lab', 'calendar', 'friends', 'colophon'].forEach(k => { $('#h-' + k).innerHTML = megaText(t.h[k]); });
  /* collision marks: each language moves its own dotted lines (see DATA, copy.*.tune); the Now heading measures its own */
  words.forEach(a => a.style.setProperty('--dy', (t.tune.nav[a.dataset.key] || 0) + 'em'));
  ['season', 'prints', 'lab', 'calendar', 'friends', 'colophon'].forEach(k => $('#h-' + k).style.setProperty('--tune', (t.tune.h[k] || 0) + 'em'));
  langBtn.textContent = t.switchTo; langBtn.lang = t.switchLang; langBtn.setAttribute('aria-label', t.switchLabel);
  qph.innerHTML = megaText(t.search.placeholder); $('#q-label').textContent = t.search.label; $('#h-titles').textContent = t.nav.titles;

  body.now.innerHTML = `<p data-live="lede"></p><ol class="now-list" data-live="list"></ol>${links(t.now.links)}`;

  body.season.innerHTML = t.season.p.map(p => `<p>${rich(p)}</p>`).join('') +
    table('t-season', t.season.th, ['', '', 'x', 'x', 'x'], DATA.season.map(id => {
      const f = DATA.films[id];
      return `<tr role="row">${td(f.y)}${td(`${filmLink(id)}<span class="sub">${esc(f.d)}, ${f.c}, ${f.g}</span>`)}${td(esc(f.d), 'x')}${td(f.c, 'x')}${td(f.g, 'x')}</tr>`;
    }).join(''));

  body.prints.innerHTML = `<p>${t.prints.p1}</p>` +
    table('t-hold', t.prints.th, ['', 'n', ''], t.prints.rows.map(r => `<tr role="row">${td(esc(r[0]))}${td(esc(r[1]), 'n')}${td(esc(r[2]))}</tr>`).join('')) +
    `<p>${t.prints.p2}</p><p>${t.prints.p3}</p>${links(t.prints.links)}`;

  body.lab.innerHTML = `<p>${t.lab.p1}</p>${t.lab.projects.map(p => `<p>${p}</p>`).join('')}${links(t.lab.links)}`;

  body.agenda.innerHTML = `<p data-live="alede"></p>` + table('t-agenda', t.agenda.th, ['', '', 'x', '', 'x', ''], '', 'agenda');

  body.friends.innerHTML = `<p>${t.friends.p}</p>${links(t.friends.links)}`;

  const c = t.colophon;
  body.colophon.innerHTML = `<p>${c.address.map(esc).join('<br>')}</p><p>${c.hours}</p><p>${fill(c.siren, { siren: DATA.siren })}</p>` +
    `<ul class="plain">${c.staff.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` +
    `<ul class="plain"><li>${esc(c.partnersLabel)}</li>${c.partners.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` +
    `<p>${esc(c.type)}</p>${links(c.links)}`;

  live();
  queueSnap();
}

/* ---------- live: everything that depends on the clock ---------- */
function live() {
  const n = now(), t = T(), today = dayStart(n).getTime();
  shows = buildShows(n);
  const next = shows.find(s => s.start > n) || null;
  nextStart = next ? next.start : null;

  /* the first box names the next film to start, at display size: tonight's, or tomorrow's first once tonight's have all begun */
  let head = t.h.none;
  if (next) {
    const diff = Math.round((dayStart(next.start) - today) / 864e5);
    const key = diff > 1 ? 'later' : diff === 1 ? 'tomorrow' : next.start.getHours() < 17 ? 'today' : 'tonight';
    head = fill(t.h[key], { film: next.f.s || next.f.t, time: next.time, day: fmt(next.start, { weekday: 'long' }) });
  }
  if (hNow.textContent !== head) { hNow.innerHTML = megaText(head); queueSnap(); }

  put('lede', $('[data-live="lede"]'), fill(t.now.lede, { date: dLong(n), time: hm(n) }));

  /* the next four screenings from this minute: tonight first, tomorrow when tonight has run out */
  let last = today, list = '';
  shows.filter(s => s.end > n).slice(0, 4).forEach(s => {
    const d = dayStart(s.start).getTime(), st = stateOf(s, n, next), room = DATA.rooms[s.room][lang];
    if (d > today && d !== last) list += `<li class="day">${d - today < 1.5 * 864e5 ? fill(t.tomorrow, { date: dLong(s.start) }) : dLong(s.start)}</li>`;
    last = d;
    const status = st === 'on' ? `<span class="st live">${fill(t.onNow, { n: Math.floor((n - s.start) / 60000) })}</span>`
      : st === 'next' ? `<span class="st live">${fill(t.startsIn, { x: span(s.start - n) })}</span>` : '';
    list += `<li class="is-${st}"><span class="tm">${s.time}</span><span class="rm">${room}</span><span class="wk">${filmLink(s.id)}, ${esc(s.f.d)}, ${s.f.y}</span>${status}<span class="meta"><span class="rm-m">${room}, </span>${metaOf(s.f)}</span></li>`;
  });
  put('list', $('[data-live="list"]'), list);

  /* two weeks; what has already screened is struck through */
  if (shows.length) put('alede', $('[data-live="alede"]'), fill(t.agenda.lede, { sheet: DATA.sheet, from: dShort(shows[0].start), to: dShort(shows[shows.length - 1].start) }));
  let seen = null, rows = '';
  shows.forEach(s => {
    const d = dayStart(s.start).getTime(), first = d !== seen, st = stateOf(s, n, next), room = DATA.rooms[s.room][lang];
    seen = d;
    const tk = st === 'past' ? '' : st === 'on' ? `<span class="live">${esc(t.onShort)}</span>` : ticket(s);
    rows += `<tr role="row" class="is-${st}${first ? ' d1' : ''}">${td(first ? dShort(s.start) : '')}${td(`<span class="tm">${s.time}</span>`)}${td(room, 'x')}${td(`${filmLink(s.id)} (${s.f.y})<span class="sub">${room}, ${s.f.g}</span>`)}${td(s.f.g, 'x')}${td(tk, 'tk')}</tr>`;
  });
  put('agenda', $('[data-live="agenda"]'), rows);

  runSearch();

  /* the siren: two minutes a day the mark itself is live */
  const [sh, sm] = DATA.siren.split(':').map(Number), mins = n.getHours() * 60 + n.getMinutes();
  root.classList.toggle('siren', mins >= sh * 60 + sm && mins < sh * 60 + sm + 2);
}

function runSearch() {
  const t = T().search, raw = qEl.value.trim(), q = norm(raw), n = now();
  qf.classList.toggle('has-q', qEl.value !== '');
  let out;
  if (!q) {
    const [a, b, c] = t.tries.map(x => `<a href="#titles" data-q="${esc(x)}">${esc(x)}</a>`);
    out = `<p>${fill(t.hint, { a, b, c })}</p>`;
  } else {
    const hits = Object.keys(DATA.films).filter(id => { const f = DATA.films[id]; return norm([f.t, f.d, f.y, f.c, f.g].join(' ')).includes(q); });
    if (!hits.length) out = `<p>${fill(t.empty, { q: esc(raw) })}</p>${links(t.links)}`;
    else out = `<ul class="results">${hits.map(id => {
      const f = DATA.films[id];
      const s = shows.find(x => x.start > n && (x.id === id || x.f.plus === id));
      const when = s ? `${fill(t.next, { date: dShort(s.start), time: s.time, room: DATA.rooms[s.room][lang] })} ${ticket(s)}` : t.none;
      return `<li><i>${esc(f.t)}</i>, ${esc(f.d)}, ${f.y}, ${f.c}. ${metaOf(f)}<br>${when}</li>`;
    }).join('')}</ul>`;
  }
  put('search', body.search, out);
}

/* once a minute, on the minute; every second inside the last minute before a start */
function tick() {
  live();
  const n = now(), left = nextStart ? nextStart - n : Infinity;
  const wait = left > 0 && left <= 61000 ? 1000 - n.getMilliseconds() : 60000 - (n.getSeconds() * 1000 + n.getMilliseconds());
  clearTimeout(timer);
  timer = setTimeout(tick, Math.max(200, wait + 15));
}

/* ---------- scroll: the word whose box is being read stays ink, the rest recede ---------- */
let spyQ = 0;
function spy() {
  spyQ = 0;
  const line = innerHeight * .2;   /* high enough that the short Titles box, landed at its scroll margin, still owns the line */
  let key = null;
  for (const b of boxes) { if (b.getBoundingClientRect().top <= line) key = b.dataset.nav; else break; }
  nav.classList.toggle('is-index', WIDE.matches && scrollY > 8);
  words.forEach(a => a.classList.toggle('is-on', a.dataset.key === key));
  stripWords.forEach(a => {
    const on = a.dataset.key === key;
    a.classList.toggle('is-on', on);
    if (on) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current');
  });
}
const queueSpy = () => { if (!spyQ) spyQ = requestAnimationFrame(spy); };
addEventListener('scroll', queueSpy, { passive: true });
addEventListener('resize', () => { queueSpy(); queueSnap(); });

/* a hovered or focused nav word calls its box: the dashes of that box march */
words.forEach(a => {
  const call = v => () => boxes.forEach(b => { if (b.dataset.nav === a.dataset.key) b.classList.toggle('is-called', v); });
  a.addEventListener('pointerenter', call(true)); a.addEventListener('pointerleave', call(false));
  a.addEventListener('focus', call(true)); a.addEventListener('blur', call(false));
});

/* phone: once the megatype has scrolled away the strip takes over */
if ('IntersectionObserver' in window) {
  new IntersectionObserver(([e]) => strip.classList.toggle('is-shown', !e.isIntersecting && e.boundingClientRect.bottom <= 0)).observe(nav);
}

/* the Titles word ends in the field: focus follows the scroll once it settles, it never causes one */
let landT = 0;
function land() {
  removeEventListener('scrollend', land);
  clearTimeout(landT);
  const r = $('#titles').getBoundingClientRect();
  if (r.top < innerHeight * .6 && r.bottom > 0) qEl.focus({ preventScroll: true });
}
function landInTitles() {
  removeEventListener('scrollend', land);
  clearTimeout(landT);
  const y0 = scrollY;
  addEventListener('scrollend', land);
  /* already in place, or an instant (reduced motion) jump: land now; no scrollend in this browser: a timer lands it */
  landT = setTimeout(() => { if (RM.matches || Math.abs(scrollY - y0) < 1) land(); else landT = setTimeout(land, 1400); }, 160);
}

/* links: in-page jumps travel (natively), film titles and suggestions fill the field */
document.addEventListener('click', e => {
  const a = e.target.closest ? e.target.closest('a') : null;
  if (!a) return;
  const to = a.getAttribute('href') || '';
  if (a.dataset.q != null) { qEl.value = a.dataset.q; runSearch(); }
  if (to.startsWith('#') && !RM.matches) {
    root.classList.add('smooth');
    clearTimeout(smoothT);
    smoothT = setTimeout(() => root.classList.remove('smooth'), 1400);
  }
  if (to === '#titles' && a.dataset.key === 'titles') landInTitles();
});
qEl.addEventListener('input', runSearch);
langBtn.addEventListener('click', () => { lang = lang === 'en' ? 'de' : 'en'; render(); queueSpy(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
if ('ResizeObserver' in window) new ResizeObserver(queueSnap).observe(dossier);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(queueSnap);

/* ---------- start ---------- */
render();
spy();
tick();
if (root.classList.contains('boot')) {
  const go = () => {
    if (root.classList.contains('go')) return;
    root.classList.add('go');
    setTimeout(() => root.classList.add('done'), 2400);
  };
  if (document.readyState === 'complete') go();
  else { addEventListener('load', go, { once: true }); setTimeout(go, 1500); }
}
})();
</script>
</body>
</html>
