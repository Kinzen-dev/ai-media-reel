<!-- TEMPLATE: Thai Script Specimen Bands | ARCHETYPE: script-first type foundry site (hero = a Thai vertical-metrics proof: five measured guide lines across a full-bleed band, the word standing on them, real loop / loopless switch; then flat colour specimen bands) | REF: Cadson Demak, 29LT, TPTQ Arabic, Japan Typography Association | WHEN TO USE: a non-Latin type foundry, lettering studio or script-led brand that must show the script itself as the imagery | SWAP: edit the DATA object at top of the script (guide lines re-measure themselves from whatever fonts you load) -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rueang Type</title>
<meta name="description" content="เรือง (Rueang Type) สตูดิโอออกแบบตัวอักษรไทย ลาว และละติน ในกรุงเทพฯ">
<meta name="theme-color" content="#FF3B1F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wdth,wght@62.5..100,100..900&family=Noto+Sans+Thai+Looped:wdth,wght@62.5..100,100..900&family=Sofia+Sans+Extra+Condensed:wght@100..900&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Lao:wght@300..800&display=swap">
<script>document.documentElement.classList.add('js');</script>
<style>
:root{
  --paper:#FFFFFF;
  --ink:#0B0B0B;
  --verm:#FF3B1F;
  --ultra:#2E3BFF;
  --butter:#FFF1B8;
  --mint:#9BF0D2;
  --gut:clamp(16px,3.3vw,48px);
  --f-thai:"Noto Sans Thai",sans-serif;
  --f-loop:"Noto Sans Thai Looped","Noto Sans Thai",sans-serif;
  --f-hair:"Sofia Sans Extra Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans Thai","Noto Sans Thai",sans-serif;
  --f-ui:"IBM Plex Sans","IBM Plex Sans Thai",sans-serif;
  --f-lao:"Noto Sans Lao",sans-serif;
  --ease:cubic-bezier(0.16,1,0.3,1);
  --expo:cubic-bezier(0.19,1,0.22,1);
  --nav-h:64px;
  --hs:clamp(118px,20.2vw,292px);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scrollbar-width:thin;scrollbar-color:var(--ink) var(--paper)}
html::-webkit-scrollbar{width:10px}
html::-webkit-scrollbar-track{background:var(--paper)}
html::-webkit-scrollbar-thumb{background:var(--ink);border:2px solid var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 18px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:var(--ultra);color:#fff}
a{color:inherit;text-decoration-thickness:1.5px;text-underline-offset:4px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ultra);outline-offset:3px}
.on-dark :focus-visible{outline-color:#fff}
.on-dark ::selection{background:#fff;color:var(--ink)}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
.sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:var(--gut);top:8px;z-index:60;padding:8px 14px;background:var(--ink);color:#fff;font:600 14px/1.5 var(--f-body);text-decoration:none;transform:translateY(-220%)}
.skip:focus{transform:none}
.band{position:relative;overflow:clip}
.band--paper{background:var(--paper);color:var(--ink)}
.band--verm{background:var(--verm);color:var(--ink)}
.band--ultra{background:var(--ultra);color:#fff}
.band--butter{background:var(--butter);color:var(--ink)}
.band--mint{background:var(--mint);color:var(--ink)}
.band--ink{background:var(--ink);color:#fff}

/* ---------- Latin UI ---------- */
.ui{font:600 12px/1.35 var(--f-ui);letter-spacing:.01em}
.ui-500{font:500 12px/1.45 var(--f-ui);letter-spacing:.01em}

/* ---------- hairline name (runs off both edges) ---------- */
.hair{position:relative;overflow:hidden;height:calc(var(--hs) * .661 + var(--hp-t,14px) + var(--hp-b,26px));flex:none}
.hair__move{position:absolute;left:0;top:calc(var(--hp-t,14px) - var(--hs) * .139);width:max-content;will-change:transform}
.hair__strip{display:flex;width:max-content;white-space:nowrap;margin-left:calc(var(--hs) * var(--hoff,-.07));animation:drift var(--dur,150s) linear infinite}
.hair--rev .hair__strip{animation-direction:reverse}
.hair.is-off .hair__strip{animation-play-state:paused}
.hair__strip span{display:block;font:100 var(--hs)/1 var(--f-hair);text-transform:uppercase;letter-spacing:-.004em;padding-right:.3em}
@keyframes drift{to{transform:translateX(-25%)}}

/* baseline rule: the page's guide-line vocabulary; a hairline family name stands right on it */
.cut{height:2px;flex:none;background:currentColor}
.spec .hair{--hp-b:0px}

/* ---------- nav: the foundry's own words, Thai first ---------- */
.nav{height:var(--nav-h);flex:none;position:relative;z-index:20;display:flex;align-items:center;gap:clamp(20px,2.6vw,40px);padding:0 var(--gut);background:var(--paper)}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;margin-right:auto;padding:6px 0}
.brand__th{font:900 25px/1.5 var(--f-thai)}
.brand__en{font:600 12px/1.35 var(--f-ui)}
.nav__links{display:flex;align-items:center;gap:clamp(18px,2.3vw,36px)}
.nav__links a{position:relative;display:grid;justify-items:start;text-decoration:none;padding:4px 0 6px}
.nav__links .th{font:500 15px/1.5 var(--f-body)}
.nav__links .en{font:500 11px/1.35 var(--f-ui);color:#4d4d4d}
.nav__links a::after{content:"";position:absolute;left:0;right:0;bottom:1px;height:1.5px;background:currentColor;transform:scaleX(0);transform-origin:0 50%;transition:transform 180ms var(--ease)}
.nav__links a:hover::after,.nav__links a:focus-visible::after{transform:scaleX(1)}
.nav__tools{display:flex;align-items:center;gap:6px;margin-right:-8px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;transition:background-color 160ms var(--ease),color 160ms var(--ease)}
.icon-btn:hover{background:var(--ink);color:#fff}
.icon-btn svg{width:20px;height:20px;display:block}
.menu-btn{display:none;height:40px;padding:0 4px 0 10px}
.search{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:min(560px,70vw);z-index:3}
.search[hidden]{display:none}
.search input{width:100%;height:40px;border:0;border-bottom:1.5px solid var(--ink);background:var(--paper);font:500 16px/1.5 var(--f-body);color:var(--ink);caret-color:var(--verm);padding:0 2px;border-radius:0}
.search input:focus{outline:none;border-bottom-color:var(--ultra)}
.search__results{position:absolute;left:0;right:0;top:46px;background:var(--paper);border:1px solid var(--ink)}
.search__results a{display:flex;justify-content:space-between;gap:16px;padding:12px 14px;text-decoration:none;border-top:1px solid var(--ink);font:500 16px/1.5 var(--f-body)}
.search__results a:first-child{border-top:0}
.search__results a:hover,.search__results a:focus-visible{background:var(--butter);outline:none}
.search__results small{font:500 12px/1.5 var(--f-ui);white-space:nowrap}
.search__empty{padding:12px 14px;font:500 14px/1.5 var(--f-body)}
.nav-open .menu{display:block}
.menu{display:none;position:absolute;left:0;right:0;top:var(--nav-h);background:var(--paper);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);z-index:19}
.menu a{display:flex;align-items:baseline;gap:12px;padding:10px var(--gut);text-decoration:none;border-top:1px solid var(--ink)}
.menu a:first-child{border-top:0}
.menu .th{font:600 20px/1.5 var(--f-body)}
.menu .en{font:500 12px/1.35 var(--f-ui);color:#4d4d4d}

/* ---------- hero: the Thai vertical-metrics proof ----------
   The band's top edge IS the tone-mark line and its bottom edge IS the lower-vowel line, so the
   crop happens on the guide lines. Positions are em fractions of --fs written by JS from metrics
   measured in the loaded fonts (DATA.hero.metrics are the measured defaults). */
.hero{height:100vh;height:100svh;min-height:600px;max-height:calc(var(--nav-h) + (100vw - var(--gut) * 2 - 10px) / var(--ext,3.22) * var(--span,1.317) + 400px);display:flex;flex-direction:column;background:var(--paper);position:relative;container-type:inline-size}
.hero__top{flex:1;min-height:0;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;align-content:end;align-items:end;padding:24px var(--gut) clamp(26px,3.6svh,40px)}
.hero__h1{grid-column:1 / span 7;font:600 clamp(30px,2.9vw,44px)/1.5 var(--f-thai);max-width:21em}
.hero__h1 .ln{display:block}
.hero__side{grid-column:9 / span 4;display:grid;gap:14px;justify-items:start}
.hero__note{font:400 16px/1.6 var(--f-body);max-width:24em}
.hero__cap{font:500 12px/1.5 var(--f-ui);color:#4d4d4d}
.hero__cap b{font-weight:600;color:var(--ink)}
.nw{white-space:nowrap}
.proof{--fs:min(calc((100cqw - var(--gut) * 2 - 10px) / var(--ext,3.22)),calc((100svh - var(--nav-h) - 236px) / var(--span,1.317)));position:relative;flex:none;margin:0;height:calc(var(--fs) * var(--span,1.317));background:var(--verm);color:var(--ink);overflow:hidden}
.pl{position:absolute;left:0;right:0;top:calc(var(--fs) * var(--y,0));height:2px;margin-top:-1px;transition:top 340ms var(--ease)}
.pl__rule{position:absolute;inset:0;background:currentColor;transform-origin:0 50%}
.pl--tone{top:0;margin-top:0}
.pl--end{top:auto;bottom:0;margin-top:0}
.pl__lab{position:absolute;left:calc(var(--gut) + 12px);display:flex;align-items:baseline;gap:9px;font:500 11px/1.35 var(--f-ui);white-space:nowrap}
.pl__lab b{font-weight:400;font-variant-numeric:tabular-nums}
.pl--below .pl__lab{top:9px}
.pl--above .pl__lab{bottom:8px}
.pw{position:absolute;left:var(--gut);top:calc(var(--fs) * var(--wt,0));margin:0;font-size:calc(var(--fs) * var(--s,1));line-height:1.5;white-space:nowrap;transition:opacity 120ms linear,visibility 0s linear 0s}
.pw[data-on="false"]{opacity:0;visibility:hidden;transition:opacity 120ms linear,visibility 0s linear 120ms}
.pw--flat{font-family:var(--f-thai)}
.pw--loop{font-family:var(--f-loop)}
.pw .g{display:inline-block}
.pw .b{font-weight:900}
.pw .t{font-weight:100}
/* advance boxes, as a font editor draws them: ticks from the baseline to the lower-vowel line at each
   run's origin and end, the advance width (font units) set in the empty lower zone */
.pw .b,.pw .t{position:relative;display:inline-block}
.pw .b::before,.pw .b::after,.pw .t::after{content:"";position:absolute;top:calc(var(--bo,1.055) * 1em);height:calc(var(--lo,.261) * 1em);width:2px;background:currentColor}
.pw .b::before{left:0}
.pw .b::after{right:-1px}
.pw .t::after{right:0}
.adv{position:absolute;left:50%;top:calc((var(--bo,1.055) + var(--lo,.261) * .5) * 1em);width:0;height:0;font-style:normal}
.adv__in{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;align-items:baseline;gap:9px;font:500 11px/1.35 var(--f-ui);white-space:nowrap}
.adv b{font-weight:400;font-variant-numeric:tabular-nums}

/* entrance: content is visible by default; motion only when allowed and fonts are in */
@media (prefers-reduced-motion:no-preference){
  html.js:not(.is-ready) .hero .enter{opacity:0}
  html.is-ready .hero__top .enter{animation:fadeIn 520ms var(--ease) both;animation-delay:calc(140ms + var(--i,0) * 90ms)}
  html.is-ready .proof{animation:wipeUp 720ms var(--expo) 60ms both}
  html.is-ready .pl__rule{animation:lineDraw 760ms var(--expo) both;animation-delay:calc(200ms + var(--i) * 70ms)}
  html.is-ready .pl__lab{animation:fadeIn 380ms var(--ease) both;animation-delay:calc(560ms + var(--i) * 70ms)}
  html.is-ready .adv{animation:fadeIn 380ms var(--ease) 940ms both}
  html.is-ready .pw .g{animation:glyphRise 820ms var(--expo) both;animation-delay:calc(380ms + var(--i) * 50ms)}
}
@keyframes wipeUp{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes lineDraw{from{transform:scaleX(0)}to{transform:none}}
@keyframes glyphRise{from{transform:translateY(.46em)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---------- specimen bands ---------- */
.spec{--hs:clamp(92px,14.6vw,212px);--ds:clamp(150px,23.4vw,340px);display:flex;flex-direction:column}
.spec .cut{color:currentColor}
.spec__info{position:relative;z-index:2;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;row-gap:22px;padding:30px var(--gut) 0;align-items:start}
.spec__desc{grid-column:1 / span 5;font:400 18px/1.6 var(--f-body);max-width:34em;text-wrap:pretty}
.spec__dl{grid-column:7 / span 3;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:18px;row-gap:6px}
.spec__dl dt{font:500 12px/1.5 var(--f-ui);opacity:.78}
.spec__dl dd{font:600 12px/1.5 var(--f-ui)}
.spec__ctl{grid-column:10 / span 3;justify-self:end}
.stage{position:relative;z-index:1;pointer-events:none;font-size:var(--ds);height:var(--sh,1em);flex:none;margin-top:var(--st,26px);transition:height 300ms var(--ease)}
.spec.is-both .stage{height:var(--shb,1.42em)}
.layer{position:absolute;left:var(--gut);top:calc(var(--bl,1.055em) - 1.0555em);white-space:nowrap;line-height:1.5;font-family:var(--f-thai);font-weight:var(--w,900);font-stretch:var(--wd,100%);transition:opacity 120ms linear,visibility 0s linear 0s}
.layer--loop{font-family:var(--f-loop);top:calc(var(--bl,1.055em) - 1.2em)}
.layer[data-on="false"]{opacity:0;visibility:hidden;transition:opacity 120ms linear,visibility 0s linear 120ms}
.layer--both{top:0;display:flex;flex-direction:column;font-size:.46em}
.spec--right{--ds:clamp(170px,27vw,400px)}
.both-row{display:flex;align-items:baseline;gap:.35em;line-height:1.5}
.both-row .ui{font-size:12px;width:76px;flex:none;transform:translateY(-.2em)}
.both-row .th{font-family:var(--f-thai)}
.both-row .lo{font-family:var(--f-loop)}
.spec--right .layer{left:auto;right:var(--gut)}
.spec--right .layer--both{right:auto;left:var(--gut)}

/* segmented switch (shared by specimen bands and filters) */
.seg{display:inline-flex;border:1.5px solid currentColor}
.seg button{min-width:104px;height:40px;padding:0 16px;font:600 12px/1 var(--f-ui);letter-spacing:.01em;border-left:1.5px solid currentColor;transition:background-color 150ms var(--ease),color 150ms var(--ease)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:currentColor}
.seg button[aria-pressed="true"] span{color:var(--seg-on,var(--paper))}
.seg button:not([aria-pressed="true"]):hover{background:rgba(11,11,11,.08)}
.on-dark .seg button:not([aria-pressed="true"]):hover{background:rgba(255,255,255,.14)}
.band--butter .seg{--seg-on:var(--butter)}
.band--mint .seg{--seg-on:var(--mint)}
.band--ultra .seg{--seg-on:var(--ultra)}
.band--verm .seg{--seg-on:var(--verm)}

/* ---------- weight scrub ---------- */
.scrub{height:320vh}
.scrub__pin{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;padding:28px var(--gut) 30px}
.scrub__head{display:flex;justify-content:space-between;gap:32px;align-items:start}
.scrub__note{font:400 18px/1.6 var(--f-body);max-width:31em;color:rgba(255,255,255,.86);text-wrap:pretty}
.scrub__word{align-self:center;justify-self:center;font:100 min(25vw,44svh)/1.5 var(--f-thai);white-space:nowrap;margin:0;font-weight:100}
.scrub__foot{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(20px,4vw,64px);align-items:end}
.readout{display:flex;align-items:baseline;gap:12px}
.readout b{font:100 clamp(84px,10vw,150px)/.8 var(--f-hair);font-variant-numeric:tabular-nums;min-width:2.1ch;display:inline-block;letter-spacing:-.01em}
.ruler{position:relative;padding-bottom:22px}
.ruler__track{position:relative;height:28px;border-bottom:1px solid #fff}
.ruler__tick{position:absolute;bottom:0;width:1px;height:12px;background:#fff}
.ruler__tick span{position:absolute;top:18px;left:0;transform:translateX(-50%);font:500 12px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.ruler__mark{position:absolute;left:0;bottom:-6px;width:3px;height:40px;background:var(--verm);margin-left:-1px;will-change:transform}

/* ---------- tester ---------- */
.sec-head{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;row-gap:14px;padding:clamp(64px,8vw,112px) var(--gut) clamp(28px,3vw,40px);align-items:end}
.sec-head h2{grid-column:1 / span 6;font:800 clamp(36px,3.9vw,56px)/1.5 var(--f-thai);text-wrap:balance}
.sec-head p{grid-column:8 / span 5;font:400 18px/1.6 var(--f-body);max-width:34em;text-wrap:pretty}
.strip{margin:0 var(--gut);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.3fr) auto auto;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.ctl{display:flex;align-items:center;gap:16px;min-height:56px;padding:0 20px;border-left:1px solid var(--ink)}
.ctl:first-child{border-left:0;padding-left:0}
.ctl > span{font:600 12px/1 var(--f-ui);flex:none;width:52px}
.ctl output{font:500 12px/1 var(--f-ui);font-variant-numeric:tabular-nums;width:46px;text-align:right;flex:none}
.ctl input[type=range]{flex:1;min-width:0}
.ctl--reset{font:600 12px/1 var(--f-ui);padding:0 4px 0 20px;justify-content:center;transition:color 150ms var(--ease)}
.ctl--reset:hover{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
input[type=range]{-webkit-appearance:none;appearance:none;height:28px;background:transparent;cursor:pointer;accent-color:var(--ink)}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-7.5px;border-radius:50%;background:var(--ink);transition:transform 150ms var(--ease)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25)}
input[type=range]::-moz-range-track{height:1px;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--ink)}
.toggle{position:relative;width:44px;height:24px;border:1.5px solid var(--ink);border-radius:12px;flex:none;transition:background-color 150ms var(--ease)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:var(--ink);transition:transform 180ms var(--ease),background-color 150ms var(--ease)}
.toggle[aria-checked="true"]{background:var(--ink)}
.toggle[aria-checked="true"]::after{transform:translateX(20px);background:var(--paper)}
.tester__text{margin:0 var(--gut);padding:clamp(28px,3vw,44px) 0 clamp(56px,6vw,88px);font-family:var(--f-thai);font-weight:600;font-size:72px;line-height:1.5;caret-color:var(--verm);outline:none;text-wrap:pretty;transition:opacity 60ms linear;min-height:2.5em;overflow-wrap:anywhere}
.tester__text:focus-visible{box-shadow:inset 0 -2px 0 var(--ultra)}
.tester__text.is-swap{opacity:0}

/* ---------- notes + events ---------- */
.thoughts .sec-head{padding-top:clamp(56px,6vw,88px)}
.thoughts .seg-wrap{grid-column:8 / span 5;justify-self:end}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:0 var(--gut) clamp(72px,8vw,120px)}
.card{position:relative;display:flex;flex-direction:column;min-height:520px;padding:22px;border-radius:16px;overflow:hidden;min-width:0}
.card[hidden]{display:none}
.card--ultra{background:var(--ultra);color:#fff}
.card--ink{background:var(--ink);color:#fff}
.card--verm{background:var(--verm);color:var(--ink)}
.card--mint{background:var(--mint);color:var(--ink)}
.card--butter{background:var(--butter);color:var(--ink)}
.card--paper{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.card h3{font:700 clamp(21px,1.7vw,24px)/1.5 var(--f-thai);text-wrap:balance;max-width:19em}
.card h3 a{text-decoration:none}
.card h3 a::after{content:"";position:absolute;inset:0;border-radius:16px;z-index:2}
.card h3 a:focus-visible{outline:none}
.card:has(h3 a:focus-visible){outline:2px solid var(--ultra);outline-offset:3px}
.card__by{display:flex;justify-content:space-between;gap:16px;margin-top:10px}
.card__by span:first-child{font-weight:600}
.poster{position:relative;flex:1;margin:22px -22px -22px;min-height:290px;overflow:hidden;display:grid;place-items:center;pointer-events:none}

/* poster: outline to solid (tone marks over an ascender) */
.pz-tones{display:grid;grid-template-columns:repeat(2,auto);column-gap:.3em;font:800 clamp(62px,6vw,88px)/1.5 var(--f-thai)}
/* outline = a 2px stroke painted under a fill in the card colour: only the outer 1px shows, so

.card:hover .lp--loop,.card:focus-within .lp--loop{opacity:0}
.card:hover .lp--flat,.card:focus-within .lp--flat{opacity:1}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const graphemes = (s) => {
  try { return Array.from(new Intl.Segmenter("th", { granularity: "grapheme" }).segment(s), x => x.segment); }
  catch (e) { return [s]; }
};
/* Thai copy: {compound} -> nowrap span, | -> <wbr>; plain() strips the marks for search and labels */
const rich = (s) => esc(s).replace(/\{([^}]+)\}/g, '<span class="nw">$1</span>').replace(/\|/g, "<wbr>");
const plain = (s) => String(s).replace(/[{}|]/g, "");
const hair = (name, cls = "", dur = 150) =>
  `<div class="hair ${cls}" aria-hidden="true" style="--dur:${dur}s"><div class="hair__move"><div class="hair__strip">${
    Array(4).fill(`<span>${esc(name)}</span>`).join("")}</div></div></div>`;
const searchSvg = `<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6.25" stroke="currentColor" stroke-width="1.75"/><path d="M13.2 13.2 18 18" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>`;

/* proof geometry: the loopless face defines the frame (tone-mark line to lower-vowel line);
   any other face is scaled to fit the same frame, so the band edges stay on guide lines */
function proofGeom(face) {
  const M = DATA.hero.metrics, m = M[face], f = M.loopless;
  const span0 = f.tone + f.lower, s = span0 / (m.tone + m.lower);
  return {
    s, span: span0 / 1000, ext: f.ext,
    y: { tone: 0, upper: s * (m.tone - m.upper) / 1000, x: s * (m.tone - m.x) / 1000, base: s * m.tone / 1000, lower: span0 / 1000 },
    wt: s * (m.tone - m.base) / 1000,
    v: { tone: m.tone, upper: m.upper, x: m.x, base: 0, lower: -m.lower }
  };
}
const unitsTxt = (v) => (v < 0 ? "−" : "") + Math.abs(Math.round(v));
function proofWord(face, on) {
  const H = DATA.hero, g = proofGeom(face), m = H.metrics[face];
  let i = 0;
  const run = (txt, cls, w, adv) => `<span class="${cls}">${graphemes(txt).map(c => `<span class="g" style="--i:${i++}">${c}</span>`).join("")}<i class="adv"><span class="adv__in"><span>wght ${w}</span><b data-adv="${cls}">advance ${adv}</b></span></i></span>`;
  return `<p class="pw pw--${face === "looped" ? "loop" : "flat"}" lang="th" data-face="${face}" data-on="${on}" style="--s:${g.s.toFixed(4)};--wt:${g.wt.toFixed(4)};--bo:${(m.base / 1000).toFixed(4)};--lo:${(m.lower / 1000).toFixed(4)}">${run(H.word, "b", 900, m.adv9)}${run(H.tail, "t", 100, m.adv1)}</p>`;
}

function specBand(f, idx) {
  const right = f.layout.includes("run-left");
  const crop = f.layout.includes("crop");
  const dark = f.band === "ultra" || f.band === "ink";
  const style = `--w:${f.wght};--wd:${f.wdth}`;
  const stage = `
    <div class="stage" style="${style}${right ? ";--sh:1.24em;--bl:1.14em;--st:10px" : crop ? ";--sh:.98em;--bl:1.07em" : ""}">
      <div class="layer layer--flat" data-l="loopless" data-on="${f.mode === "loopless"}" aria-hidden="${f.mode !== "loopless"}">${esc(f.sample)}</div>
      <div class="layer layer--loop" data-l="looped" data-on="${f.mode === "looped"}" aria-hidden="${f.mode !== "looped"}">${esc(f.sample)}</div>
      <div class="layer layer--both" data-l="both" data-on="false" aria-hidden="true">
        <div class="both-row"><span class="ui">Loopless</span><span class="th">${esc(f.sample)}</span></div>
        <div class="both-row"><span class="ui">Looped</span><span class="lo">${esc(f.sample)}</span></div>
      </div>
    </div>`;
  const info = `
    <div class="spec__info">
      <p class="spec__desc">${esc(f.desc)}</p>
      <dl class="spec__dl">${f.meta.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
      <div class="spec__ctl">
        <div class="seg" role="group" aria-label="${esc(f.name)}: Thai letter style">
          ${[["loopless", "Loopless"], ["looped", "Looped"], ["both", "Both"]].map(([m, l]) =>
            `<button type="button" data-mode="${m}" aria-pressed="${m === f.mode}"><span>${l}</span></button>`).join("")}
        </div>
      </div>
    </div>`;
  return `
  <section class="band band--${f.band} spec ${right ? "spec--right" : ""} ${dark ? "on-dark" : ""}" id="fam-${f.id}" aria-labelledby="fam-${f.id}-h" data-search="${esc(f.name)} ${esc(f.desc)}">
    <h2 class="sr-only" id="fam-${f.id}-h">${esc(f.name)}</h2>
    ${hair(f.name, idx % 2 === 0 ? "hair--rev" : "", 150 + idx * 20)}
    <div class="cut" aria-hidden="true"></div>
    ${right ? stage + info + `<div style="height:clamp(48px,5vw,72px)"></div>` : info + stage}
  </section>`;
}

function poster(p) {
  if (p.type === "tones") return `<div class="pz-tones" lang="th">${p.words.map((w, i) => `<span style="--i:${i}" class="${i === p.solid ? "is-solid" : ""}">${esc(w)}</span>`).join("")}</div>`;
  if (p.type === "rs") {
    /* 24 drafts: hand-picked weight / width pairs so the grid reads as pencil variation, not a ramp */
    const W = [300, 800, 500, 200, 900, 600, 700, 400, 100, 800, 500, 300, 900, 600, 200, 900, 400, 700, 500, 100, 800, 300, 600, 400];
    const X = [100, 70, 85, 62.5, 92, 75, 66, 100, 80, 88, 62.5, 95, 72, 100, 68, 100, 90, 64, 78, 100, 82, 70, 96, 62.5];
    return `<div class="pz-rs" lang="th">${W.map((w, i) => `<span style="--i:${i};--w:${w};--wd:${X[i]}%"${i === p.pick ? ' class="is-pick"' : ""}>${esc(p.glyph)}</span>`).join("")}</div><div class="pz-cap ui"><span class="a">${esc(p.a)}</span><span class="b">${esc(p.b)}</span></div>`;
  }
  if (p.type === "loops") return `<div class="pz-loops"><span class="lp lp--loop">${esc(p.glyphs)}</span><span class="lp lp--flat">${esc(p.glyphs)}</span></div><div class="pz-cap ui"><span class="a">Looped</span><span class="b">Loopless</span></div>`;
  if (p.type === "nums") return `<div class="pz-nums">${graphemes(p.glyphs).map((g, i) => `<span style="--i:${i};--w:${100 + i * 100}">${g}</span>`).join("")}</div><div class="pz-cap ui"><span class="a">100 to 900</span><span class="b">900 to 100</span></div>`;
  if (p.type === "sisters") return `<div class="pz-sis"><span class="t" lang="th">${esc(p.thai)}</span><span class="l" lang="lo">${esc(p.lao)}</span></div><div class="pz-cap ui"><span class="a">Thai over Lao</span><span class="b">Lao over Thai</span></div>`;
  if (p.type === "width") return `<div class="pz-width"><b>${esc(p.word)}</b></div><div class="pz-cap ui"><span class="a">${esc(p.note)}</span><span class="b">${esc(p.note)}</span></div>`;
  return "";
}

const root = document.documentElement;
const mqReduce = matchMedia("(prefers-reduced-motion: reduce)");
let reduce = mqReduce.matches;

/* ---------- the proof: guide lines measured from the loaded fonts, and the face switch ---------- */
const heroEl = $(".hero"), proof = $(".proof");
let proofFace = "loopless";
/* canvas TextMetrics give the true ink heights; a zero-size inline-block gives the baseline offset */
function measureFace(face) {
  const H = DATA.hero, fam = H.faces[face].family;
  const c = measureFace.c || (measureFace.c = document.createElement("canvas").getContext("2d"));
  c.font = `900 1000px ${fam}`;
  const asc = (s) => c.measureText(s).actualBoundingBoxAscent;
  const m = { tone: asc("บี่"), upper: asc("บี"), x: asc("บน"), lower: c.measureText("บุ").actualBoundingBoxDescent };
  m.adv9 = c.measureText(H.word).width;
  c.font = `100 1000px ${fam}`;
  m.adv1 = c.measureText(H.tail).width;
  m.ext = (m.adv9 + c.measureText(H.tail).actualBoundingBoxRight) / 1000 + .02;
  const d = document.createElement("div");
  d.style.cssText = `position:absolute;left:0;top:0;width:0;overflow:hidden;visibility:hidden;white-space:nowrap;font:900 1000px/1.5 ${fam}`;
  d.innerHTML = 'บ<i style="display:inline-block;width:0;height:0;vertical-align:baseline"></i>';
  document.body.appendChild(d);
  m.base = d.lastChild.getBoundingClientRect().top - d.getBoundingClientRect().top;
  d.remove();
  for (const k in m) m[k] = k === "ext" ? Math.round(m[k] * 100) / 100 : Math.round(m[k]);
  return m.tone > m.upper && m.upper > m.x && m.x > 0 && m.lower > 0 && m.ext > 1 ? m : null;
}
function applyProof() {
  const g0 = proofGeom("loopless"), g = proofGeom(proofFace);
  heroEl.style.setProperty("--span", g0.span.toFixed(4));
  heroEl.style.setProperty("--ext", g0.ext);
  $$(".pw", proof).forEach(p => {
    const gp = proofGeom(p.dataset.face), mp = DATA.hero.metrics[p.dataset.face];
    p.style.setProperty("--s", gp.s.toFixed(4));
    p.style.setProperty("--wt", gp.wt.toFixed(4));
    p.style.setProperty("--bo", (mp.base / 1000).toFixed(4));
    p.style.setProperty("--lo", (mp.lower / 1000).toFixed(4));
    $$("[data-adv]", p).forEach(a => { a.textContent = "advance " + (a.dataset.adv === "b" ? mp.adv9 : mp.adv1); });
  });
  $$(".pl", proof).forEach(l => {
    const k = l.dataset.k;
    l.style.setProperty("--y", g.y[k].toFixed(4));
    $("b", l).textContent = unitsTxt(g.v[k]);
  });
  const fp = $(".foot__proof");
  if (fp) {
    fp.style.setProperty("--yb", g0.y.base.toFixed(4));
    fp.style.setProperty("--wt", g0.wt.toFixed(4));
    $$(".pl", fp).forEach(l => { const k = l.dataset.k; l.style.setProperty("--y", g0.y[k].toFixed(4)); $("b", l).textContent = unitsTxt(g0.v[k]); });
  }
}
function remeasure() {
  ["loopless", "looped"].forEach(f => { const m = measureFace(f); if (m) Object.assign(DATA.hero.metrics[f], m); });
  applyProof();
}
function setFace(f) {
  proofFace = f;
  proof.dataset.face = f;
  $$(".hero__seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.face === f)));
  $$(".pw", proof).forEach(p => { p.dataset.on = String(p.dataset.face === f); });
  $(".cap-face").textContent = DATA.hero.faces[f].name;
  applyProof();
}
$$(".hero__seg button").forEach(b => b.addEventListener("click", () => setFace(b.dataset.face)));

/* entrance waits for the display faces (max 500ms), so glyphs never swap mid-motion; late fonts re-measure */
(() => {
  const go = () => { remeasure(); root.classList.add("is-ready"); };
  const loads = [
    document.fonts.load("900 100px 'Noto Sans Thai'", "เรื่องเล่าบี่บุ"),
    document.fonts.load("900 100px 'Noto Sans Thai Looped'", "เรื่องเล่าบี่บุ"),
    document.fonts.load("100 100px 'Sofia Sans Extra Condensed'", "RUEANG")
  ];
  Promise.race([Promise.all(loads), new Promise(r => setTimeout(r, 500))]).then(go, go);
  Promise.all(loads).then(remeasure, () => {});
})();

/* pause hairline drift off screen */
const io = new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle("is-off", !e.isIntersecting)), { rootMargin: "80px" });
$$(".hair").forEach(h => io.observe(h));

/* specimen style switch: Loopless / Looped / Both, 120ms crossfade */
$$(".spec").forEach(band => {
  const btns = $$(".seg button", band);
  const layers = $$(".layer", band);
  btns.forEach(b => b.addEventListener("click", () => {
    const m = b.dataset.mode;
    btns.forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    band.classList.toggle("is-both", m === "both");
    layers.forEach(l => {
      const on = l.dataset.l === m;
      l.dataset.on = String(on);
      l.setAttribute("aria-hidden", String(!on || m === "both" && l.dataset.l !== "both"));
    });
  }));
});

/* weight scrub: wght tied 1:1 and linearly to scroll through the band */
const scrub = $(".scrub"), sWord = $(".scrub__word"), sNum = $(".readout__n"), sMark = $(".ruler__mark"), sTrack = $(".ruler__track");
let ticking = false;
function setWeight(w) {
  sWord.style.fontWeight = w.toFixed(1);
  sNum.textContent = Math.round(w);
  sNum.style.fontWeight = Math.round(w);
  sMark.style.transform = `translateX(${((w - 100) / 800) * sTrack.clientWidth}px)`;
}
function onScroll() {
  ticking = false;
  if (reduce) return;
  const r = scrub.getBoundingClientRect();
  const total = scrub.offsetHeight - innerHeight;
  const p = Math.min(1, Math.max(0, -r.top / (total || 1)));
  setWeight(100 + 800 * p);
}
addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
addEventListener("resize", () => reduce ? setWeight(600) : onScroll());
function applyReduce() { reduce = mqReduce.matches; reduce ? setWeight(600) : onScroll(); }
mqReduce.addEventListener ? mqReduce.addEventListener("change", applyReduce) : mqReduce.addListener(applyReduce);
applyReduce();

/* type tester */
(() => {
  const T = DATA.tester, x = $("#t-x"), w = $("#t-w"), s = $("#t-s"), wo = $("#t-wo"), so = $("#t-so"), l = $("#t-l");
  const small = matchMedia("(max-width: 760px)");
  const defSize = () => small.matches ? T.sizeMobile : T.size;
  const sync = () => {
    x.style.fontWeight = w.value; wo.textContent = w.value;
    x.style.fontSize = s.value + "px"; so.textContent = s.value + " px";
  };
  s.value = defSize(); sync();
  w.addEventListener("input", sync);
  s.addEventListener("input", sync);
  l.addEventListener("click", () => {
    const on = l.getAttribute("aria-checked") !== "true";
    l.setAttribute("aria-checked", String(on));
    if (reduce) { x.style.fontFamily = on ? "var(--f-loop)" : ""; return; }
    x.classList.add("is-swap");
    setTimeout(() => { x.style.fontFamily = on ? "var(--f-loop)" : ""; x.classList.remove("is-swap"); }, 60);
  });
  $("#t-r").addEventListener("click", () => {
    x.textContent = T.text; w.value = T.weight; s.value = defSize();
    l.setAttribute("aria-checked", "false"); x.style.fontFamily = ""; sync();
  });
  x.addEventListener("paste", e => {
    e.preventDefault();
    const t = (e.clipboardData || window.clipboardData).getData("text/plain");
    document.execCommand("insertText", false, t);
  });
})();

/* notes / events filter */
const fBtns = $$(".thoughts .seg button");
function filterPosts(k) {
  fBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.f === k)));
  $$(".card").forEach(c => { c.hidden = !(k === "all" || c.dataset.kind === k); });
}
fBtns.forEach(b => b.addEventListener("click", () => filterPosts(b.dataset.f)));
$$("a[data-filter]").forEach(a => a.addEventListener("click", () => filterPosts(a.dataset.filter)));

/* mobile menu */

menuBtn.addEventListener("click", () => {

/* search: typefaces, posts, custom work, licences */
(() => {
  const btn = $(".search-btn"), form = $(".search"), q = $("#q"), out = $(".search__results"), links = $(".nav__links");
  const items = [
    ...DATA.families.map(f => ({ t: f.name, sub: "Typeface", href: "#fam-" + f.id, hay: f.name + " " + f.desc + " " + f.sample })),
    ...DATA.notes.posts.map(p => ({ t: plain(p.title), sub: p.kind === "event" ? "Event" : "Note", href: "#notes", hay: plain(p.title) + " " + p.by })),
    ...DATA.custom.rows.map(r => ({ t: r.th + " " + r.face, sub: "Custom", href: "#custom", hay: r.th + " " + r.face + " " + r.client + " " + r.sector })),
    ...DATA.licensing.rows.map(r => ({ t: r[0] + " license", sub: "Licensing", href: "#licensing", hay: r.join(" ") + " license licence" }))
  ];
  const open = (on) => {
    form.hidden = !on; btn.setAttribute("aria-expanded", String(on));
    if (links) links.style.visibility = on ? "hidden" : "";
    if (on) { q.focus(); } else { q.value = ""; out.hidden = true; }
  };
  btn.addEventListener("click", () => open(form.hidden));
  q.addEventListener("input", () => {
    const v = q.value.trim().toLowerCase();
    if (!v) { out.hidden = true; return; }
    const hits = items.filter(i => i.hay.toLowerCase().includes(v)).slice(0, 6);
    out.innerHTML = hits.length ? hits.map(h => `<a href="${h.href}"><span>${esc(h.t)}</span><small>${h.sub}</small></a>`).join("")
      : `<p class="search__empty">ไม่พบคำนี้ ลองค้นด้วยชื่อฟอนต์ เช่น Rueang Loop</p>`;
    out.hidden = false;
  });
  form.addEventListener("submit", e => { e.preventDefault(); const a = $("a", out); if (a) { a.click(); } });
  out.addEventListener("click", e => { if (e.target.closest("a")) open(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !form.hidden) { open(false); btn.focus(); } });
})();
</script>
