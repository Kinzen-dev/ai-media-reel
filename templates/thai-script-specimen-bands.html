<!-- TEMPLATE: Thai Script Specimen Bands | ARCHETYPE: script-first type foundry site (hero = a Thai vertical-metrics proof: five measured guide lines across a full-bleed band, the word standing on them, the pun hung on its own tone mark, real loop / loopless switch; then three specimen bands that each show a family its own way: a hairline-name band, a 9 pt book-page proof with loop callouts, a condensed poster lock-up) | REF: Cadson Demak, 29LT, TPTQ Arabic, Japan Typography Association | WHEN TO USE: a non-Latin type foundry, lettering studio or script-led brand that must show the script itself as the imagery | SWAP: edit the DATA object at top of the script (guide lines, the tone-mark leader, the loop callouts and the poster lock-up all re-measure themselves from whatever fonts you load). Thai copy marks: {compound} never breaks, | is an allowed break, **x** is bold, [x] is a callout letter -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rueang Type</title>
<meta name="description" content="เรือง (Rueang Type) สตูดิโอออกแบบตัวอักษรไทย ลาว และละติน ในกรุงเทพฯ">
<meta name="theme-color" content="#FF3B1F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wdth,wght@62.5..100,100..900&family=Noto+Sans+Thai+Looped:wdth,wght@62.5..100,100..900&family=Sofia+Sans+Extra+Condensed:wght@100..900&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Lao:wght@300..800&display=swap">
<script>document.documentElement.classList.add('js');</script>
<style>
:root{
  --paper:#FFFFFF;
  --ink:#0B0B0B;
  --verm:#FF3B1F;
  --ultra:#2E3BFF;
  --butter:#FFF1B8;
  --mint:#9BF0D2;
  --gut:clamp(16px,3.3vw,48px);
  --f-thai:"Noto Sans Thai",sans-serif;
  --f-loop:"Noto Sans Thai Looped","Noto Sans Thai",sans-serif;
  --f-hair:"Sofia Sans Extra Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans Thai","Noto Sans Thai",sans-serif;
  --f-ui:"IBM Plex Sans","IBM Plex Sans Thai",sans-serif;
  --f-lao:"Noto Sans Lao",sans-serif;
  --ease:cubic-bezier(0.16,1,0.3,1);
  --expo:cubic-bezier(0.19,1,0.22,1);
  --nav-h:64px;
  --hs:clamp(118px,20.2vw,292px);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scrollbar-width:thin;scrollbar-color:var(--ink) var(--paper)}
html::-webkit-scrollbar{width:10px}
html::-webkit-scrollbar-track{background:var(--paper)}
html::-webkit-scrollbar-thumb{background:var(--ink);border:2px solid var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 18px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:var(--ultra);color:#fff}
a{color:inherit;text-decoration-thickness:1.5px;text-underline-offset:4px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ultra);outline-offset:3px}
.on-dark :focus-visible{outline-color:#fff}
.on-dark ::selection{background:#fff;color:var(--ink)}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
.sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:var(--gut);top:8px;z-index:60;padding:8px 14px;background:var(--ink);color:#fff;font:600 14px/1.5 var(--f-body);text-decoration:none;transform:translateY(-220%)}
.skip:focus{transform:none}
.nw{white-space:nowrap}
.band{position:relative;overflow:clip}
.band--paper{background:var(--paper);color:var(--ink)}
.band--verm{background:var(--verm);color:var(--ink)}
.band--ultra{background:var(--ultra);color:#fff}
.band--butter{background:var(--butter);color:var(--ink)}
.band--mint{background:var(--mint);color:var(--ink)}
.band--ink{background:var(--ink);color:#fff}

/* ---------- Latin UI ---------- */
.ui{font:600 12px/1.35 var(--f-ui);letter-spacing:.01em}
.ui-500{font:500 12px/1.45 var(--f-ui);letter-spacing:.01em}

/* ---------- hairline name (runs off both edges) ---------- */
.hair{position:relative;overflow:hidden;height:calc(var(--hs) * .661 + var(--hp-t,14px) + var(--hp-b,26px));flex:none}
.hair__move{position:absolute;left:0;top:calc(var(--hp-t,14px) - var(--hs) * .139);width:max-content;will-change:transform}
.hair__strip{display:flex;width:max-content;white-space:nowrap;margin-left:calc(var(--hs) * var(--hoff,-.07));animation:drift var(--dur,150s) linear infinite}
.hair--rev .hair__strip{animation-direction:reverse}
.hair.is-off .hair__strip{animation-play-state:paused}
.hair__strip span{display:block;font:100 var(--hs)/1 var(--f-hair);text-transform:uppercase;letter-spacing:-.004em;padding-right:.3em}
@keyframes drift{to{transform:translateX(-25%)}}

/* baseline rule: the page's guide-line vocabulary; a hairline family name stands right on it */
.cut{height:2px;flex:none;background:currentColor}
.spec .hair{--hp-b:0px}

/* ---------- nav: the foundry's own words, Thai first ---------- */
.nav{height:var(--nav-h);flex:none;position:relative;z-index:20;display:flex;align-items:center;gap:clamp(20px,2.6vw,40px);padding:0 var(--gut);background:var(--paper)}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;margin-right:auto;padding:6px 0}
.brand__th{font:900 25px/1.5 var(--f-thai)}
.brand__en{font:600 12px/1.35 var(--f-ui)}
.nav__links{display:flex;align-items:center;gap:clamp(18px,2.3vw,36px)}
.nav__links a{position:relative;display:grid;justify-items:start;text-decoration:none;padding:4px 0 6px}
.nav__links .th{font:500 15px/1.5 var(--f-body)}
.nav__links .en{font:500 11px/1.35 var(--f-ui);color:#4d4d4d}
.nav__links a::after{content:"";position:absolute;left:0;right:0;bottom:1px;height:1.5px;background:currentColor;transform:scaleX(0);transform-origin:0 50%;transition:transform 180ms var(--ease)}
.nav__links a:hover::after,.nav__links a:focus-visible::after{transform:scaleX(1)}
.nav__tools{display:flex;align-items:center;gap:6px;margin-right:-8px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;transition:background-color 160ms var(--ease),color 160ms var(--ease)}
.icon-btn:hover{background:var(--ink);color:#fff}
.icon-btn svg{width:20px;height:20px;display:block}
.menu-btn{display:none;height:40px;padding:0 4px 0 10px}
.search{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:min(560px,70vw);z-index:3}
.search[hidden]{display:none}
.search input{width:100%;height:40px;border:0;border-bottom:1.5px solid var(--ink);background:var(--paper);font:500 16px/1.5 var(--f-body);color:var(--ink);caret-color:var(--verm);padding:0 2px;border-radius:0}
.search input:focus{outline:none;border-bottom-color:var(--ultra)}
.search__results{position:absolute;left:0;right:0;top:46px;background:var(--paper);border:1px solid var(--ink)}
.search__results a{display:flex;justify-content:space-between;gap:16px;padding:12px 14px;text-decoration:none;border-top:1px solid var(--ink);font:500 16px/1.5 var(--f-body)}
.search__results a:first-child{border-top:0}
.search__results a:hover,.search__results a:focus-visible{background:var(--butter);outline:none}
.search__results small{font:500 12px/1.5 var(--f-ui);white-space:nowrap}
.search__empty{padding:12px 14px;font:500 14px/1.5 var(--f-body)}
.nav-open .menu{display:block}
.menu{display:none;position:absolute;left:0;right:0;top:var(--nav-h);background:var(--paper);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);z-index:19}
.menu a{display:flex;align-items:baseline;gap:12px;padding:10px var(--gut);text-decoration:none;border-top:1px solid var(--ink)}
.menu a:first-child{border-top:0}
.menu .th{font:600 20px/1.5 var(--f-body)}
.menu .en{font:500 12px/1.35 var(--f-ui);color:#4d4d4d}

/* ---------- hero: the Thai vertical-metrics proof ----------
   The band's top edge IS the tone-mark line and its bottom edge IS the lower-vowel line, so the crop
   happens on the guide lines. --fs is the proof's em: the statement above it is one line (--row) and
   the proof takes the rest of the first screen; the black word always fits, the thin tail is allowed
   to run off the right edge. Positions are em fractions of --fs written by JS from metrics measured
   in the loaded fonts (DATA.hero.metrics are the measured defaults). */
.hero{--row:128px;--extb:2.112;--fs:min(calc((100cqw - var(--gut) * 2) / var(--extb)),calc((100svh - var(--nav-h) - var(--row)) / var(--span,1.317)));position:relative;display:flex;flex-direction:column;background:var(--paper);container-type:inline-size}
.hero__top{height:var(--row);flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:40px;padding:0 var(--gut) 24px}
.hero__h1{font:600 clamp(26px,2.75vw,40px)/1.5 var(--f-thai);white-space:nowrap}
.hero__side{display:flex;align-items:flex-end;gap:28px;flex:none;padding-bottom:6px}
.hero__cap{font:500 12px/1.5 var(--f-ui);color:#4d4d4d;text-align:right}
.hero__cap b{font-weight:600;color:var(--ink)}
.proof{position:relative;flex:none;margin:0;height:calc(var(--fs) * var(--span,1.317));background:var(--verm);color:var(--ink);overflow:hidden}
.pl{position:absolute;left:0;right:0;top:calc(var(--fs) * var(--y,0));height:2px;margin-top:-1px;transition:top 340ms var(--ease)}
.pl__rule{position:absolute;inset:0;background:currentColor;transform-origin:0 50%}
.pl--tone{top:0;margin-top:0}
.pl--end{top:auto;bottom:0;margin-top:0}
.pl__lab{position:absolute;left:calc(var(--gut) + 12px);display:flex;align-items:baseline;gap:9px;font:500 11px/1.35 var(--f-ui);white-space:nowrap}
.pl__lab b{font-weight:400;font-variant-numeric:tabular-nums}
.pl--below .pl__lab{top:9px}
.pl--above .pl__lab{bottom:8px}
.pw{position:absolute;left:var(--gut);top:calc(var(--fs) * var(--wt,0));margin:0;font-size:calc(var(--fs) * var(--s,1));line-height:1.5;white-space:nowrap;transition:opacity 120ms linear,visibility 0s linear 0s}
.pw[data-on="false"]{opacity:0;visibility:hidden;transition:opacity 120ms linear,visibility 0s linear 120ms}
.pw--flat{font-family:var(--f-thai)}
.pw--loop{font-family:var(--f-loop)}
.pw .g{display:inline-block}
.pw .b{font-weight:900}
.pw .t{font-weight:100}
/* advance boxes, as a font editor draws them: ticks from the baseline to the lower-vowel line at each
   run's origin and end, the advance width (font units) set in the empty lower zone */
.pw .b,.pw .t{position:relative;display:inline-block}
.pw .b::before,.pw .b::after,.pw .t::after{content:"";position:absolute;top:calc(var(--bo,1.055) * 1em);height:calc(var(--lo,.261) * 1em);width:2px;background:currentColor}
.pw .b::before{left:0}
.pw .b::after{right:-1px}
.pw .t::after{right:0}
.adv{position:absolute;left:50%;top:calc((var(--bo,1.055) + var(--lo,.261) * .5) * 1em);width:0;height:0;font-style:normal}
/* the thin run may be cropped by the band: its label centres on the part that is still visible */
.pw .t > .adv{left:min(50%,calc((100cqw - var(--gut) - var(--fs) * var(--s,1) * var(--a9,2.092)) / 2))}
.proof.is-tail-cut .t > .adv{display:none}
.adv__in{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;align-items:baseline;gap:9px;font:500 11px/1.35 var(--f-ui);white-space:nowrap}
.adv b{font-weight:400;font-variant-numeric:tabular-nums}
/* the pun, hung on the mai ek it is about: the leader starts at the mark's measured right edge,
   at its measured vertical centre, and moves with it when the loop switch rescales the word */
.pun{position:absolute;z-index:3;left:calc(var(--gut) + var(--fs) * var(--mx,.818) + 8px);top:calc(var(--nav-h) + var(--row) + var(--fs) * var(--my,.101));display:flex;align-items:center;gap:14px;margin:0;transform:translateY(-50%);font:500 clamp(15px,1.25vw,18px)/1.5 var(--f-body);white-space:nowrap;color:var(--ink);transition:left 340ms var(--ease),top 340ms var(--ease)}
.pun__lead{display:block;flex:none;width:clamp(32px,6vw,96px);height:1px;background:currentColor;transform-origin:0 50%}
.pun b{font-weight:600}

/* entrance: content is visible by default; motion only when allowed and fonts are in */
@media (prefers-reduced-motion:no-preference){
  html.js:not(.is-ready) .hero .enter,html.js:not(.is-ready) .pun{opacity:0}
  html.is-ready .hero__top .enter{animation:fadeIn 520ms var(--ease) both;animation-delay:calc(140ms + var(--i,0) * 90ms)}
  html.is-ready .proof{animation:wipeUp 720ms var(--expo) 60ms both}
  html.is-ready .pl__rule{animation:lineDraw 760ms var(--expo) both;animation-delay:calc(200ms + var(--i) * 70ms)}
  html.is-ready .pl__lab{animation:fadeIn 380ms var(--ease) both;animation-delay:calc(560ms + var(--i) * 70ms)}
  html.is-ready .adv{animation:fadeIn 380ms var(--ease) 940ms both}
  html.is-ready .pw .g{animation:glyphRise 820ms var(--expo) both;animation-delay:calc(380ms + var(--i) * 50ms)}
  html.is-ready .pun__lead{animation:lineDraw 640ms var(--expo) 1060ms both}
  html.is-ready .pun__txt,html.is-ready .pun::after{animation:fadeIn 420ms var(--ease) 1260ms both}
}
@keyframes wipeUp{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes lineDraw{from{transform:scaleX(0)}to{transform:none}}
@keyframes glyphRise{from{transform:translateY(.46em)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---------- shared specimen parts ---------- */
.spec__dl{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:18px;row-gap:6px}
.spec__dl dt{font:500 12px/1.5 var(--f-ui);opacity:.78}
.spec__dl dd{font:600 12px/1.5 var(--f-ui)}
.seg{display:inline-flex;border:1.5px solid currentColor}
.seg button{min-width:104px;height:40px;padding:0 16px;font:600 12px/1 var(--f-ui);letter-spacing:.01em;border-left:1.5px solid currentColor;transition:background-color 150ms var(--ease),color 150ms var(--ease)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:currentColor}
.seg button[aria-pressed="true"] span{color:var(--seg-on,var(--paper))}
.seg button:not([aria-pressed="true"]):hover{background:rgba(11,11,11,.08)}
.on-dark .seg button:not([aria-pressed="true"]):hover{background:rgba(255,255,255,.14)}
.band--butter .seg{--seg-on:var(--butter)}
.band--mint .seg{--seg-on:var(--mint)}
.band--ultra .seg{--seg-on:var(--ultra)}
.band--verm .seg{--seg-on:var(--verm)}
.bl{display:inline-block;width:0;height:0;vertical-align:baseline}

/* ---------- specimen band 1: Rueang Sans, the hairline name band ---------- */
.spec{--hs:clamp(92px,14.6vw,212px);--ds:clamp(150px,23.4vw,340px);display:flex;flex-direction:column}
.spec .cut{color:currentColor}
.spec__info{position:relative;z-index:2;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;row-gap:22px;padding:30px var(--gut) 0;align-items:start}
.spec__desc{grid-column:1 / span 5;font:400 18px/1.6 var(--f-body);max-width:34em;text-wrap:pretty}
.spec__info .spec__dl{grid-column:7 / span 3}
.spec__ctl{grid-column:10 / span 3;justify-self:end}
.stage{position:relative;z-index:1;pointer-events:none;font-size:var(--ds);height:var(--sh,1em);flex:none;margin-top:var(--st,26px);transition:height 300ms var(--ease)}
.spec.is-both .stage{height:var(--shb,1.42em)}
.layer{position:absolute;left:var(--gut);top:calc(var(--bl,1.055em) - 1.0555em);white-space:nowrap;line-height:1.5;font-family:var(--f-thai);font-weight:var(--w,900);font-stretch:var(--wd,100%);transition:opacity 120ms linear,visibility 0s linear 0s}
.layer--loop{font-family:var(--f-loop);top:calc(var(--bl,1.055em) - 1.2em)}
.layer[data-on="false"]{opacity:0;visibility:hidden;transition:opacity 120ms linear,visibility 0s linear 120ms}
.layer--both{top:0;display:flex;flex-direction:column;font-size:.46em}
.both-row{display:flex;align-items:baseline;gap:.35em;line-height:1.5}
.both-row .ui{font-size:12px;width:76px;flex:none;transform:translateY(-.2em)}
.both-row .th{font-family:var(--f-thai)}
.both-row .lo{font-family:var(--f-loop)}

/* ---------- specimen band 2: Rueang Loop, a 9 pt book-page proof ----------
   The page is set at true text size (12px = 9 pt on 20px = 15 pt). Each callout letter ends its
   paragraph inside a nowrap span, so its leader drops into the gap under that paragraph and leaves the
   page without crossing a line of text, then runs down into the loop of the enlarged letter. */
.fam-page{padding:clamp(48px,5.5vw,84px) var(--gut) clamp(64px,7vw,104px)}
.pp{position:relative;display:grid;grid-template-columns:minmax(0,528px) minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:clamp(40px,6.4vw,112px)}
.pp__sheet{grid-column:1;grid-row:1 / span 2;position:relative;align-self:start;padding:14px;--cm:rgba(255,255,255,.85);background:
  linear-gradient(var(--cm),var(--cm)) 0 14px/9px 1px no-repeat,linear-gradient(var(--cm),var(--cm)) 14px 0/1px 9px no-repeat,
  linear-gradient(var(--cm),var(--cm)) 100% 14px/9px 1px no-repeat,linear-gradient(var(--cm),var(--cm)) calc(100% - 14px) 0/1px 9px no-repeat,
  linear-gradient(var(--cm),var(--cm)) 0 calc(100% - 14px)/9px 1px no-repeat,linear-gradient(var(--cm),var(--cm)) 14px 100%/1px 9px no-repeat,
  linear-gradient(var(--cm),var(--cm)) 100% calc(100% - 14px)/9px 1px no-repeat,linear-gradient(var(--cm),var(--cm)) calc(100% - 14px) 100%/1px 9px no-repeat}
.pp__page{position:relative;margin:0;border:1px solid rgba(255,255,255,.5);padding:var(--sink,236px) 46px 80px 54px;font-family:var(--f-loop);font-weight:400;font-size:12px;line-height:1.65;transition:opacity 60ms linear}
.pp[data-mode="loopless"] .pp__page{font-family:var(--f-thai)}
.pp__chap{font-size:12px}
.pp__title{margin:2px 0 26px;font-family:inherit;font-weight:600;font-size:24px;line-height:1.5}
.pp__text p{text-wrap:pretty}
.pp__text p + p{margin-top:10px}
.pp__folio{position:absolute;left:0;right:0;bottom:34px;text-align:center}
.lp-t{padding:0 .1em}
.pp__info{grid-column:2;grid-row:1;display:grid;row-gap:20px;justify-items:start;align-content:start;min-width:0}
.pp__name{font:200 clamp(56px,5.2vw,80px)/1 var(--f-hair);margin:-6px 0 0}
.pp__slug{font:500 12px/1.5 var(--f-ui);margin-top:-12px;color:rgba(255,255,255,.88)}
.pp__desc{font:400 18px/1.6 var(--f-body);max-width:32em;text-wrap:pretty}
/* the enlarged letters stand on the page's bottom edge; their captions hang below them */
.pp__zoom{grid-column:2;grid-row:2;align-self:end;display:flex;justify-content:space-around;align-items:flex-start;gap:24px;margin-top:48px;--zf:clamp(140px,22.5vw,330px);transition:opacity 60ms linear}
.zg{position:relative;display:grid;justify-items:start;row-gap:10px;min-width:0}
.zg__pair{display:flex;align-items:flex-end;gap:.18em;font-size:var(--zf);line-height:1.35;margin:-.42em 0 -.12em}
.pp[data-mode="both"] .zg__pair{font-size:calc(var(--zf) * .62)}
.zg__g{display:block;font-weight:400}
.zg__g--loop{font-family:var(--f-loop)}
.zg__g--flat{font-family:var(--f-thai)}
.pp[data-mode="looped"] .zg__g--flat,.pp[data-mode="loopless"] .zg__g--loop{display:none}
.zg__cap{display:grid;row-gap:2px;font:400 15px/1.5 var(--f-body);width:max-content;max-width:16em}
@media (min-width:861px){.zg__cap{position:absolute;left:0;top:100%;margin-top:14px}}
.zg__cap b{font-weight:600}
.zg__cap [data-m]{display:none}
.pp[data-mode="looped"] .zg__cap [data-m="looped"],.pp[data-mode="loopless"] .zg__cap [data-m="loopless"],.pp[data-mode="both"] .zg__cap [data-m="both"]{display:block}
.pp__svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;transition:opacity 60ms linear}
.pp__svg circle,.pp__svg path{fill:none}
.pp__svg .ld{stroke:#fff;stroke-width:1.25;stroke-dasharray:1;stroke-dashoffset:0;transition:stroke-dashoffset 1200ms var(--expo)}
.pp__svg .ld--t{stroke-width:1}
.pp__svg .ld-h{stroke:var(--ultra);stroke-width:6;transition:opacity 400ms linear}
.pp:not(.is-in) .pp__svg .ld{stroke-dashoffset:1}
.pp:not(.is-in) .pp__svg .ld-h{opacity:0}
.pp.is-swap .pp__page,.pp.is-swap .pp__zoom,.pp.is-swap .pp__svg{opacity:0}

/* ---------- specimen band 3: Rueang Display, a condensed poster lock-up ----------
   Each locked line is sized from its own measured em width, so the lock-up holds one measure
   (100cqw): the two big lines share a size, the small lines fill the gap beside วันนี้. */
.fam-poster{padding:clamp(56px,6vw,88px) var(--gut) clamp(64px,7vw,104px)}
.ps{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;row-gap:40px;align-items:start}
.ps__stage{grid-column:1 / span 7;display:grid;grid-template-columns:minmax(0,1fr);column-gap:clamp(20px,3vw,44px);transition:opacity 60ms linear}
.ps[data-mode="both"] .ps__stage{grid-template-columns:repeat(2,minmax(0,1fr))}
.ps[data-mode="loopless"] .lk--loop,.ps[data-mode="looped"] .lk--flat{display:none}
.ps.is-swap .ps__stage{opacity:0}
.ps__info{grid-column:9 / span 4;align-self:end;display:grid;row-gap:22px;justify-items:start}
.ps__desc{font:400 18px/1.6 var(--f-body);text-wrap:pretty}
.ps__shop{font:600 12px/1.5 var(--f-ui)}
.lk{container-type:inline-size;min-width:0;--u:calc(100cqw / var(--ka,2.922))}
.lk p{white-space:nowrap}
.lk--flat{font-family:var(--f-thai)}
.lk--loop{font-family:var(--f-loop)}
.lk__tag{display:none;margin-bottom:12px}
.ps[data-mode="both"] .lk__tag{display:block}
.lk__top{font-weight:600;font-stretch:62.5%;font-size:calc(100cqw / var(--kt,13.6));line-height:1.5}
.lk__big{font-weight:900;font-stretch:62.5%;font-size:var(--u);line-height:1.35}
.lk__row{display:flex;align-items:last baseline;column-gap:calc(var(--u) * .1)}
.lk__tuck{flex:1;min-width:0;font-weight:700;font-stretch:62.5%;font-size:calc(var(--u) * .13);line-height:1.4}
.lk__b{flex:none}
/* the rule sits a fifth of an em under วันนี้'s baseline (it has no descenders): the two faces put the
   baseline at different depths of the 1.35 line box, so each gets its own pull-up */
.lk__rule{height:max(3px,calc(var(--u) * .045));background:currentColor;margin:calc(var(--u) * -.17) 0 calc(var(--u) * .09)}
.lk--loop .lk__rule{margin-top:calc(var(--u) * -.03)}
.lk__lat{font:800 calc(100cqw / var(--kl,5.3))/.86 var(--f-hair);text-transform:uppercase}

/* ---------- weight scrub ---------- */
.scrub{height:320vh}
.scrub__pin{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;padding:28px var(--gut) 30px}
.scrub__head{display:flex;justify-content:space-between;gap:32px;align-items:start}
.scrub__note{font:400 18px/1.6 var(--f-body);max-width:31em;color:rgba(255,255,255,.86);text-wrap:pretty}
.scrub__word{align-self:center;justify-self:center;font:100 min(25vw,44svh)/1.5 var(--f-thai);white-space:nowrap;margin:0;font-weight:100}
.scrub__foot{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(20px,4vw,64px);align-items:end}
.readout{display:flex;align-items:baseline;gap:12px}
.readout b{font:100 clamp(84px,10vw,150px)/.8 var(--f-hair);font-variant-numeric:tabular-nums;min-width:2.1ch;display:inline-block;letter-spacing:-.01em}
.ruler{position:relative;padding-bottom:22px}
.ruler__track{position:relative;height:28px;border-bottom:1px solid #fff}
.ruler__tick{position:absolute;bottom:0;width:1px;height:12px;background:#fff}
.ruler__tick span{position:absolute;top:18px;left:0;transform:translateX(-50%);font:500 12px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.ruler__mark{position:absolute;left:0;bottom:-6px;width:3px;height:40px;background:var(--verm);margin-left:-1px;will-change:transform}

/* ---------- tester ---------- */
.sec-head{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;row-gap:14px;padding:clamp(64px,8vw,112px) var(--gut) clamp(28px,3vw,40px);align-items:end}
.sec-head h2{grid-column:1 / span 6;font:800 clamp(36px,3.9vw,56px)/1.5 var(--f-thai);text-wrap:balance}
.sec-head p{grid-column:8 / span 5;font:400 18px/1.6 var(--f-body);max-width:34em;text-wrap:pretty}
.strip{margin:0 var(--gut);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.3fr) auto auto;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.ctl{display:flex;align-items:center;gap:16px;min-height:56px;padding:0 20px;border-left:1px solid var(--ink)}
.ctl:first-child{border-left:0;padding-left:0}
.ctl > span{font:600 12px/1 var(--f-ui);flex:none;width:52px}
.ctl output{font:500 12px/1 var(--f-ui);font-variant-numeric:tabular-nums;width:46px;text-align:right;flex:none}
.ctl input[type=range]{flex:1;min-width:0}
.ctl--reset{font:600 12px/1 var(--f-ui);padding:0 4px 0 20px;justify-content:center;transition:color 150ms var(--ease)}
.ctl--reset:hover{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
input[type=range]{-webkit-appearance:none;appearance:none;height:28px;background:transparent;cursor:pointer;accent-color:var(--ink)}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-7.5px;border-radius:50%;background:var(--ink);transition:transform 150ms var(--ease)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25)}
input[type=range]::-moz-range-track{height:1px;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--ink)}
.toggle{position:relative;width:44px;height:24px;border:1.5px solid var(--ink);border-radius:12px;flex:none;transition:background-color 150ms var(--ease)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:var(--ink);transition:transform 180ms var(--ease),background-color 150ms var(--ease)}
.toggle[aria-checked="true"]{background:var(--ink)}
.toggle[aria-checked="true"]::after{transform:translateX(20px);background:var(--paper)}
.tester__text{margin:0 var(--gut);padding:clamp(28px,3vw,44px) 0 clamp(56px,6vw,88px);font-family:var(--f-thai);font-weight:600;font-size:72px;line-height:1.5;caret-color:var(--verm);outline:none;text-wrap:pretty;transition:opacity 60ms linear;min-height:2.5em;overflow-wrap:anywhere}
.tester__text:focus-visible{box-shadow:inset 0 -2px 0 var(--ultra)}
.tester__text.is-swap{opacity:0}

/* ---------- notes + events ---------- */
.thoughts .sec-head{padding-top:clamp(56px,6vw,88px)}
.thoughts .seg-wrap{grid-column:8 / span 5;justify-self:end}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:0 var(--gut) clamp(72px,8vw,120px)}
.card{position:relative;display:flex;flex-direction:column;min-height:520px;padding:22px;border-radius:16px;overflow:hidden;min-width:0}
.card[hidden]{display:none}
.card--ultra{background:var(--ultra);color:#fff}
.card--ink{background:var(--ink);color:#fff}
.card--verm{background:var(--verm);color:var(--ink)}
.card--mint{background:var(--mint);color:var(--ink)}
.card--butter{background:var(--butter);color:var(--ink)}
.card--paper{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.card h3{font:700 clamp(21px,1.7vw,24px)/1.5 var(--f-thai);text-wrap:balance;max-width:19em}
.card h3 a{text-decoration:none}
.card h3 a::after{content:"";position:absolute;inset:0;border-radius:16px;z-index:2}
.card h3 a:focus-visible{outline:none}
.card:has(h3 a:focus-visible){outline:2px solid var(--ultra);outline-offset:3px}
.card__by{display:flex;justify-content:space-between;gap:16px;margin-top:10px}
.card__by span:first-child{font-weight:600}
.poster{position:relative;flex:1;margin:22px -22px -22px;min-height:290px;overflow:hidden;display:grid;place-items:center;pointer-events:none;container-type:inline-size}

/* poster: outline to solid (tone marks over an ascender) */
.pz-tones{display:grid;grid-template-columns:repeat(2,auto);column-gap:.3em;font:800 clamp(62px,6vw,88px)/1.5 var(--f-thai)}
/* outline = a 2px stroke painted under a fill in the card colour: only the outer 1px shows, so
   overlapping contours inside variable glyphs never draw and the gap between a left-shifted tone
   mark and the ascender of ป stays open. Solid = the stroke goes transparent, so the solid glyph is
   the font's own shape (no fused marks, the mai tri counter stays open). */
.pz-tones span{color:var(--ultra);-webkit-text-stroke:2px #fff;paint-order:stroke fill;transition:color 260ms var(--ease),-webkit-text-stroke-color 260ms var(--ease);transition-delay:0ms}
.pz-tones span.is-solid{color:#fff;-webkit-text-stroke-color:transparent}
.card:hover .pz-tones span,.card:focus-within .pz-tones span{color:#fff;-webkit-text-stroke-color:transparent;transition-delay:calc(var(--i) * 80ms)}
/* poster: two dozen pencil drafts of one letter resolve into the ร that shipped */
.pz-rs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));width:100%;padding:0 22px 26px;font-family:var(--f-thai);font-size:clamp(40px,3.6vw,52px);line-height:1.35;text-align:center;color:#fff}
.pz-rs span{font-weight:var(--w);font-stretch:var(--wd);transition:font-weight 560ms var(--ease),font-stretch 560ms var(--ease);transition-delay:0ms}
.pz-rs span.is-pick{color:var(--verm)}
.card:hover .pz-rs span,.card:focus-within .pz-rs span{font-weight:900;font-stretch:100%;transition-delay:calc(var(--i) * 22ms)}
/* poster: looped vs loopless */
.pz-loops{display:grid;place-items:center}
.pz-loops > *{grid-area:1 / 1}
.pz-loops .lp{font:800 clamp(150px,13vw,200px)/1.5 var(--f-loop);transition:opacity 220ms var(--ease)}
.pz-loops .lp--flat{font-family:var(--f-thai);opacity:0}
.card:hover .lp--loop,.card:focus-within .lp--loop{opacity:0}
.card:hover .lp--flat,.card:focus-within .lp--flat{opacity:1}
.pz-cap{position:absolute;left:22px;bottom:18px;display:grid}
.pz-cap > *{grid-area:1 / 1;transition:opacity 220ms var(--ease)}
.pz-cap .b{opacity:0}
.card:hover .pz-cap .a,.card:focus-within .pz-cap .a{opacity:0}
.card:hover .pz-cap .b,.card:focus-within .pz-cap .b{opacity:1}
/* poster: Thai numerals as a weight ramp */
.pz-nums{display:grid;grid-template-columns:repeat(3,1fr);column-gap:.32em;font:100 clamp(56px,5.2vw,78px)/1.35 var(--f-thai);font-variant-numeric:tabular-nums}
.pz-nums span{font-weight:var(--w);text-align:center;transition:font-weight 520ms var(--ease);transition-delay:calc(var(--i) * 45ms)}
.card:hover .pz-nums span,.card:focus-within .pz-nums span{font-weight:calc(1000 - var(--w))}
/* poster: sister scripts */
.pz-sis{display:grid;gap:0;justify-items:center}
.pz-sis .t,.pz-sis .l{font-size:clamp(58px,5.4vw,80px);line-height:1.5;font-weight:800;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;transition:color 240ms var(--ease)}
.pz-sis .t{font-family:var(--f-thai);color:var(--ink)}
.pz-sis .l{font-family:var(--f-lao);color:var(--butter)}
.card:hover .pz-sis .t,.card:focus-within .pz-sis .t{color:var(--butter)}
.card:hover .pz-sis .l,.card:focus-within .pz-sis .l{color:var(--ink)}
/* poster: width axis. The size is capped so the word at full width (the hover state) ends exactly at
   the card padding: --kw is the word's measured em width at font-stretch 100%. */
.pz-width{display:grid;justify-items:start;padding:0 22px;width:100%}
.pz-width b{font:900 min(clamp(74px,6.6vw,104px),calc((100cqw - 44px) / var(--kw,4.6)))/1.5 var(--f-thai);font-stretch:62.5%;transition:font-stretch 640ms var(--ease);white-space:nowrap}
.card:hover .pz-width b,.card:focus-within .pz-width b{font-stretch:100%}
.pz-width i{font-style:normal}

/* ---------- custom work ---------- */
.custom .sec-head p a{font:600 12px/1.6 var(--f-ui);display:inline-block;margin-top:14px}
.rows{margin:0 var(--gut);border-top:1px solid var(--ink)}
.rows__head,.row a{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(0,1.3fr) minmax(0,1.4fr) minmax(0,1.4fr) minmax(0,.5fr) minmax(0,1fr);column-gap:20px;align-items:baseline}
.rows__head{padding:12px 0;border-bottom:1px solid var(--ink)}
.row{border-bottom:1px solid var(--ink)}
.row a{position:relative;text-decoration:none;padding:14px 0}
.row a::before{content:"";position:absolute;inset:0 calc(var(--gut) * -1);background:var(--paper);opacity:0;transition:opacity 160ms var(--ease);z-index:-1}
.row a:hover::before,.row a:focus-visible::before{opacity:1}
.row a:focus-visible{outline:none}
.row{position:relative;z-index:0}
.row__th{font:800 clamp(30px,3.1vw,46px)/1.5 var(--f-thai);white-space:nowrap;transition:font-weight 240ms var(--ease)}
.row__th.lao{font-family:var(--f-lao)}
.row a:hover .row__th,.row a:focus-visible .row__th{font-weight:300}
.row .ui-500,.rows__head .ui-500{font-size:13px}
.row__year{font-variant-numeric:tabular-nums}
.custom__foot{height:clamp(64px,7vw,104px)}

/* ---------- licensing ---------- */
.lic-wrap{padding:0 var(--gut) clamp(72px,8vw,120px)}
.lic{width:100%;border-collapse:collapse}
.lic th,.lic td{text-align:left;vertical-align:baseline;border-bottom:1px solid var(--ink);padding:18px 20px 18px 0}
.lic thead th{font:600 12px/1.4 var(--f-ui);padding-top:12px;padding-bottom:12px;border-top:1px solid var(--ink)}
.lic tbody th{font:300 clamp(34px,3.4vw,50px)/1.1 var(--f-hair);letter-spacing:.005em;white-space:nowrap}
.lic td{font:400 16px/1.6 var(--f-body)}
.lic .num{text-align:right;font:500 18px/1.6 var(--f-ui);font-variant-numeric:tabular-nums lining-nums;white-space:nowrap;padding-right:0}
.lic thead .num{font:600 12px/1.4 var(--f-ui)}
.lic td.lim{font:500 14px/1.6 var(--f-body)}

/* ---------- footer ---------- */
.foot{padding-top:clamp(56px,6vw,88px)}
.foot__cols{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;row-gap:36px;padding:0 var(--gut) clamp(40px,4vw,64px)}
.foot__col{grid-column:span 3;min-width:0}
.foot__col h2{font:600 12px/1.4 var(--f-ui);margin-bottom:12px;color:rgba(255,255,255,.78)}
.foot__col p,.foot__col li{font:400 16px/1.6 var(--f-body);color:#fff}
.foot__col a{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5)}
.foot__col a:hover{text-decoration-color:#fff}
.foot__colophon{grid-column:1 / -1;font:400 15px/1.6 var(--f-body);color:rgba(255,255,255,.8);max-width:62em;padding-top:22px;border-top:1px solid rgba(255,255,255,.4);text-wrap:pretty}
/* footer bookend: the name itself on the hero's guide lines. เรือง has no tone mark, so the top line
   stays empty (the hero's เรื่อง is the same word plus one mai ek); the crop is the baseline. */
.foot__proof{--fs:clamp(220px,40vw,600px);position:relative;height:calc(var(--fs) * var(--yb,1.056));overflow:hidden;color:#fff}
.foot__proof .pl__lab{left:auto;right:var(--gut);color:rgba(255,255,255,.84)}
.foot__mark{position:absolute;left:calc(var(--gut) - .03em);top:calc(var(--fs) * var(--wt,0));margin:0;font:900 var(--fs)/1.5 var(--f-thai);white-space:nowrap;color:#fff}

/* ---------- responsive ---------- */
@media (max-width:1200px){
  .hero__cap{display:none}
}
@media (max-width:1100px){
  .spec__desc{grid-column:1 / span 6}
  .spec__info .spec__dl{grid-column:7 / span 6}
  .spec__ctl{grid-column:1 / -1;justify-self:start}
  .pp{grid-template-columns:minmax(0,440px) minmax(0,1fr)}
  .ps__stage{grid-column:1 / span 8}
  .ps__info{grid-column:9 / span 4}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rows__head,.row a{grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) minmax(0,1.4fr) minmax(0,.6fr) minmax(0,1fr)}
  .rows__head .c-sector,.row .c-sector{display:none}
  .foot__col{grid-column:span 6}
}
@media (max-width:860px){
  .nav__links{display:none}
  .menu-btn{display:flex;align-items:center;gap:8px}
  .pp{grid-template-columns:minmax(0,1fr);grid-template-rows:none;row-gap:40px}
  .pp__sheet,.pp__info,.pp__zoom{grid-column:1;grid-row:auto}
  .pp__sheet{max-width:528px}
  .pp__zoom{order:2;margin-top:0;justify-content:flex-start;column-gap:clamp(32px,8vw,72px)}
  .pp__info{order:3}
  .ps__stage,.ps__info{grid-column:1 / -1}
}
@media (max-width:760px){
  :root{--nav-h:56px;--hs:38vw}
  .hair{--hp-t:12px;--hp-b:18px}
  .spec .hair{--hp-b:0px}
  .brand__th{font-size:22px}
  .search{left:var(--gut);right:96px;width:auto;transform:none}
  .hero{height:100vh;height:100svh;min-height:600px;--fs:min(calc(100cqw * .84),calc((100svh - var(--nav-h) - 330px) / var(--span,1.317)))}
  .hero__top{height:auto;flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);align-content:end;row-gap:14px;padding:16px var(--gut) 18px}
  .hero__h1{font-size:25px;white-space:normal}
  .hero__side{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:0}
  .hero__cap{display:block;text-align:left}
  .hero__seg{display:flex}
  .hero__seg button{flex:1;min-width:0;height:44px}
  /* the pun leaves the band on a phone: it sits just above the proof and drops a hairline onto the mark */
  .pun{order:2;position:relative;left:auto;top:auto;transform:none;display:block;margin:0 var(--gut) 28px;white-space:normal;font-size:15px;line-height:1.6}
  .pun__lead{display:none}
  .pun::after{content:"";position:absolute;left:calc(var(--fs) * var(--mcx,.7375));top:calc(100% + 6px);width:1px;height:22px;background:currentColor}
  .proof{order:3;background:var(--mint)}
  .pl{height:1.5px;margin-top:-.75px}
  .pl__lab{font-size:10px;gap:7px}
  .adv,.foot__proof .pl__lab{display:none}
  .spec{--hs:31vw;--ds:46vw}
  .spec__info{grid-template-columns:minmax(0,1fr);padding-top:22px}
  .spec__desc,.spec__info .spec__dl,.spec__ctl{grid-column:1 / -1}
  .spec__ctl{justify-self:stretch}
  .spec__ctl .seg,.pp__info .seg,.ps__info .seg{display:flex;width:100%}
  .spec__ctl .seg button,.pp__info .seg button,.ps__info .seg button{flex:1;min-width:0;height:44px}
  .pp__info,.ps__info{justify-items:stretch}
  .both-row .ui{width:58px;font-size:11px}
  .pp__page{padding:var(--sink-m,120px) 22px 66px 24px}
  .pp__title{font-size:22px;margin-bottom:20px}
  .pp__zoom{--zf:36vw;justify-content:space-between}
  .zg__cap{font-size:14px}
  .scrub__head{flex-direction:column;gap:10px}
  .scrub__word{font-size:25.5vw}
  .scrub__foot{grid-template-columns:minmax(0,1fr)}
  .ruler__tick:nth-child(even) span{display:none}
  .sec-head{grid-template-columns:minmax(0,1fr)}
  .sec-head h2,.sec-head p,.thoughts .seg-wrap{grid-column:1 / -1;justify-self:start}
  .strip{grid-template-columns:minmax(0,1fr) auto}
  .ctl{border-left:0;padding:0;border-bottom:1px solid var(--ink)}
  .strip .ctl:nth-child(1),.strip .ctl:nth-child(2){grid-column:1 / -1}
  .strip .ctl--toggle{border-bottom:0}
  .ctl--reset{border-bottom:0;padding:0 0 0 16px;border-left:1px solid var(--ink)}
  .tester__text{font-size:44px}
  .grid{grid-template-columns:minmax(0,1fr)}
  .card{min-height:480px}
  .thoughts .seg button{min-width:0;padding:0 14px;height:44px}
  .rows__head{display:none}
  .row a{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}
  .row__th{grid-column:1 / -1}
  .row .c-face{grid-column:1}
  .row .c-year{grid-column:2;grid-row:2;text-align:right}
  .row .c-client,.row .c-scripts{grid-column:1 / -1}
  .row .c-sector{display:none}
  .lic thead{display:none}
  .lic,.lic tbody,.lic tr,.lic th,.lic td{display:block;width:100%}
  .lic tr{border-top:1px solid var(--ink);padding:16px 0 18px}
  .lic tbody tr:last-child{border-bottom:1px solid var(--ink)}
  .lic th,.lic td{border:0;padding:0}
  .lic td{margin-top:6px}
  .lic .num{text-align:left;display:flex;justify-content:space-between}
  .lic .num::before{content:attr(data-label);font:500 13px/1.6 var(--f-ui)}
  .foot__col{grid-column:1 / -1}
}
@media (prefers-reduced-motion:reduce){
  .hair__strip{animation:none}
  .scrub{height:auto}
  .scrub__pin{position:relative;height:100svh;min-height:620px}
  *,*::before,*::after{transition-duration:0ms!important;transition-delay:0ms!important}
  .layer,.tester__text{transition:none!important}
}
</style>

/* =====================================================================
   RENDER
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const graphemes = (s) => {
  try { return Array.from(new Intl.Segmenter("th", { granularity: "grapheme" }).segment(s), x => x.segment); }
  catch (e) { return [s]; }
};
/* Thai copy: {compound} -> nowrap span, **x** -> bold, | -> <wbr>; plain() strips every mark */
const rich = (s) => esc(s).replace(/\{([^}]+)\}/g, '<span class="nw">$1</span>').replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\|/g, "<wbr>");
const plain = (s) => String(s).replace(/\[([^\]]+)\]/g, "$1").replace(/[{}|*]/g, "");
const hair = (name, cls = "", dur = 150) =>
  `<div class="hair ${cls}" aria-hidden="true" style="--dur:${dur}s"><div class="hair__move"><div class="hair__strip">${
    Array(4).fill(`<span>${esc(name)}</span>`).join("")}</div></div></div>`;
const searchSvg = `<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6.25" stroke="currentColor" stroke-width="1.75"/><path d="M13.2 13.2 18 18" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>`;

/* proof geometry: the loopless face defines the frame (tone-mark line to lower-vowel line);
   any other face is scaled to fit the same frame, so the band edges stay on guide lines */
function proofGeom(face) {
  const M = DATA.hero.metrics, m = M[face], f = M.loopless;
  const span0 = f.tone + f.lower, s = span0 / (m.tone + m.lower);
  return {
    s, span: span0 / 1000, ext: f.ext,
    y: { tone: 0, upper: s * (m.tone - m.upper) / 1000, x: s * (m.tone - m.x) / 1000, base: s * m.tone / 1000, lower: span0 / 1000 },
    wt: s * (m.tone - m.base) / 1000,
    v: { tone: m.tone, upper: m.upper, x: m.x, base: 0, lower: -m.lower }
  };
}
const unitsTxt = (v) => (v < 0 ? "−" : "") + Math.abs(Math.round(v));
function proofWord(face, on) {
  const H = DATA.hero, g = proofGeom(face), m = H.metrics[face];
  let i = 0;
  const run = (txt, cls, w, adv) => `<span class="${cls}">${graphemes(txt).map(c => `<span class="g" style="--i:${i++}">${c}</span>`).join("")}<i class="adv"><span class="adv__in"><span>wght ${w}</span><b data-adv="${cls}">advance ${adv}</b></span></i></span>`;
  return `<p class="pw pw--${face === "looped" ? "loop" : "flat"}" lang="th" data-face="${face}" data-on="${on}" style="--s:${g.s.toFixed(4)};--wt:${g.wt.toFixed(4)};--bo:${(m.base / 1000).toFixed(4)};--lo:${(m.lower / 1000).toFixed(4)};--a9:${(m.adv9 / 1000).toFixed(4)}">${run(H.word, "b", 900, m.adv9)}${run(H.tail, "t", 100, m.adv1)}</p>`;
}

function renderHeader() {
  const D = DATA, H = D.hero, g = proofGeom("loopless");
  const navItem = (n) => `<a href="${n.href}"${n.filter ? ` data-filter="${n.filter}"` : ""}><span class="th" lang="th">${esc(n.th)}</span><span class="en">${esc(n.en)}</span></a>`;
  const lines = H.lines.map(([k, name, pos], i) => `
      <div class="pl pl--${k} pl--${pos}${k === "lower" ? " pl--end" : ""}" data-k="${k}" style="--i:${i};--y:${g.y[k].toFixed(4)}"><span class="pl__rule"></span><span class="pl__lab"><span>${esc(name)}</span><b>${unitsTxt(g.v[k])}</b></span></div>`).join("");
  $("#top").innerHTML = `

/* band 1: the hairline name runs off both edges, the sample word is cropped by the band */

/* =====================================================================
   BEHAVIOUR
   ===================================================================== */
const root = document.documentElement;
const mqReduce = matchMedia("(prefers-reduced-motion: reduce)");
const mqSmall = matchMedia("(max-width: 760px)");
const mqStack = matchMedia("(max-width: 860px)");   /* the book page stacks over its callouts: rings, no leaders */
let reduce = mqReduce.matches;
const rafThrottle = (fn) => { let q = false; return () => { if (q) return; q = true; requestAnimationFrame(() => { q = false; fn(); }); }; };

/* em width of a string in a given font, measured off screen (works for hidden elements too) */
const probe = document.createElement("span");
probe.setAttribute("aria-hidden", "true");
document.body.appendChild(probe);
function emWidth(html, css) {
  probe.style.cssText = `position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap;line-height:1;${css};font-size:100px`;
  probe.innerHTML = html;
  return probe.getBoundingClientRect().width / 100;
}

/* ---------- the proof: guide lines measured from the loaded fonts, and the face switch ---------- */
const heroEl = $(".hero"), proof = $(".proof");
let proofFace = "loopless";
/* the mai ek's own ink box: draw the cluster with the mark, erase the same cluster without it */
function markBox(fam) {
  const H = DATA.hero, S = 300, cw = S * 3, ch = S * 2, x0 = S * .25, y0 = S * 1.5;
  const cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
  const g = cv.getContext("2d", { willReadFrequently: true });
  if (!g) return null;
  g.font = `900 ${S}px ${fam}`; g.textBaseline = "alphabetic"; g.fillStyle = "#000";
  g.fillText(H.mark.with, x0, y0);
  g.globalCompositeOperation = "destination-out";
  g.fillText(H.mark.without, x0, y0);
  const d = g.getImageData(0, 0, cw, ch).data;
  let x1 = cw, x2 = -1, y1 = ch, y2 = -1;
  for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) if (d[(y * cw + x) * 4 + 3] > 160) {
    if (x < x1) x1 = x; if (x > x2) x2 = x; if (y < y1) y1 = y; if (y > y2) y2 = y;
  }
  if (x2 < 0) return null;
  const u = (v) => Math.round(v / S * 1000);
  const box = { l: u(x1 - x0), r: u(x2 + 1 - x0), t: u(y0 - y1), b: u(y0 - y2 - 1) };
  return box.r > box.l && box.t > box.b ? box : null;
}
/* canvas TextMetrics give the true ink heights; a zero-size inline-block gives the baseline offset */
function measureFace(face) {
  const H = DATA.hero, fam = H.faces[face].family;
  const c = measureFace.c || (measureFace.c = document.createElement("canvas").getContext("2d"));
  c.font = `900 1000px ${fam}`;
  const asc = (s) => c.measureText(s).actualBoundingBoxAscent;
  const m = { tone: asc("บี่"), upper: asc("บี"), x: asc("บน"), lower: c.measureText("บุ").actualBoundingBoxDescent };
  m.adv9 = c.measureText(H.word).width;
  c.font = `100 1000px ${fam}`;
  m.adv1 = c.measureText(H.tail).width;
  m.ext = (m.adv9 + c.measureText(H.tail).actualBoundingBoxRight) / 1000 + .02;
  const d = document.createElement("div");
  d.style.cssText = `position:absolute;left:0;top:0;width:0;overflow:hidden;visibility:hidden;white-space:nowrap;font:900 1000px/1.5 ${fam}`;
  d.innerHTML = 'บ<i style="display:inline-block;width:0;height:0;vertical-align:baseline"></i>';
  document.body.appendChild(d);
  m.base = d.lastChild.getBoundingClientRect().top - d.getBoundingClientRect().top;
  d.remove();
  for (const k in m) m[k] = k === "ext" ? Math.round(m[k] * 100) / 100 : Math.round(m[k]);
  if (!(m.tone > m.upper && m.upper > m.x && m.x > 0 && m.lower > 0 && m.ext > 1)) return null;
  const mk = markBox(fam);
  if (mk) m.mark = mk;
  return m;
}
/* the thin tail runs off the band; when too little of it is left for its label, drop the label */
function tailCheck() {
  const t = $(`.pw[data-face="${proofFace}"] .t`, proof);
  if (!t) return;
  proof.classList.toggle("is-tail-cut", proof.getBoundingClientRect().right - t.getBoundingClientRect().left < 170);
}
function applyProof() {
  const M = DATA.hero.metrics, g0 = proofGeom("loopless"), g = proofGeom(proofFace), mk = M[proofFace].mark;
  heroEl.style.setProperty("--span", g0.span.toFixed(4));
  heroEl.style.setProperty("--extb", (M.loopless.adv9 / 1000 + .02).toFixed(4));
  /* the pun's anchor: the mai ek's right edge and vertical centre, in proof ems */
  heroEl.style.setProperty("--mx", (g.s * mk.r / 1000).toFixed(4));
  heroEl.style.setProperty("--my", (g.y.base - g.s * (mk.t + mk.b) / 2000).toFixed(4));
  heroEl.style.setProperty("--mcx", (g.s * (mk.l + mk.r) / 2000).toFixed(4));
  $$(".pw", proof).forEach(p => {
    const gp = proofGeom(p.dataset.face), mp = M[p.dataset.face];
    p.style.setProperty("--s", gp.s.toFixed(4));
    p.style.setProperty("--wt", gp.wt.toFixed(4));
    p.style.setProperty("--bo", (mp.base / 1000).toFixed(4));
    p.style.setProperty("--lo", (mp.lower / 1000).toFixed(4));
    p.style.setProperty("--a9", (mp.adv9 / 1000).toFixed(4));
    $$("[data-adv]", p).forEach(a => { a.textContent = "advance " + (a.dataset.adv === "b" ? mp.adv9 : mp.adv1); });
  });
  $$(".pl", proof).forEach(l => {
    const k = l.dataset.k;
    l.style.setProperty("--y", g.y[k].toFixed(4));
    $("b", l).textContent = unitsTxt(g.v[k]);
  });
  const fp = $(".foot__proof");
  if (fp) {
    fp.style.setProperty("--yb", g0.y.base.toFixed(4));
    fp.style.setProperty("--wt", g0.wt.toFixed(4));
    $$(".pl", fp).forEach(l => { const k = l.dataset.k; l.style.setProperty("--y", g0.y[k].toFixed(4)); $("b", l).textContent = unitsTxt(g0.v[k]); });
  }
  tailCheck();
}
function remeasure() {
  ["loopless", "looped"].forEach(f => { const m = measureFace(f); if (m) Object.assign(DATA.hero.metrics[f], m); });
  applyProof();
}
function setFace(f) {
  proofFace = f;
  proof.dataset.face = f;
  $$(".hero__seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.face === f)));
  $$(".pw", proof).forEach(p => { p.dataset.on = String(p.dataset.face === f); });
  $(".cap-face").textContent = DATA.hero.faces[f].name;
  applyProof();
}
$$(".hero__seg button").forEach(b => b.addEventListener("click", () => setFace(b.dataset.face)));
applyProof();

/* pause hairline drift off screen */
const io = new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle("is-off", !e.isIntersecting)), { rootMargin: "80px" });
$$(".hair").forEach(h => io.observe(h));

/* band 1 style switch: Loopless / Looped / Both, 120ms crossfade */
$$(".spec").forEach(band => {
  const btns = $$(".seg button", band);
  const layers = $$(".layer", band);
  btns.forEach(b => b.addEventListener("click", () => {
    const m = b.dataset.mode;
    btns.forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    band.classList.toggle("is-both", m === "both");
    layers.forEach(l => {
      const on = l.dataset.l === m;
      l.dataset.on = String(on);
      l.setAttribute("aria-hidden", String(!on || m === "both" && l.dataset.l !== "both"));
    });
  }));
});

/* bands 2 and 3 swap faces with a 120ms crossfade: 60ms out, swap, 60ms in */
function swapMode(el, btns, b, apply) {
  const m = b.dataset.mode;
  if (m === el.dataset.mode) return;
  btns.forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  if (reduce) { apply(m); return; }
  el.classList.add("is-swap");
  setTimeout(() => { apply(m); el.classList.remove("is-swap"); }, 60);
}

/* ---------- band 2: the book-page proof and its loop callouts ---------- */
const pageFam = DATA.families.find(f => f.kind === "page");
const leaderDraws = [];
$$(".pp").forEach(pp => {
  const svg = $(".pp__svg", pp);
  const n = (v) => v.toFixed(1);
  const ring = (x, y, r, cls, halo) => (halo ? `<circle class="ld-h" cx="${n(x)}" cy="${n(y)}" r="${n(r)}"/>` : "") + `<circle class="ld ${cls}" cx="${n(x)}" cy="${n(y)}" r="${n(r)}" pathLength="1"/>`;
  const draw = () => {
    const box = pp.getBoundingClientRect(), mode = pp.dataset.mode;
    if (!box.width) return;
    const pageR = $(".pp__page", pp).getBoundingClientRect().right - box.left;
    const infoB = $(".pp__info", pp).getBoundingClientRect().bottom - box.top;
    let out = "";
    const legs = pageFam.callouts.map((c, i) => {
      const t = $(`.lp-t[data-c="${i}"]`, pp), fig = $(`.zg[data-c="${i}"]`, pp);
      const g = fig && $(mode === "loopless" ? ".zg__g--flat" : ".zg__g--loop", fig);
      if (!t || !g) return null;
      /* the small letter: ring centred on its body (baseline minus a third of an em) */
      const fsT = parseFloat(getComputedStyle(t).fontSize), tr = t.getBoundingClientRect();
      const tx = tr.left + tr.width / 2 - box.left, ty = $(".bl", t).getBoundingClientRect().top - box.top - fsT * .32, r = fsT * .8;
      /* the enlarged letter: ring on the loop, from the measured loop centre */
      const F = parseFloat(getComputedStyle(g).fontSize), gr = g.getBoundingClientRect(), gb = $(".bl", g).getBoundingClientRect().top - box.top;
      const zx = gr.left - box.left + c.cx * F, zy = gb - c.cy * F, R = F * .16;
      out += ring(tx, ty, r, "ld--t", false) + ring(zx, zy, R, "ld--z", true);
      return { outer: c.lane === "outer", tx, ty, r, zx, zy, R, top: gb - .62 * F, cy: t.closest("p").getBoundingClientRect().bottom - box.top + 5 };
    }).filter(Boolean);
    if (!mqStack.matches && legs.length) {
      /* leaders: down into the gap under the paragraph, out of the page, then across above the enlarged
         letters and below the info block, then down into the loop. The outer leg (first paragraph,
         rightmost letter) always runs higher than the inner one, so the two never cross. */
      const zTop = Math.min(...legs.map(l => l.top));
      const o = legs.find(l => l.outer) || legs[0], m = legs.find(l => l !== o);
      o.jx = pageR + 32;
      o.yl = Math.min(Math.max(o.cy, infoB + 28), zTop - 30);
      if (m) {
        m.jx = pageR + 16;
        m.yl = Math.max(Math.min(Math.max(m.cy, infoB + 48), zTop - 12), o.yl + 16, o.cy + 14);
      }
      legs.forEach(l => {
        const d = `M${n(l.tx)} ${n(l.ty + l.r)}V${n(l.cy)}H${n(l.jx)}V${n(l.yl)}H${n(l.zx)}V${n(l.zy - l.R)}`;
        out += `<path class="ld-h" d="${d}"/><path class="ld" d="${d}" pathLength="1"/>`;
      });
    }
    svg.innerHTML = out;
  };
  leaderDraws.push(draw);
  const btns = $$(".seg button", pp);
  btns.forEach(b => b.addEventListener("click", () => swapMode(pp, btns, b, m => { pp.dataset.mode = m; draw(); })));
  if ("ResizeObserver" in window) new ResizeObserver(rafThrottle(draw)).observe(pp);
  if (reduce || !("IntersectionObserver" in window)) pp.classList.add("is-in");
  else {
    const o = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { draw(); requestAnimationFrame(() => pp.classList.add("is-in")); o.disconnect(); } }, { threshold: .3 });
    o.observe(pp);
  }
  draw();
});
mqStack.addEventListener ? mqStack.addEventListener("change", () => leaderDraws.forEach(f => f())) : mqStack.addListener(() => leaderDraws.forEach(f => f()));

/* ---------- band 3: the poster lock-up ---------- */
function fitPosters() {
  const F = DATA.families.find(f => f.kind === "poster");
  if (!F) return;
  $$(".lk").forEach(lk => {
    const fam = DATA.hero.faces[lk.dataset.face].family;
    const ka = emWidth(esc(F.poster.a), `font-family:${fam};font-weight:900;font-stretch:62.5%`);
    const kt = emWidth(rich(F.poster.top), `font-family:${fam};font-weight:600;font-stretch:62.5%`);
    const kl = emWidth(esc(F.poster.lat), "font-family:'Sofia Sans Extra Condensed';font-weight:800;text-transform:uppercase");
    if (ka > .5) lk.style.setProperty("--ka", ka.toFixed(4));
    if (kt > .5) lk.style.setProperty("--kt", kt.toFixed(4));
    if (kl > .5) lk.style.setProperty("--kl", kl.toFixed(4));
  });
}
$$(".ps").forEach(ps => {
  const btns = $$(".seg button", ps);
  btns.forEach(b => b.addEventListener("click", () => swapMode(ps, btns, b, m => {
    ps.dataset.mode = m;
    $$(".lk", ps).forEach(lk => lk.setAttribute("aria-hidden", String(m !== "both" && lk.dataset.face !== m)));
  })));
});
fitPosters();

/* the workshop card: cap the width-axis word so its full-width (hover) state ends at the card padding */
function fitWorkshop() {
  $$(".pz-width").forEach(w => {
    const k = emWidth(esc(w.textContent), "font-family:'Noto Sans Thai';font-weight:900;font-stretch:100%");
    if (k > .5) w.style.setProperty("--kw", k.toFixed(4));
  });
}
fitWorkshop();

/* entrance waits for the display faces (max 500ms), so glyphs never swap mid-motion; late fonts re-measure */
(() => {
  const go = () => { remeasure(); root.classList.add("is-ready"); };
  const loads = [
    document.fonts.load("900 100px 'Noto Sans Thai'", "เรื่องเล่าบี่บุ"),
    document.fonts.load("900 100px 'Noto Sans Thai Looped'", "เรื่องเล่าบี่บุ"),
    document.fonts.load("100 100px 'Sofia Sans Extra Condensed'", "RUEANG")
  ];
  Promise.race([Promise.all(loads), new Promise(r => setTimeout(r, 500))]).then(go, go);
  const settle = () => { remeasure(); fitPosters(); fitWorkshop(); leaderDraws.forEach(f => f()); };
  Promise.all(loads.concat([
    document.fonts.load("400 12px 'Noto Sans Thai Looped'", "ดคถภ"),
    document.fonts.load("400 12px 'Noto Sans Thai'", "ดคถภ"),
    document.fonts.load("800 100px 'Sofia Sans Extra Condensed'", "RUEANG DISPLAY"),
    document.fonts.load("400 18px 'IBM Plex Sans Thai'", "ตัวอักษร")
  ])).then(settle, () => {});
  if (document.fonts.ready) document.fonts.ready.then(settle);
})();

/* weight scrub: wght tied 1:1 and linearly to scroll through the band */
const scrub = $(".scrub"), sWord = $(".scrub__word"), sNum = $(".readout__n"), sMark = $(".ruler__mark"), sTrack = $(".ruler__track");
let ticking = false;
function setWeight(w) {
  sWord.style.fontWeight = w.toFixed(1);
  sNum.textContent = Math.round(w);
  sNum.style.fontWeight = Math.round(w);
  sMark.style.transform = `translateX(${((w - 100) / 800) * sTrack.clientWidth}px)`;
}
function onScroll() {
  ticking = false;
  if (reduce) return;
  const r = scrub.getBoundingClientRect();
  const total = scrub.offsetHeight - innerHeight;
  const p = Math.min(1, Math.max(0, -r.top / (total || 1)));
  setWeight(100 + 800 * p);
}
addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
addEventListener("resize", rafThrottle(() => { reduce ? setWeight(600) : onScroll(); tailCheck(); }));
function applyReduce() { reduce = mqReduce.matches; reduce ? setWeight(600) : onScroll(); }
mqReduce.addEventListener ? mqReduce.addEventListener("change", applyReduce) : mqReduce.addListener(applyReduce);
applyReduce();

/* type tester */
(() => {
  const T = DATA.tester, x = $("#t-x"), w = $("#t-w"), s = $("#t-s"), wo = $("#t-wo"), so = $("#t-so"), l = $("#t-l");
  const defSize = () => mqSmall.matches ? T.sizeMobile : T.size;
  const sync = () => {
    x.style.fontWeight = w.value; wo.textContent = w.value;
    x.style.fontSize = s.value + "px"; so.textContent = s.value + " px";
  };
  s.value = defSize(); sync();
  w.addEventListener("input", sync);
  s.addEventListener("input", sync);
  l.addEventListener("click", () => {
    const on = l.getAttribute("aria-checked") !== "true";
    l.setAttribute("aria-checked", String(on));
    if (reduce) { x.style.fontFamily = on ? "var(--f-loop)" : ""; return; }
    x.classList.add("is-swap");
    setTimeout(() => { x.style.fontFamily = on ? "var(--f-loop)" : ""; x.classList.remove("is-swap"); }, 60);
  });
  $("#t-r").addEventListener("click", () => {
    x.textContent = T.text; w.value = T.weight; s.value = defSize();
    l.setAttribute("aria-checked", "false"); x.style.fontFamily = ""; sync();
  });
  x.addEventListener("paste", e => {
    e.preventDefault();
    const t = (e.clipboardData || window.clipboardData).getData("text/plain");
    document.execCommand("insertText", false, t);
  });
})();

/* search: typefaces, posts, custom work, licences */
(() => {
  const btn = $(".search-btn"), form = $(".search"), q = $("#q"), out = $(".search__results"), links = $(".nav__links");
  const items = [
    ...DATA.families.map(f => ({ t: f.name, sub: "Typeface", href: "#fam-" + f.id, hay: f.name + " " + plain(f.desc) + " " + (f.sample || "") })),
    ...DATA.notes.posts.map(p => ({ t: plain(p.title), sub: p.kind === "event" ? "Event" : "Note", href: "#notes", hay: plain(p.title) + " " + p.by })),
    ...DATA.custom.rows.map(r => ({ t: r.th + " " + r.face, sub: "Custom", href: "#custom", hay: r.th + " " + r.face + " " + r.client + " " + r.sector })),
    ...DATA.licensing.rows.map(r => ({ t: r[0] + " license", sub: "Licensing", href: "#licensing", hay: r.map(plain).join(" ") + " license licence" }))
  ];
  const open = (on) => {
    form.hidden = !on; btn.setAttribute("aria-expanded", String(on));
    if (links) links.style.visibility = on ? "hidden" : "";
    if (on) { q.focus(); } else { q.value = ""; out.hidden = true; }
  };
  btn.addEventListener("click", () => open(form.hidden));
  q.addEventListener("input", () => {
    const v = q.value.trim().toLowerCase();
    if (!v) { out.hidden = true; return; }
    const hits = items.filter(i => i.hay.toLowerCase().includes(v)).slice(0, 6);
    out.innerHTML = hits.length ? hits.map(h => `<a href="${h.href}"><span>${esc(h.t)}</span><small>${h.sub}</small></a>`).join("")
      : `<p class="search__empty">ไม่พบคำนี้ ลองค้นด้วย<span class="nw">ชื่อฟอนต์</span> เช่น <span class="nw">Rueang Loop</span></p>`;
    out.hidden = false;
  });
  form.addEventListener("submit", e => { e.preventDefault(); const a = $("a", out); if (a) { a.click(); } });
  out.addEventListener("click", e => { if (e.target.closest("a")) open(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !form.hidden) { open(false); btn.focus(); } });
})();
